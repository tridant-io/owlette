# Local development + CI test infrastructure for roost (wave 1.6 piecemeal).
#
# Provides an S3-compatible gateway that stands in for Cloudflare R2 at dev
# and CI time. The web API's signed-URL issuance + chunk verification + GC
# paths all speak the S3 API; the gateway serves the same dialect so code
# targeting R2 via the aws-sdk-s3 library works unchanged here.
#
# versitygw, not MinIO: MinIO withdrew its public distribution on 2026-09-24
# (the Docker Hub and quay.io images both 401 an anonymous pull, dl.min.io
# answers 410 Gone), which killed the roost-sync CI job before it ran a test.
# versitygw is an Apache-2.0 S3 gateway over a directory that refuses an
# unsigned request the way R2 does — the parity init-buckets checks.
#
# Usage:
#   docker compose -f test/infra/docker-compose.yml up -d
#   # wait a few seconds; `init-buckets` exits once setup is done
#
# Endpoints:
#   S3 API     : http://localhost:9000
#   Credentials: minioadmin / minioadmin (dev-only, never used in prod)
#
# Buckets created match the production R2 layout (infra/r2/r2-bucket-policy.json):
#   owlette-dev-content      — chunk objects at project-content/{siteId}/{hash[:2]}/{hash}
#   owlette-dev-manifests    — manifest bodies at project-manifests/{siteId}/{folderId}/{manifestId}.json
#
# Teardown: `docker compose -f test/infra/docker-compose.yml down -v`
#           The `-v` removes the data volume — destroys all uploaded chunks.

services:
  s3:
    image: versity/versitygw:v1.8.0
    container_name: roost-s3
    ports:
      - "9000:9000"   # s3 API
    environment:
      # dev credentials — hardcoded intentionally so CI runs don't need
      # secrets. production R2 uses its own IAM; this only ever serves
      # local and ephemeral-CI traffic.
      ROOT_ACCESS_KEY: minioadmin
      ROOT_SECRET_KEY: minioadmin
      # the entrypoint assembles `versitygw $VGW_ARGS posix /data`.
      VGW_BACKEND: posix
      VGW_BACKEND_ARG: /data
      VGW_ARGS: "--port :9000"
      # the unauthenticated readiness route the healthcheck below polls.
      VGW_HEALTH: /_/health
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/_/health"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 5s

  # One-shot container that creates the buckets and proves the same
  # deny-anonymous posture as production R2 (infra/r2/r2-bucket-policy.json).
  # Exits 0 on success — run it explicitly with `docker compose run
  # init-buckets` to re-apply after a volume reset.
  init-buckets:
    image: amazon/aws-cli:2.37.2
    container_name: roost-s3-init
    depends_on:
      s3:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
      S3_URL: http://s3:9000
    entrypoint: ["/bin/sh", "/scripts/init.sh"]
    volumes:
      - ./s3/init.sh:/scripts/init.sh:ro

  agent-runner:
    build:
      context: ./agent-runner
      dockerfile: Dockerfile
      additional_contexts:
        repo: ../..
    depends_on:
      s3:
        condition: service_healthy
      init-buckets:
        condition: service_completed_successfully
    environment:
      # The one data-tree override, honoured before osadapter picks a
      # platform arm: the sync modules resolve the data root at import.
      OWLETTE_DATA_ROOT: /tmp/owlette-data
      OWLETTE_ENVIRONMENT: development
      OWLETTE_FIREBASE_PROJECT_ID: demo-test
      OWLETTE_R2_ENDPOINT: http://s3:9000
      OWLETTE_R2_ACCESS_KEY_ID: minioadmin
      OWLETTE_R2_SECRET_ACCESS_KEY: minioadmin
      OWLETTE_R2_CONTENT_BUCKET: owlette-dev-content
      OWLETTE_R2_MANIFESTS_BUCKET: owlette-dev-manifests

volumes:
  s3-data:
    name: roost-s3-data
