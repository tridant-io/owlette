name: playwright e2e

on:
  pull_request:
    paths:
      - 'web/**'
      - 'functions/**'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'storage.rules'
      - 'firebase.json'
      - '.github/workflows/e2e.yml'
  push:
    branches: [main, dev]
    paths:
      - 'web/**'
      - 'functions/**'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'storage.rules'
      - 'firebase.json'
      - '.github/workflows/e2e.yml'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default: these jobs only read the repo.
permissions:
  contents: read

jobs:
  playwright:
    name: run suite against firebase emulators
    runs-on: ubuntu-latest
    # Local steady-state is ~45s after the first build. CI has cold caches
    # on first run plus a pre-build step (next start requires a built .next
    # dir) — 15 minutes gives a comfortable ceiling for the target
    # <6 min wall-clock once caches warm.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Temurin JDK 21 for Firebase emulators (Firestore emulator is a Java
      # binary). The `java` on the stock Ubuntu runner is fine, but pinning
      # to JDK 21 matches the local-dev setup documented in context.md.
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5
        with:
          distribution: temurin
          java-version: '21'

      # Cache the Playwright browser binaries keyed on the @playwright/test
      # version pinned in web/package-lock.json. Cache miss on a Playwright
      # upgrade is the right behavior — forces a fresh `playwright install`.
      # Read from package.json (no node_modules required) so this step can
      # safely run before npm ci.
      - name: resolve playwright version
        id: pw
        working-directory: web
        run: |
          version=$(node -p "require('./package.json').devDependencies['@playwright/test']" | tr -d '^~')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: cache playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: install web deps
        working-directory: web
        run: npm ci --legacy-peer-deps

      # The emulator set now includes `functions`, which loads
      # functions/lib/index.js. `npm run e2e` builds it (emulators:exec does
      # not run firebase.json's predeploy hook), but the build needs
      # functions/node_modules present first.
      - name: install functions deps
        working-directory: functions
        run: npm ci

      - name: install playwright chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: web
        # No --with-deps: GitHub's Ubuntu runners already ship Chromium's
        # system libraries, and --with-deps runs apt-get — which hangs for
        # the whole job timeout whenever the runner's Azure apt mirror is
        # down (2026-08-19: two 30-minute cancellations on PR #94, where a
        # cache miss is guaranteed because browser caches don't cross refs).
        run: npx playwright install chromium

      # `npm run e2e` does the production build then spins up emulators
      # (firebase emulators:exec) wrapping `npx playwright test`. The exec
      # wrapper guarantees teardown even on a crashed test run — critical
      # for CI where lingering emulator processes would block reruns.
      - name: install firebase-tools
        # zizmor: ignore[adhoc-packages] — emulator runner CLI, major-pinned;
        # not a dependency of the code under test.
        run: npm i -g firebase-tools@15 # zizmor: ignore[adhoc-packages]

      - name: run e2e suite
        working-directory: web
        env:
          CI: 'true'
          # sessionManager.server.ts requires SESSION_SECRET ≥32 chars at
          # module-load. The e2e suite runs against the Firestore/Auth
          # emulators — no real sessions, so a fixed deterministic value
          # is fine here. NOT a secret: the emulator doesn't validate it
          # against anything external.
          SESSION_SECRET: 'ci-e2e-emulator-session-secret-do-not-reuse-in-prod'
        run: npm run e2e

      # Cloud Functions trigger integration, in its own emulator invocation.
      # The `functions` emulator is deliberately NOT part of the main suite:
      # onMetricsWrite fires on every machine-doc write, so metrics_history
      # accretes across all ~346 specs and slows the emulator as the run goes
      # on — enough to push a 7-8s spec past its 10s action timeout. `:nobuild`
      # reuses the .next-e2e the step above produced.
      - name: run cloud functions trigger suite
        working-directory: web
        env:
          CI: 'true'
          SESSION_SECRET: 'ci-e2e-emulator-session-secret-do-not-reuse-in-prod'
          # The functions emulator loads the built code to discover definitions
          # under a hard 10s default. That is a budget, not a speed problem:
          # initializeApp is 104ms and the whole lib/index.js load ~530ms, but
          # spawn + scheduling on a loaded runner blows 10s intermittently — the
          # same code passes and fails run to run. The npm script sets this too;
          # it is repeated here so the CI value is visible at the call site.
          FUNCTIONS_DISCOVERY_TIMEOUT: '120'
        run: npm run e2e:functions:nobuild

      # Upload the Playwright HTML report + traces / screenshots / videos on
      # failure. `outputDir` in playwright.config.ts places everything under
      # e2e/.output/; that whole tree is the post-mortem surface.
      - name: upload playwright report
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: web/e2e/.output/
          retention-days: 14

  # firestore.rules regression gate — 97 tests (denials / wave-hardening /
  # baseline) that assert the deployed rules against the emulator. Ran
  # manual-only until now, so a rules regression could reach dev unnoticed;
  # this workflow's path filter already includes `firestore.rules`, so the
  # trigger side needed nothing.
  #
  # A separate job, not a step in `playwright`, for two reasons: it is the fast
  # signal (~3 min vs the suite's 6-30) and a rules-only change gets its verdict
  # without waiting behind a production build, and its `emulators:exec` is
  # self-contained — the playwright job's emulators live and die inside its own
  # exec wrappers, so there is nothing to reuse. Separate runners also mean the
  # two firestore emulators never contend for :8080.
  rules:
    name: firestore rules tests
    runs-on: ubuntu-latest
    # No browser download and no next build — npm ci, then a ~25s jest run
    # inside one emulator boot. 15 minutes is cold-cache headroom, not a target.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The Firestore emulator is a Java binary; JDK 21 matches local dev.
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5
        with:
          distribution: temurin
          java-version: '21'

      # jest + @firebase/rules-unit-testing are web devDependencies. The
      # functions and playwright installs are not needed here.
      - name: install web deps
        working-directory: web
        run: npm ci --legacy-peer-deps

      - name: install firebase-tools
        # zizmor: ignore[adhoc-packages] — emulator runner CLI, major-pinned;
        # not a dependency of the code under test.
        run: npm i -g firebase-tools@15 # zizmor: ignore[adhoc-packages]

      # `npm run test:rules` = firebase emulators:exec --only firestore
      # (project demo-rules-harness, no credentials) wrapping jest with
      # jest.rules.config.js. The harness reads firestore.rules from the repo
      # root and loads it into the emulator, so this tests the checked-in file.
      - name: run firestore rules tests
        working-directory: web
        run: npm run test:rules

  # Lint, types and the Jest unit suite. Until 2026-09-07 none of these ran in
  # CI on any branch: `dev` and `main` auto-deploy, so 4397 unit tests and every
  # type error were gated on nothing but a developer remembering to run them.
  # Two lint errors reached `dev` in cf24beba precisely this way.
  #
  # Separate from `playwright` on purpose — no emulator, no browser, no next
  # build, so it fails in ~2 minutes on the failures it can catch instead of
  # waiting behind a full e2e run.
  checks:
    name: lint, types and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: install web deps
        working-directory: web
        run: npm ci --legacy-peer-deps

      # Vercel Functions run with require(esm) disabled, so a CommonJS dependency
      # that require()s an ESM-only package crashes every route there while
      # Railway (Node 22, require(esm) on) serves fine. Load the firebase-admin
      # entrypoints the way Vercel does.
      - name: firebase-admin loads without require(esm)
        working-directory: web
        run: |
          node --no-experimental-require-module --input-type=module -e "
            for (const m of ['firebase-admin/app', 'firebase-admin/auth', 'firebase-admin/firestore', 'firebase-admin/storage', 'firebase-admin/app-check']) await import(m);
          "

      # `next build` runs its own lint pass, but nothing builds web on PRs.
      - name: lint
        working-directory: web
        run: npm run lint

      # tsc --noEmit against the checked-in tsconfig (strict: true).
      - name: typecheck
        working-directory: web
        run: npm run typecheck

      # The Jest suite. Not the rules tests (jest.rules.config.js, run by the
      # `rules` job against an emulator) — this is the plain unit config.
      - name: unit tests
        working-directory: web
        run: npm test -- --ci
