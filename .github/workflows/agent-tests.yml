name: agent tests

# agent/tests carries ~1150 tests that no workflow ran until this one: the only
# pytest in .github/workflows was py-sdk-publish.yml, which tests sdks/python.
# An agent-only change reached dev and main completely ungated.
#
# Two jobs:
#   * the unit suite runs on all three operating systems the agent ships on.
#     It was Windows-only while agent/src/shared_utils.py imported winreg at
#     module load, since nearly every test module pulls it in transitively and
#     a Linux runner could not collect the suite at all. That import is lazy
#     now and agent/requirements.txt carries sys_platform markers, so a POSIX
#     regression has to be visible here rather than on a customer's machine;
#   * the roost sync engine additionally runs against an S3 stand-in for R2
#     (versitygw, test/infra/docker-compose.yml). That is the only place the
#     manifest-fetch -> chunk-download -> assemble pipeline is exercised
#     against real S3-compatible storage.
on:
  pull_request:
    paths:
      - 'agent/**'
      - 'test/infra/**'
      - '.github/workflows/agent-tests.yml'
  push:
    branches: [main, dev]
    paths:
      - 'agent/**'
      - 'test/infra/**'
      - '.github/workflows/agent-tests.yml'

concurrency:
  group: agent-tests-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default: grant nothing at the top level, widen per job.
permissions: {}

jobs:
  unit:
    name: unit suite on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Which platforms fail is the whole signal of a three-OS matrix, so a red
      # leg must not cancel the others.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            data_root: ''
            pytest_addopts: ''
          # Two differences on the POSIX legs, both permanent.
          #
          # shared_utils builds CONFIG_PATH at module scope through osadapter,
          # which resolves /Library/Application Support/Owlette and
          # /var/lib/owlette — neither writable on a runner. The override
          # names a tree that is, so these legs fail on the regressions they
          # are here to catch rather than on the data root.
          #
          # Four of the five ignored modules are display_manager's, which is
          # never ported (test_no_platform_imports lists it as Windows-only)
          # and asserts its own struct layout at import. Three import it at
          # module scope, so collecting them off Windows fails before a test
          # runs; test_display_enumeration_gate.py imports it inside its bodies
          # and collects, then fails every test on the same assertion.
          #
          # The fifth is swoop: test_swoop_wiring.py imports win32event at
          # module scope. Swoop is Windows-only by construction, not yet —
          # agent/swoop/src/main.rs returns an internal error off Windows and
          # platform/ holds win.rs alone — so this one does not lift when the
          # macOS and Linux agents land. It lifts if swoop Wave 9 ever does.
          #
          # `-x` aborts the leg on either kind, which is why both are --ignore
          # rather than markers. Everything else gates: a POSIX regression
          # fails the leg.
          # Anything Windows-only inside a module that does collect carries
          # @pytest.mark.windows instead, which reports as a skip rather than
          # hiding the whole file.
          - os: macos-15
            data_root: /tmp/owlette-data
            pytest_addopts: >-
              --ignore=agent/tests/test_apply_topology.py
              --ignore=agent/tests/test_display_helper.py
              --ignore=agent/tests/unit/test_display_enumeration_gate.py
              --ignore=agent/tests/unit/test_display_manager.py
              --ignore=agent/tests/integration/test_swoop_wiring.py
          - os: ubuntu-24.04
            data_root: /tmp/owlette-data
            pytest_addopts: >-
              --ignore=agent/tests/test_apply_topology.py
              --ignore=agent/tests/test_display_helper.py
              --ignore=agent/tests/unit/test_display_enumeration_gate.py
              --ignore=agent/tests/unit/test_display_manager.py
              --ignore=agent/tests/integration/test_swoop_wiring.py
    permissions:
      contents: read # checkout
    # The suite itself is ~95s locally. The rest of the budget is the pip
    # install of the pinned agent requirements (cryptography / Pillow /
    # pythonnet wheels) on a cold cache.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      # 3.11 mirrors production: build_installer_full.bat embeds
      # python-3.11.8-embed-amd64 and build-installer.yml pins the same
      # toolchain version. It is also the floor — agent/requirements.txt no
      # longer resolves on 3.9 (Pillow 12.3.0 requires >=3.10), so the
      # "Python 3.9+" line in the docs and pytest.ini's `minversion = 3.9`
      # are both stale.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - name: install agent deps
        working-directory: agent
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          # pytest only, not the whole of requirements-dev.txt: no test module
          # imports pytest-mock / pytest-asyncio / responses / freezegun, and
          # pylint + black + flake8 + mypy are a lint toolchain this job does
          # not run. The version matches the requirements-dev.txt pin.
          python -m pip install pytest==9.1.1

      # Mirrors the local invocation. Run from the repo root so pytest's
      # rootdir resolves to agent/ and agent/pytest.ini applies (strict
      # markers, filterwarnings = error).
      - name: run agent unit tests
        env:
          OWLETTE_DATA_ROOT: ${{ matrix.data_root }}
          # The per-leg collect exclusions, as an env rather than a template
          # expansion inside `run:`. pytest splits it itself, so the command
          # below stays the one a developer types locally.
          PYTEST_ADDOPTS: ${{ matrix.pytest_addopts }}
        run: python -m pytest agent/tests/ -x -q

      # The three modules an import regression breaks first — the service host,
      # the Firestore client and the pairing entrypoint. It gates on all three
      # legs: every Windows-only import below these is behind osadapter or
      # inside the function that uses it, and a new module-scope one is a
      # start-up crash on a customer's machine rather than a failing feature.
      - name: import the service entrypoints
        env:
          PYTHONPATH: agent/src
          OWLETTE_DATA_ROOT: ${{ matrix.data_root }}
        run: python -c "import firebase_client, owlette_service, configure_site"

  sync-pipeline:
    name: roost sync engine against an s3 stand-in
    # ubuntu: the stand-in is a Linux container, and docker + compose v2 are
    # preinstalled here. The tests run on the runner itself — the sys_platform
    # markers in agent/requirements.txt install the sync modules' dependencies
    # on Linux, which is what retired the containerised stub rig this job used
    # to build.
    runs-on: ubuntu-24.04
    permissions:
      contents: read # checkout
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            agent/requirements.txt
            test/infra/agent-runner/requirements.txt

      - name: install agent deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r agent/requirements.txt -r test/infra/agent-runner/requirements.txt

      # test/infra/docker-compose.yml stays the one definition of the stand-in:
      # the image pins, the healthcheck --wait blocks on, and the deny-anonymous
      # parity check init-buckets runs before any test sees a bucket.
      - name: start the s3 stand-in
        run: docker compose -f test/infra/docker-compose.yml up -d --wait s3

      - name: create buckets and check deny-anonymous parity
        run: docker compose -f test/infra/docker-compose.yml run --rm init-buckets

      # The five sync unit modules run here, not only on the unit matrix's
      # ubuntu leg: these are the modules whose POSIX behaviour differs (path
      # separators, the assembler's exec-bit branch), and this is the only job
      # that pairs them with real S3-compatible storage.
      - name: run sync engine tests
        env:
          PYTHONPATH: agent/src
          # shared_utils resolves the data tree through osadapter, whose Linux
          # arm names /var/lib/owlette; the override names a tree the runner
          # can write.
          OWLETTE_DATA_ROOT: /tmp/owlette-data
          # Compose publishes the stand-in on the runner's loopback, not on a
          # container network, so the endpoint is localhost here.
          OWLETTE_R2_ENDPOINT: http://localhost:9000
          OWLETTE_R2_ACCESS_KEY_ID: minioadmin
          OWLETTE_R2_SECRET_ACCESS_KEY: minioadmin
          OWLETTE_R2_CONTENT_BUCKET: owlette-dev-content
          OWLETTE_R2_MANIFESTS_BUCKET: owlette-dev-manifests
        run: >-
          python -m pytest
          agent/tests/unit/test_sync_state.py
          agent/tests/unit/test_sync_version.py
          agent/tests/unit/test_sync_downloader.py
          agent/tests/unit/test_sync_assembler.py
          agent/tests/unit/test_sync_commands.py
          test/infra/agent-runner/tests/test_sync_pipeline_minio.py
          -q

      # The stand-in's and init-buckets' output is not in the pytest output, and an infra
      # failure (bucket init, healthcheck) looks like an opaque connection
      # error from the test side without it.
      - name: dump compose logs
        if: failure()
        run: docker compose -f test/infra/docker-compose.yml logs --no-color

      # -v drops the named s3-data volume; without it a rerun on a
      # self-hosted or reused runner would inherit the previous run's chunks.
      - name: tear down
        if: always()
        run: docker compose -f test/infra/docker-compose.yml down -v
