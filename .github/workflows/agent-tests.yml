name: agent tests

# agent/tests carries ~1150 tests that no workflow ran until this one: the only
# pytest in .github/workflows was py-sdk-publish.yml, which tests sdks/python.
# An agent-only change reached dev and main completely ungated.
#
# Two jobs, because the suite has two halves that need different hosts:
#   * the full suite needs Windows — agent/src/shared_utils.py imports winreg at
#     module load, and nearly every test module pulls it in transitively, so a
#     Linux runner cannot even collect the suite;
#   * the roost sync engine additionally runs on Linux inside the containerised
#     agent-runner in test/infra/, against a MinIO stand-in for R2. That is the
#     only place the manifest-fetch -> chunk-download -> assemble pipeline is
#     exercised against real S3-compatible storage.
on:
  pull_request:
    paths:
      - 'agent/**'
      - 'test/infra/**'
      - '.github/workflows/agent-tests.yml'
  push:
    branches: [main, dev]
    paths:
      - 'agent/**'
      - 'test/infra/**'
      - '.github/workflows/agent-tests.yml'

concurrency:
  group: agent-tests-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default: these jobs only read the repo.
permissions:
  contents: read

jobs:
  unit:
    name: unit suite on windows
    runs-on: windows-latest
    # The suite itself is ~95s locally. The rest of the budget is the pip
    # install of the pinned agent requirements (cryptography / Pillow /
    # pythonnet wheels) on a cold cache.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      # 3.11 mirrors production: build_installer_full.bat embeds
      # python-3.11.8-embed-amd64 and build-installer.yml pins the same
      # toolchain version. It is also the floor — agent/requirements.txt no
      # longer resolves on 3.9 (Pillow 12.3.0 requires >=3.10), so the
      # "Python 3.9+" line in the docs and pytest.ini's `minversion = 3.9`
      # are both stale.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - name: install agent deps
        working-directory: agent
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          # pytest only, not the whole of requirements-dev.txt: no test module
          # imports pytest-mock / pytest-asyncio / responses / freezegun, and
          # pylint + black + flake8 + mypy are a lint toolchain this job does
          # not run. The version matches the requirements-dev.txt pin.
          python -m pip install pytest==9.0.3

      # Mirrors the local invocation. Run from the repo root so pytest's
      # rootdir resolves to agent/ and agent/pytest.ini applies (strict
      # markers, filterwarnings = error).
      - name: run agent unit tests
        run: python -m pytest agent/tests/ -x -q

  sync-pipeline:
    name: roost sync pipeline smoke against minio
    # ubuntu: docker and compose v2 are preinstalled, and the agent-runner
    # image is a Linux python:3.11-slim that puts pywin32 import stubs on
    # PYTHONPATH so the sync modules load without a Windows host.
    runs-on: ubuntu-latest
    # The container build is the long pole — pip installs the agent
    # requirements inside the image with no layer cache on a hosted runner.
    # pytest itself is seconds.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      # The command test/infra/agent-runner/README.md nominates for CI.
      # Compose starts MinIO, waits on its healthcheck, runs init-buckets to
      # completion (bucket creation + the deny-anonymous parity check), then
      # runs agent-runner, whose Dockerfile CMD is the pytest invocation over
      # the five sync unit modules plus test_sync_pipeline_minio.py.
      # --exit-code-from propagates pytest's exit code, so a red test fails
      # this job. The build needs BuildKit for the named `repo` build context
      # in docker-compose.yml — compose v2 uses buildx by default.
      - name: run agent-runner suite
        run: >
          docker compose -f test/infra/docker-compose.yml
          up --build --exit-code-from agent-runner agent-runner

      # MinIO / init-buckets output is not in the agent-runner container's
      # stdout, and an infra failure (bucket init, healthcheck) looks like an
      # opaque connection error from the test side without it.
      - name: dump compose logs
        if: failure()
        run: docker compose -f test/infra/docker-compose.yml logs --no-color

      # -v drops the named minio-data volume; without it a rerun on a
      # self-hosted or reused runner would inherit the previous run's chunks.
      - name: tear down
        if: always()
        run: docker compose -f test/infra/docker-compose.yml down -v
