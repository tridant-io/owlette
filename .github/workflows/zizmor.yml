name: Actions Security

# Static analysis of the GitHub Actions workflows themselves (zizmor). Runs on
# every PR and on pushes to main AND dev so misconfigurations (unpinned actions,
# leaked credentials, injection, over-broad permissions) are caught before they
# ship.
#
# `dev` is not optional here. Scanning only `main` meant every code-scanning
# alert described `main`'s workflows while `dev` — where all work actually lands
# — went unscanned for months, so the Security tab was a report on a branch
# nobody commits to. Same trap as the Dependabot alerts (see
# scripts/check-security-alerts.mjs).
#
# This repo is public, so results are uploaded as SARIF to the Security tab
# (free code scanning). In this mode zizmor reports findings without failing the
# job, so it does not block the existing publish workflows — triage the findings
# (e.g. pinning actions to SHAs) from the Security tab.
on:
  push:
    branches:
      - main
      - dev
  pull_request:
  workflow_dispatch:

# Least-privilege default: grant nothing at the top level, widen per job.
permissions: {}

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      security-events: write # upload SARIF to the Security tab (public repo -> free)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
