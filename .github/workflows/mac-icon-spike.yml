name: mac icon spike

# one-off: compile the light/dark app icon catalog with xcode's actool, which only a macos runner has.
on:
  push:
    branches: [spike/mac-icon]

permissions:
  contents: read

jobs:
  compile:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: compile the catalog
        run: |
          xcodebuild -version
          mkdir -p out
          xcrun actool spike/mac-icon/Assets.xcassets --compile out --platform macosx \
            --minimum-deployment-target 15.0 --app-icon AppIcon \
            --output-partial-info-plist out/partial.plist \
            --output-format human-readable-text --notices --warnings --errors
          xcrun assetutil --info out/Assets.car > out/assetutil.json
          ls -la out
          cat out/partial.plist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mac-icon
          path: out
