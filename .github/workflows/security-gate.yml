name: security gate

# The blocking half of scripts/check-security-alerts.mjs, callable from any
# workflow that ships something.
#
# `security-preflight.yml` covers pushes to dev/main, but every release path in
# this repo is triggered by a TAG, which matches no branch filter — so the
# installer that lands on customer fleets and the packages published to the
# public npm/PyPI registries were reaching users without this check ever having
# run. Release workflows call this first and gate on it.
on:
  workflow_call:
    inputs:
      ref:
        description: ref to grade (defaults to the calling workflow's ref)
        required: false
        type: string
        default: ''

permissions: {}

jobs:
  gate:
    name: no live vulnerability in what we are about to ship
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      vulnerability-alerts: read
      security-events: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'

      - name: self-test the checker
        run: node scripts/check-security-alerts.mjs --test

      - name: resolve open alerts against the ref being shipped
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A tag build's GITHUB_REF is refs/tags/vX.Y.Z, which code scanning
          # has no alerts for. Grade the default branch's analysis instead —
          # a tag is cut from a branch, and its SAST posture is that branch's.
          GITHUB_REF: refs/heads/${{ github.event.repository.default_branch }}
        run: node scripts/check-security-alerts.mjs
