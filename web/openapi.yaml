        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '429': { $ref: '#/components/responses/Problem429' }
        '500': { $ref: '#/components/responses/Problem500' }
    post:
      operationId: createRoost
      tags: [Roost]
      summary: create roost
      description: |
        Creates a new empty roost. Publish a version to populate it.
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      parameters:
        - $ref: '#/components/parameters/RoostVersionHeader'
        - $ref: '#/components/parameters/SiteIdQuery'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRoostRequest' }
      responses:
        '201':
          description: Roost created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Roost' }
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '409': { $ref: '#/components/responses/Problem409' }
        '429': { $ref: '#/components/responses/Problem429' }
        '500': { $ref: '#/components/responses/Problem500' }

  /api/roosts/{roostId}:
    parameters:
      - $ref: '#/components/parameters/RoostIdPath'
      - $ref: '#/components/parameters/RoostVersionHeader'
    get:
      operationId: getRoost
      tags: [Roost]
      summary: fetch roost detail
      description: |
        Returns the roost's current state including `currentVersionId`
        and `previousVersionId`.
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      x-stub: true
      parameters:
        - $ref: '#/components/parameters/SiteIdQuery'
      responses:
        '200':
          description: Roost detail.
          headers:
            RateLimit-Limit:    { $ref: '#/components/headers/RateLimitLimit' }
            RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
            RateLimit-Reset:    { $ref: '#/components/headers/RateLimitReset' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Roost' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '429': { $ref: '#/components/responses/Problem429' }
        '500': { $ref: '#/components/responses/Problem500' }
    patch:
      operationId: patchRoost
      tags: [Roost]
      summary: rename roost or change target machines
      description: |
        Updates the roost's name and/or target machine list. Does not
        affect version history.
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      x-stub: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/IfMatchHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatchRoostRequest' }
      responses:
        '200':
          description: Roost updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Roost' }
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '409': { $ref: '#/components/responses/Problem409' }
        '412': { $ref: '#/components/responses/Problem412' }
        '429': { $ref: '#/components/responses/Problem429' }
        '500': { $ref: '#/components/responses/Problem500' }
    delete:
      operationId: deleteRoost
      tags: [Roost]
      summary: soft-delete roost
      description: |
        Deletes the roost doc + versions subcollection. Content chunks
        in R2 are reclaimed by the chunk gc mark-and-sweep (not
        immediate). 30-day tombstone; chunks referenced only by this
        roost become eligible for gc at that point.
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      parameters:
        - $ref: '#/components/parameters/SiteIdQuery'
      responses:
        '200':
          description: Roost deleted.
          content:
            application/json:
              schema:
                type: object
                required: [deleted, roostId, versionsDeleted]
                properties:
                  deleted:
                    type: boolean
                    example: true
                  roostId:
                    type: string
                  versionsDeleted:
                    type: integer
                    description: Count of version docs purged.
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '412': { $ref: '#/components/responses/Problem412' }
        '429': { $ref: '#/components/responses/Problem429' }
        '500': { $ref: '#/components/responses/Problem500' }

  /api/roosts/{roostId}/rollback:
    parameters:
      - $ref: '#/components/parameters/RoostIdPath'
      - $ref: '#/components/parameters/RoostVersionHeader'
    post:
      operationId: rollbackRoost
      tags: [Roost]
      summary: flip currentVersionId to a previously-published version
      description: |
        Rolls a roost back by flipping its `currentVersionId` pointer to
        a previously-published version. Does NOT mint a new version —
        rollback is a pointer change, not a publish, and versions are
        immutable once written.

        `targetVersion` accepts every form supported by the version-ref
        resolver:
          - alias: `current` | `previous` | `first`
          - stable id: 64-char sha-256 hex, or legacy `vrs_<hex>`
          - number: `3` / `"3"` / `"#3"` / `"v3"`
        Defaults to `previous` when omitted, matching one-click
        "undo last publish".

        Auth: scope `rollback`. The scope grammar separates rollback
        from write so an operator key can be issued with rollback-only
        powers (no new pushes).
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [siteId]
              properties:
                siteId:
                  type: string
                targetVersion:
                  oneOf:
                    - type: string
                    - type: integer
                  nullable: true
                  description: |
                    Version to roll back to. Accepts an alias
                    (`current` | `previous` | `first`), a stable id
                    (64-char sha-256 hex, or legacy `vrs_<hex>`), or a number (`3` / `"v3"` / `"#3"`).
                    Defaults to `previous` when omitted.
      responses:
        '200':
          description: Pointer flipped. Returns the new current/previous ids.
          content:
            application/json:
              schema:
                type: object
                required:
                  - ok
                  - roostId
                  - siteId
                  - currentVersionId
                  - currentVersionNumber
                properties:
                  ok:
                    type: boolean
                  roostId:
                    type: string
                  siteId:
                    type: string
                  currentVersionId:
                    type: string
                  currentVersionNumber:
                    type: integer
                  previousVersionId:
                    type: string
                    nullable: true
        '400':
          description: |
            Validation failed. Codes include `version_ref_malformed`
            (bad `targetVersion` grammar) and `rollback_no_op`
            (target is already the current version).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '422':
          description: |
            Idempotency-Key reuse with a different request body.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '429': { $ref: '#/components/responses/Problem429' }
        '500': { $ref: '#/components/responses/Problem500' }

  # ──────────────────────────────────────────────────────────────────────
  # 3. versions — list, publish, detail, files, and diff are live.
  # ──────────────────────────────────────────────────────────────────────
  /api/roosts/{roostId}/versions/{versionRef}:
    parameters:
      - $ref: '#/components/parameters/RoostIdPath'
      - $ref: '#/components/parameters/VersionRefPath'
      - $ref: '#/components/parameters/RoostVersionHeader'
    get:
      operationId: getVersion
      tags: [Versions]
      summary: fetch full version body
      description: |
        Returns the full oci version body.
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      parameters:
        - $ref: '#/components/parameters/SiteIdQuery'
      responses:
        '200':
          description: Version detail with full layer list.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionDetail' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '429': { $ref: '#/components/responses/Problem429' }
        '500': { $ref: '#/components/responses/Problem500' }
    patch:
      operationId: updateVersionDescription
      tags: [Versions]
      summary: edit a published version's description
      description: |
        Edits the `description` field on an already-published version.
        The version's content (files, chunks) is immutable once
        published — any other body field is rejected with
        `version_content_immutable`.
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [siteId, description]
              properties:
                siteId:
                  type: string
                description:
                  type: string
                  nullable: true
                  maxLength: 500
                  description: |
                    New description. ≤ 500 chars; longer payloads are
                    rejected with 400. Empty / whitespace-only strings
                    are stored as null.
      responses:
        '200':
          description: Updated version metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionSummary' }
        '400':
          description: |
            Validation failed. Returns 400 with code
            `version_content_immutable` if the body contains any field
            other than `siteId` / `description`, or `version_ref_malformed`
            if the path `versionRef` has an invalid grammar.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '429': { $ref: '#/components/responses/Problem429' }
        '500': { $ref: '#/components/responses/Problem500' }

  /api/roosts/{roostId}/versions/{versionRef}/files:
    parameters:
      - $ref: '#/components/parameters/RoostIdPath'
      - $ref: '#/components/parameters/VersionRefPath'
      - $ref: '#/components/parameters/RoostVersionHeader'
    get:
      operationId: listVersionFiles
      tags: [Versions]
      summary: paginated flat file list for a version
      description: |
        Flat, cursor-paginated list of files in a version. Avoids
        downloading the full oci layer array for large roosts.
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      parameters:
        - $ref: '#/components/parameters/SiteIdQuery'
        - $ref: '#/components/parameters/PageSizeQuery'
        - $ref: '#/components/parameters/PageTokenQuery'
        - name: prefix
          in: query
          required: false
          schema:
            type: string
          description: POSIX path prefix filter (e.g. `assets/`).
      responses:
        '200':
          description: Paginated file list.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_page_token]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/VersionFile' }
                  next_page_token:
                    type: string
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '429': { $ref: '#/components/responses/Problem429' }
        '500': { $ref: '#/components/responses/Problem500' }

  /api/roosts/{roostId}/versions/{versionRef}/diff:
    parameters:
      - $ref: '#/components/parameters/RoostIdPath'
      - $ref: '#/components/parameters/VersionRefPath'
      - $ref: '#/components/parameters/RoostVersionHeader'
    get:
      operationId: diffVersions
      tags: [Versions]
      summary: file-level diff between two versions
      description: |
        Returns the `added`, `removed`, and `modified` file sets
        between the path's version (`to`) and the `against` query
        parameter (`from`).
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      parameters:
        - $ref: '#/components/parameters/SiteIdQuery'
        - name: against
          in: query
          required: true
          schema:
            type: string
            pattern: '^([0-9a-f]{64}|vrs_[0-9a-f]{64}|[1-9][0-9]*|[#vV][1-9][0-9]*|current|previous|first)$'
          description: The "from" versionRef to diff against.
      responses:
        '200':
          description: Diff result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiffResult' }
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '429': { $ref: '#/components/responses/Problem429' }
        '500': { $ref: '#/components/responses/Problem500' }

  # ──────────────────────────────────────────────────────────────────────
  # 4. chunks — check/upload-urls/download-urls are live above.
  # mount + referrers are live.
  # ──────────────────────────────────────────────────────────────────────
  /api/chunks/{digest}/mount:
    parameters:
      - $ref: '#/components/parameters/DigestPath'
      - $ref: '#/components/parameters/RoostVersionHeader'
    post:
      operationId: mountChunk
      tags: [Chunks]
      summary: cross-roost chunk mount (zero-byte dedup)
      description: |
        Copies the chunk's virtual reference from `from` (source roost)
        into `toRoostId` (target roost). No bytes moved — R2 key stays
        the same; only the referrer set is updated. This is the dedup
        moat: cross-roost reuse without re-upload.
        See [chunks.md](/docs/api/chunks#cross-roost-mount).
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
          description: Source roost id (caller must hold `read` scope on it).
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MountChunkRequest' }
      responses:
        '200':
          description: Mount succeeded.
          content:
            application/json:
              schema:
                type: object
                required: [digest, siteId, from, to, mounted, zeroByte]
                properties:
                  digest:
                    type: string
                    pattern: '^[0-9a-f]{64}$'
                  siteId: { type: string }
                  from: { type: string }
                  to:   { type: string }
                  mounted: { type: boolean }
                  zeroByte: { type: boolean }
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '402': { $ref: '#/components/responses/Problem402' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '409': { $ref: '#/components/responses/Problem409' }
        '429': { $ref: '#/components/responses/Problem429' }
        '500': { $ref: '#/components/responses/Problem500' }

  /api/chunks/{digest}/referrers:
    parameters:
      - $ref: '#/components/parameters/DigestPath'
      - $ref: '#/components/parameters/RoostVersionHeader'
    get:
      operationId: listChunkReferrers
      tags: [Chunks]
      summary: list versions referencing a chunk
      description: |
        Lists versions currently referencing a chunk. Used by ops
        tooling and the gc mark-and-sweep.
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      parameters:
        - $ref: '#/components/parameters/SiteIdQuery'
        - $ref: '#/components/parameters/PageSizeQuery'
        - $ref: '#/components/parameters/PageTokenQuery'
      responses:
        '200':
          description: Paginated referrers.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_page_token]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ChunkReferrer' }
                  next_page_token:
                    type: string
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '429': { $ref: '#/components/responses/Problem429' }
        '500': { $ref: '#/components/responses/Problem500' }

  # ──────────────────────────────────────────────────────────────────────
  # 5. deployments (rollouts) — rollback, deploy, history, and detail are live.
  # ──────────────────────────────────────────────────────────────────────
  /api/roosts/{roostId}/deploy:
    parameters:
      - $ref: '#/components/parameters/RoostIdPath'
      - $ref: '#/components/parameters/RoostVersionHeader'
    post:
      operationId: deployRoost
      tags: [Roost]
      summary: trigger targeted rollout
      description: |
        Triggers fan-out of a specific version to a subset of the
        roost's target machines. Supports scheduling, dry-run, and
        canary-then-fleet strategy. 202 Accepted — see the response
        `rolloutId` and poll `/api/roosts/{roostId}/deployments/{rolloutId}`.
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/IfMatchHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeployRequest' }
      responses:
        '202':
          description: Rollout queued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeploymentPlan' }
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '409': { $ref: '#/components/responses/Problem409' }
        '412': { $ref: '#/components/responses/Problem412' }
        '429': { $ref: '#/components/responses/Problem429' }
        '500': { $ref: '#/components/responses/Problem500' }

  /api/roosts/{roostId}/deployments:
    parameters:
      - $ref: '#/components/parameters/RoostIdPath'
      - $ref: '#/components/parameters/RoostVersionHeader'
    get:
      operationId: listRoostDeployments
      tags: [Roost]
      summary: list rollout history for a roost
      description: |
        Cursor-paginated rollout history (deploys + rollbacks),
        newest first.
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      parameters:
        - $ref: '#/components/parameters/SiteIdQuery'
        - $ref: '#/components/parameters/PageSizeQuery'
        - $ref: '#/components/parameters/PageTokenQuery'
        - name: stage
          in: query
          required: false
          schema:
            type: string
            enum: [scheduled, canary, complete, aborted]
          description: Filter by rollout stage.
      responses:
        '200':
          description: Paginated deployments.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_page_token]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/DeploymentStatus' }
                  next_page_token:
                    type: string
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '429': { $ref: '#/components/responses/Problem429' }
        '500': { $ref: '#/components/responses/Problem500' }

  /api/roosts/{roostId}/deployments/{rolloutId}:
    parameters:
      - $ref: '#/components/parameters/RoostIdPath'
      - $ref: '#/components/parameters/RolloutIdPath'
      - $ref: '#/components/parameters/RoostVersionHeader'
    get:
      operationId: getRoostDeployment
      tags: [Roost]
      summary: fetch rollout detail (per-machine state)
      description: |
        Per-machine state machine snapshot for one rollout (canary →
        fleet progression).
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      parameters:
        - $ref: '#/components/parameters/SiteIdQuery'
      responses:
        '200':
          description: Rollout detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeploymentStatus' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '429': { $ref: '#/components/responses/Problem429' }
        '500': { $ref: '#/components/responses/Problem500' }

  # ──────────────────────────────────────────────────────────────────────
  # 6. sites (public management surface)
  # ──────────────────────────────────────────────────────────────────────
  /api/sites:
    get:
      operationId: listAccessibleSites
      tags: [Sites]
      summary: list sites accessible to the caller
      description: |
        Lists sites visible to the caller. Session and Firebase ID-token
        callers see the account sites they can access. Scoped API keys
        must carry explicit `site` scopes; scoped keys with only
        roost/machine/chat/user/installer scopes return an empty list.
        Legacy unscoped keys retain the account view and receive the
        legacy-scope deprecation header.

        This endpoint is intentionally unpaginated for the MVP.
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      responses:
        '200':
          description: Accessible sites.
          content:
            application/json:
              schema:
                type: object
                required: [sites]
                properties:
                  sites:
                    type: array
                    items: { $ref: '#/components/schemas/SiteSummary' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '429': { $ref: '#/components/responses/Problem429' }
        '500': { $ref: '#/components/responses/Problem500' }
    post:
      operationId: createSite
      tags: [Sites]
      summary: create a site
      description: |
        Creates a top-level site owned by the caller. Any authenticated,
        active user may create a site — self-serve signup depends on it — so
        there is no role requirement; API-key callers must hold `site=*:admin`.
        Returns 409 `site_already_exists` for a live id, or `site_id_retired`
        for one belonging to a deleted site (ids are not reusable).
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [siteId, name]
              properties:
                siteId: { type: string }
                name: { type: string, maxLength: 200 }
                timezone: { type: string, nullable: true }
                schedulesFollowSiteTime:
                  type: boolean
                  description: |
                    Evaluate process schedules in the site's timezone instead of
                    each machine's own clock. Omit the field to leave the site
                    undecided — omission is not the same as `false`, which
                    records an explicit decision to keep machine clocks.
      responses:
        '201':
          description: Site created.
          content:
            application/json:
              schema:
                type: object
                required: [siteId, name, timezone, owner, createdAt, schedulesFollowSiteTime]
                properties:
                  siteId: { type: string }
                  name: { type: string }
                  timezone: { type: string }
                  owner: { type: string }
                  createdAt: { type: integer, format: int64 }
                  schedulesFollowSiteTime:
                    type: boolean
                    description: |
                      Effective value. `false` when the request omitted the
                      field, in which case no decision was stored.
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '409': { $ref: '#/components/responses/Problem409' }
        '429': { $ref: '#/components/responses/Problem429' }
        '500': { $ref: '#/components/responses/Problem500' }

  /api/sites/{siteId}:
    parameters:
      - $ref: '#/components/parameters/SiteIdPath'
    get:
      operationId: getSite
      tags: [Sites]
      summary: fetch site detail
      description: |
        Returns site metadata. Requires `site=<siteId>:read`.
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      responses:
        '200':
          description: Site detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteDetail' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '429': { $ref: '#/components/responses/Problem429' }
        '500': { $ref: '#/components/responses/Problem500' }
    patch:
      operationId: updateSite
      tags: [Sites]
      summary: update site settings
      description: |
        Updates mutable site settings. Requires `site=<siteId>:admin`.
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 200 }
                timezone: { type: string }
                timeFormat: { type: string, enum: [12h, 24h] }
                schedulesFollowSiteTime:
                  type: boolean
                  description: |
                    Evaluate process schedules in the site's timezone instead of
                    each machine's own clock. `true` is rejected with 400 unless
                    the site ends the request with a non-empty `timezone` — send
                    both fields in one request to set the timezone and enable
                    site time together. `false` is always accepted.
      responses:
        '200':
          description: Site updated, or no mutable fields were supplied.
          content:
            application/json:
              schema:
                type: object
                required: [siteId, changed, updated]
                properties:
                  siteId: { type: string }
                  changed: { type: boolean }
                  updated:
                    type: object
                    description: |
                      The fields written, echoed back. Values are strings except
                      `schedulesFollowSiteTime`, which is a boolean.
                    additionalProperties:
                      oneOf:
                        - { type: string }
                        - { type: boolean }
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '429': { $ref: '#/components/responses/Problem429' }
        '500': { $ref: '#/components/responses/Problem500' }
    delete:
      operationId: deleteSite
      tags: [Sites]
      summary: delete a site
      description: |
        Deletes the top-level site document. Requires
        `site=<siteId>:admin`, AND the caller must be the site **owner** or a
        superadmin — a site admin who does not own the site is refused. The id is
        tombstoned on delete and cannot be reused. Subcollection cascade cleanup
        is deferred from the MVP surface.
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKeyHeader'
      responses:
        '200':
          description: Site deleted.
          content:
            application/json:
              schema:
                type: object
                required: [siteId, deleted]
                properties:
                  siteId: { type: string }
                  deleted: { type: boolean }
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '429': { $ref: '#/components/responses/Problem429' }
        '500': { $ref: '#/components/responses/Problem500' }

  # ──────────────────────────────────────────────────────────────────────
  # 7. machines
  # ──────────────────────────────────────────────────────────────────────
  /api/sites/{siteId}/machines:
    parameters:
      - $ref: '#/components/parameters/SiteIdPath'
    get:
      operationId: listSiteMachines
      tags: [Machines]
      summary: list machines in a site
      description: |
        Machine inventory with online state and current roost summaries.
        The MVP route is intentionally unpaginated and returns all machines
        visible in the site.
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      responses:
        '200':
          description: Unpaginated machine list.
          content:
            application/json:
              schema:
                type: object
                required: [machines]
                properties:
                  machines:
                    type: array
                    items: { $ref: '#/components/schemas/MachineSummary' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '429': { $ref: '#/components/responses/Problem429' }
        '500': { $ref: '#/components/responses/Problem500' }

  /api/sites/{siteId}/machines/{machineId}:
    parameters:
      - $ref: '#/components/parameters/SiteIdPath'
      - $ref: '#/components/parameters/MachineIdSitePath'
    get:
      operationId: getSiteMachine
      tags: [Machines]
      summary: fetch machine detail
      description: |
        Full detail for a single machine: inventory fields, heartbeat,
        telemetry metrics, and reported process snapshots.
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      responses:
        '200':
          description: Machine detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MachineDetail' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '429': { $ref: '#/components/responses/Problem429' }
        '500': { $ref: '#/components/responses/Problem500' }
    delete:
      operationId: deleteSiteMachine
      tags: [Machines]
      summary: remove a machine from a site
      description: |
        Hard-deletes the machine document, its config document, and the
        fixed pending/completed command-map documents. Requires
        `MACHINE_REMOVE`; in the current role matrix this is superadmin-only.
        API-key callers also need `machine=<machineId>:write`.
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKeyHeader'
      responses:
        '200':
          description: Machine removal completed.
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean }
                  data: { $ref: '#/components/schemas/RemoveMachineResult' }
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '422': { $ref: '#/components/responses/Problem422' }
        '429': { $ref: '#/components/responses/Problem429' }
        '500': { $ref: '#/components/responses/Problem500' }

  /api/sites/{siteId}/machines/{machineId}/deployments:
    parameters:
      - $ref: '#/components/parameters/SiteIdPath'
      - $ref: '#/components/parameters/MachineIdSitePath'
    get:
      operationId: listMachineDeployments
      tags: [Machines]
      summary: per-machine deployment history
      description: |
        Lists the current per-roost deployment state for roosts that target
        the machine. The MVP route is intentionally unpaginated.
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      responses:
        '200':
          description: Current per-roost deployment state.
          content:
            application/json:
              schema:
                type: object
                required: [siteId, machineId, deployments]
                properties:
                  siteId: { type: string }
                  machineId: { type: string }
                  deployments:
                    type: array
                    items: { $ref: '#/components/schemas/MachineDeployment' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '429': { $ref: '#/components/responses/Problem429' }
        '500': { $ref: '#/components/responses/Problem500' }

  # ──────────────────────────────────────────────────────────────────────
  # 7b. installer-deploys (api-sprint wave 1 — track 1A)
  #     Public, scoped, api-key-friendly deployment endpoints.
  # ──────────────────────────────────────────────────────────────────────
  /api/sites/{siteId}/deployments:
    parameters:
      - $ref: '#/components/parameters/SiteIdPath'
      - $ref: '#/components/parameters/RoostVersionHeader'
    get:
      operationId: listSiteDeployments
      tags: [Deployments]
      summary: list installer deployments for a site
      description: |
        Cursor-paginated list of installer deployments on a site,
        newest first. Requires `site=<siteId>:read`.
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      parameters:
        - $ref: '#/components/parameters/PageSizeQuery'
        - $ref: '#/components/parameters/PageTokenQuery'
      responses:
        '200':
          description: Paginated deployments.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_page_token]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/InstallerDeploymentSummary' }
                  next_page_token:
                    type: string
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '429': { $ref: '#/components/responses/Problem429' }
        '500': { $ref: '#/components/responses/Problem500' }
    post:
      operationId: createSiteDeployment
      tags: [Deployments]
      summary: create an installer deployment
      description: |
        Creates a deployment record + fans out `install_software`
        commands to each target machine. Requires
        `site=<siteId>:write` and an `Idempotency-Key` header for
        replay-safe retries.

        Per-site target quota is read from `sites/{siteId}.deployQuota`
        (default 100). Requests over the quota return 413 with
        `code: over_quota`.
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, installer_url, installer_name, silent_flags, machines]
              properties:
                name: { type: string }
                installer_url:
                  type: string
                  format: uri
                  description: Must be an `https://` url.
                installer_name: { type: string }
                silent_flags:
                  type: string
                  example: '/SILENT /NORESTART'
                verify_path: { type: string, nullable: true }
                sha256_checksum:
                  type: string
                  pattern: '^[a-f0-9]{64}$'
                  nullable: true
                  description: |
                    SHA-256 hex digest of the installer binary. Strongly
                    recommended — agents 2.11.1+ refuse `install_software`
                    commands that omit it, so deployments created without a
                    checksum will fail on every up-to-date machine.
                parallel_install: { type: boolean }
                close_processes:
                  type: array
                  items: { type: string }
                  description: Process executable names agents should close before install.
                suppress_projects:
                  type: array
                  items: { type: string }
                  description: Project names or paths agents should suppress before install.
                machines:
                  type: array
                  items: { type: string }
                  minItems: 1
      responses:
        '201':
          description: Deployment queued.
          content:
            application/json:
              schema:
                type: object
                required: [deploymentId, siteId, status, targets]
                properties:
                  deploymentId: { type: string }
                  siteId: { type: string }
                  status: { type: string }
                  targets:
                    type: array
                    items: { type: object }
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '413': { $ref: '#/components/responses/Problem413' }
        '422': { $ref: '#/components/responses/Problem422' }
        '429': { $ref: '#/components/responses/Problem429' }
        '500': { $ref: '#/components/responses/Problem500' }

  /api/sites/{siteId}/deployments/{deploymentId}:
    parameters:
      - $ref: '#/components/parameters/SiteIdPath'
      - $ref: '#/components/parameters/DeploymentIdPath'
      - $ref: '#/components/parameters/RoostVersionHeader'
    get:
      operationId: getSiteDeployment
      tags: [Deployments]
      summary: fetch deployment detail
      description: |
        Returns the deployment doc with per-target status array.
        Requires `site=<siteId>:read`.
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      responses:
        '200':
          description: Deployment detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstallerDeploymentDetail' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
