openapi: 3.1.0
info:
  title: Owlette API
  version: 2.3.1
  description: |
    The Owlette API lets you programmatically manage your fleet of Windows machines,
    deploy software, monitor processes, execute tools, and integrate with external systems
    via webhooks.

    ## Authentication

    Protected API requests use scoped credentials. New public integrations
    should send `Authorization: Bearer owk_live_...` or
    `Authorization: Bearer owk_test_...`.
    Create API keys from the Owlette dashboard under Settings > API Keys.
    Scripted `POST /api/keys` creation requires a user session or Firebase ID
    token; API keys cannot bootstrap broader replacement keys.

    Include your API key using one of these methods:

    - **Header** (recommended): `Authorization: Bearer owk_your_key_here`
    - **Legacy header**: `x-api-key: owk_your_key_here`
    - **Compatibility query parameter**: `?api_key=owk_your_key_here`

    Every protected operation includes an Authentication and scopes note. API-key
    callers must hold at least one listed scope and must also satisfy resource
    ownership, site membership, role, and capability checks.

    ## Versioning

    Owlette does not require a new global API-version header for the
    developer-preview MVP. Roost/project-distribution routes may accept the
    existing advisory `Roost-Version: YYYY-MM-DD` header; missing headers can
    emit `X-Roost-Version-Missing: true`.

    ## Rate Limiting

    Responses may include `RateLimit-Limit`, `RateLimit-Remaining`,
    `RateLimit-Reset`, and `Retry-After`. API-key traffic is bucketed by key id
    where available. See `/docs/api/rate-limits`.

    ## Pagination

    Collection endpoints use `page_size` and `page_token`, and return
    `next_page_token` when paginated. Some compatibility routes also accept
    `limit` / `cursor` or return `nextPageToken`. See `/docs/api/pagination`.

    ## Idempotency

    Mutating endpoints that can trigger side effects require or accept
    `Idempotency-Key`. Replays are scoped to the same user, environment,
    method, path, query, and body hash. See `/docs/api/idempotency`.

    ## Errors

    Public errors use `application/problem+json` with stable `code`,
    `requestId`, and `docsUrl` fields. Some dashboard compatibility routes may
    retain a temporary `error` alias during the preview window:

    ```json
    { "error": "Description of what went wrong" }
    ```

    Common HTTP status codes:
    | Code | Meaning |
    |------|---------|
    | 400  | Bad request - missing or invalid parameters |
    | 401  | Unauthorized - missing or invalid API key |
    | 403  | Forbidden - no access to this site or resource |
    | 404  | Not found |
    | 409  | Conflict - resource is in an incompatible state |
    | 429  | Rate limit exceeded |
    | 500  | Internal server error |

    ## Base URLs

    | Environment | URL |
    |-------------|-----|
    | Production  | `https://owlette.app` |
    | Development | `https://dev.owlette.app` |
  license:
    name: FSL-1.1-Apache-2.0
    url: https://fsl.software/FSL-1.1-Apache-2.0.template.md
  contact:
    name: Owlette Support

servers:
  - url: https://owlette.app
    description: Production
  - url: https://dev.owlette.app
    description: Development

security:
  - apiKey: []
  - bearerApiKey: []
  - firebaseIdToken: []

tags:
  # One Title-Case tag per resource. Each operation's `tags:` value must match
  # one of these names exactly (case-sensitive) — an unmatched value spawns a
  # description-less group, and a name with no operations renders as an empty
  # section. Keep this list and the operation tags in sync.
  - name: Sites
    description: List, create, and manage sites, and issue or revoke agent enrollment tokens.
  - name: Machines
    description: Monitor and manage machines in your fleet — inventory, commands, display layout, reboot schedules, and uninstall.
  - name: Processes
    description: Configure and control monitored processes.
  - name: Screenshots
    description: |
      Capture, retrieve, and delete machine screenshots. To capture, send
      `type: capture_screenshot` to the machine commands endpoint
      (`POST .../machines/{machineId}/commands`), then poll the returned
      command for a signed `result.screenshot_url`.
  - name: Deployments
    description: Deploy installers and project distributions to machines; track, retry, and cancel rollouts.
  - name: Presets
    description: Manage site-scoped schedule, reboot, distribution, and deployment-template presets.
  - name: Alerts
    description: Manage alert rules.
  - name: Talons
    description: |
      Automations that watch a site and act on it — a trigger (schedule,
      metric threshold, or event), an optional condition, and one or more
      outputs (email, webhook, hoot directive, process command).
  - name: Logs
    description: Query activity logs.
  - name: Audit Log
    description: |
      Tamper-evident, hash-chained log of every mutating operation
      performed against a site's roost resources.
  - name: Quotas
    description: Storage and bandwidth usage against plan limits.
  - name: Webhooks
    description: |
      HTTP-callback subscriptions for roost events (publish, rollback,
      deploy, quota, etc.). See [webhooks.md](/docs/api/webhooks).
  - name: API Keys
    description: |
      Self-service api key management. Scoped, expiring bearer tokens
      (`owk_live_*` / `owk_test_*`) used to authenticate every public
      roost request. See [authentication.md](/docs/api/authentication).
  - name: Installer
    description: Agent installer versions, platform system presets, and TouchDesigner builds.
  - name: Hoot
    description: AI-powered chat and tool execution.
  - name: Users
    description: Manage platform users — roles, site assignments, and account provisioning.
  - name: Site Members
    description: Manage per-site membership and member roles.
  - name: Roost
    description: |
      Content-addressed project sync (v2). Upload folders once,
      fan out atomic deploys to the fleet, roll back instantly.
      All roost endpoints use RFC 7807 `application/problem+json`
      error envelopes (see the `ProblemDetails` schema).
  - name: Versions
    description: |
      Immutable oci-style roost versions. Every publish creates a new
      version; rollback is a pointer flip. See [versions.md](/docs/api/versions).
  - name: Chunks
    description: |
      Content-addressed blob layer for roost. Dedup lookup, signed
      upload/download urls, cross-roost mount. See [chunks.md](/docs/api/chunks).
  - name: Utility
    description: Identity, version, live event stream, and platform diagnostics.

# Sidebar grouping (Scalar / Redocly `x-tagGroups`). NOTE: every tag declared
# above must appear in exactly one group — Scalar hides any tag that is not in
# a group. Keep this in sync when adding or renaming tags.
x-tagGroups:
  - name: fleet
    tags: [Sites, Machines, Processes, Screenshots]
  - name: deployment
    tags: [Deployments, Presets, Installer]
  - name: roost
    tags: [Roost, Versions, Chunks, Audit Log]
  - name: hoot
    tags: [Hoot]
  - name: monitoring
    tags: [Logs, Alerts, Talons, Quotas]
  - name: access & identity
    tags: [Users, Site Members, API Keys]
  - name: platform
    tags: [Webhooks, Utility]

paths:
  /api/account/api-keys:
    get:
      operationId: listAccountApiKeys
      tags: [API Keys]
      summary: List account API keys
      description: Lists API key metadata for the authenticated superadmin account. Raw keys and hashes are never returned.
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      responses:
        '200':
          description: API keys
          content:
            application/json:
              schema:
                type: object
                required: [success, keys]
                properties:
                  success: { type: boolean }
                  keys:
                    type: array
                    items: { $ref: '#/components/schemas/ApiKey' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '500': { $ref: '#/components/responses/Problem500' }
    post:
      operationId: createAccountApiKey
      tags: [API Keys]
      summary: Create account API key
      description: |
        Creates a superadmin account API key and returns the raw key once.
        New account keys use modern scoped metadata; scoped API-key callers
        carry their existing scopes forward rather than widening them.
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      responses:
        '200':
          description: API key created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiKeyCreateResponse' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '500': { $ref: '#/components/responses/Problem500' }

  /api/account/api-keys/{keyId}:
    parameters:
      - name: keyId
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: revokeAccountApiKey
      tags: [API Keys]
      summary: Revoke account API key
      description: |
        Revokes an API key owned by the authenticated superadmin account. Same
        semantics as `DELETE /api/keys/{keyId}`: immediate, not a delete — the
        key is stamped `revokedAt` and kept — and idempotent.
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      responses:
        '200':
          description: API key revoked
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success: { type: boolean }
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '500': { $ref: '#/components/responses/Problem500' }

  /api/platform/email/config:
    get:
      operationId: getPlatformEmailConfig
      tags: [Utility]
      summary: Get platform email configuration
      description: Returns platform email provider configuration for superadmin diagnostics.
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      responses:
        '200':
          description: Email configuration

  /api/platform/security/kill-switch:
    post:
      operationId: updateSecurityKillSwitch
      tags: [Utility]
      summary: Update security migration kill switch
      description: Flips capability or rate-limit enforcement for a bounded period. Superadmin only.
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      responses:
        '200':
          description: Kill switch updated
        '400':
          description: Validation error

  /api/platform/system-presets:
    get:
      operationId: listPlatformSystemPresets
      tags: [Installer]
      summary: List platform system presets
      description: Lists global system presets shared across sites.
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      responses:
        '200':
          description: System presets
    post:
      operationId: createPlatformSystemPreset
      tags: [Installer]
      summary: Create platform system preset
      description: Creates a global system preset. Superadmin only.
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      responses:
        '201':
          description: Preset created

  /api/platform/system-presets/{presetId}:
    parameters:
      - name: presetId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getPlatformSystemPreset
      tags: [Installer]
      summary: Get platform system preset
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      responses:
        '200':
          description: System preset
    patch:
      operationId: updatePlatformSystemPreset
      tags: [Installer]
      summary: Update platform system preset
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      responses:
        '200':
          description: Preset updated
    delete:
      operationId: deletePlatformSystemPreset
      tags: [Installer]
      summary: Delete platform system preset
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      responses:
        '204':
          description: Preset deleted

  /api/platform/touchdesigner/builds:
    get:
      operationId: listTouchDesignerBuilds
      tags: [Installer]
      summary: List TouchDesigner builds
      description: Fetches recent TouchDesigner installer builds from Derivative's archive page. Superadmin only.
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      responses:
        '200':
          description: TouchDesigner builds

  /api/sites/{siteId}/agent-tokens:
    parameters:
      - name: siteId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: listSiteAgentTokens
      tags: [Sites]
      summary: List site agent refresh tokens
      description: |
        Lists agent refresh token metadata for a site. Superadmin-only via
        `GLOBAL_SETTINGS_WRITE`; API-key callers need site read scope and a
        superadmin owning user.
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      responses:
        '200':
          description: Agent tokens.
          content:
            application/json:
              schema:
                type: object
                required: [tokens, count]
                properties:
                  tokens:
                    type: array
                    items:
                      type: object
                      required: [id]
                      properties:
                        id: { type: string }
                        machineId: { type: string, nullable: true }
                        version: { type: string, nullable: true }
                        createdBy: { type: string, nullable: true }
                        createdAt: { type: string, format: date-time, nullable: true }
                        lastUsed: { type: string, format: date-time, nullable: true }
                        expiresAt: { type: string, format: date-time, nullable: true }
                        agentUid: { type: string, nullable: true }
                  count: { type: integer, minimum: 0 }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '429': { $ref: '#/components/responses/Problem429' }
        '500': { $ref: '#/components/responses/Problem500' }

  /api/sites/{siteId}/agent-tokens/revoke:
    parameters:
      - name: siteId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: revokeSiteAgentTokens
      tags: [Sites]
      summary: Revoke site agent refresh tokens
      description: |
        Revokes one token, all tokens for a machine, or all tokens for a site.
        Superadmin-only via `GLOBAL_SETTINGS_WRITE`; API-key callers need site
        write scope and a superadmin owning user.
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tokenId: { type: string }
                machineId: { type: string }
                all: { type: boolean }
              anyOf:
                - required: [tokenId]
                - required: [machineId]
                - required: [all]
      responses:
        '200':
          description: Tokens revoked.
          content:
            application/json:
              schema:
                type: object
                required: [success, revokedCount, message]
                properties:
                  success: { type: boolean }
                  revokedCount: { type: integer, minimum: 0 }
                  message: { type: string }
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '429': { $ref: '#/components/responses/Problem429' }
        '500': { $ref: '#/components/responses/Problem500' }

  /api/sites/{siteId}/alerts:
    parameters:
      - name: siteId
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: setSiteAlertRules
      tags: [Alerts]
      summary: Set site alert rules
      description: Replaces the alert rules array at `sites/{siteId}/settings/alerts`. Requires `site=<siteId>:write`.
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      responses:
        '200':
          description: Alert rules saved

  /api/sites/{siteId}/talons:
    parameters:
      - $ref: '#/components/parameters/SiteIdPath'
    get:
      operationId: listTalons
      tags: [Talons]
      summary: list the site's talons
      description: |
        Returns every talon on the site, ordered by name. Not paginated — a
        site may hold at most 20 talons. Webhook signing secrets live in a
        server-only collection and are never returned by any endpoint.

        Requires `TALON_MANAGE`; API keys need `site=<siteId>:read`.
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      responses:
        '200':
          description: The site's talons.
          content:
            application/json:
              schema:
                type: object
                required: [talons]
                properties:
                  talons:
                    type: array
                    items: { $ref: '#/components/schemas/Talon' }
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '429': { $ref: '#/components/responses/Problem429' }
        '500': { $ref: '#/components/responses/Problem500' }
    post:
      operationId: createTalon
      tags: [Talons]
      summary: create a talon
      description: |
        Creates a talon at `sites/{siteId}/talons/{talonId}` and, when the
        talon has a `webhook` output, mints its signing secret in the same
        commit. The secret is never returned.

        Additional preconditions, each reported as a problem `code`:

        - `command` outputs may only be authored by a site admin
          (`403 command_output_forbidden`).
        - `webhook` output urls are re-checked against private, loopback, and
          link-local ranges after DNS resolution (`400 invalid_webhook_url`).
        - a `visual_check` condition or a `cortex` output needs a site-level
          LLM key, since both call the model with no user in the loop
          (`400 site_llm_key_required`).
        - a site already holding 20 talons answers `409 talon_limit_reached`.

        Validation failures (`400 invalid_talon`) carry an RFC 7807 `errors`
        map plus a `fieldErrors` array of `{ field, code, message }` for
        inline rendering.

        Requires `TALON_MANAGE`; API keys need `site=<siteId>:write`.
        Accepts `Idempotency-Key`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TalonInput' }
      responses:
        '201':
          description: Talon created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Talon' }
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '409': { $ref: '#/components/responses/Problem409' }
        '422': { $ref: '#/components/responses/Problem422' }
        '429': { $ref: '#/components/responses/Problem429' }
        '500': { $ref: '#/components/responses/Problem500' }

  /api/sites/{siteId}/talons/authored:
    parameters:
      - $ref: '#/components/parameters/SiteIdPath'
      - name: uid
        in: query
        required: true
        description: The author whose talons to list.
        schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,128}$' }
    get:
      operationId: listAuthoredTalons
      tags: [Talons]
      summary: talons one person authored on this site
      description: |
        The departure preview. Removing a member touches nothing under
        `sites/{siteId}`, so their talons survive the removal — but a talon
        with a `cortex` output re-resolves its AUTHOR's site access on every
        run, so it starts failing the moment they lose access. Call this before
        removing a member to learn what that removal will break.

        Names only — this is not a second way to read a talon. Bounded by the
        20-talon per-site cap.

        Requires `TALON_MANAGE`; API keys need `site=<siteId>:read`.
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      responses:
        '200':
          description: What this person authored here.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [siteId, uid, count, talons]
                properties:
                  siteId: { type: string }
                  uid: { type: string }
                  count: { type: integer }
                  talons:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [id, name, enabled]
                      properties:
                        id: { type: string }
                        name: { type: string }
                        enabled: { type: boolean }
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '429': { $ref: '#/components/responses/Problem429' }
        '500': { $ref: '#/components/responses/Problem500' }

  /api/sites/{siteId}/talons/reassign:
    parameters:
      - $ref: '#/components/parameters/SiteIdPath'
    post:
      operationId: reassignTalons
      tags: [Talons]
      summary: hand talon authorship to a successor
      description: |
        Rewrites `createdBy` on one or more talons. Use it before the person
        who wrote them loses access — an unattended run resolves the author's
        site access, not the operator's, so an orphaned author is an
        automation that stops.

        Selection is exactly one of:

        - `fromUid` — every talon on the site currently authored by that uid
          (the departure case);
        - `talonIds` — an explicit list.

        The successor is held to the same bar the store holds every author to:
        an active (non-soft-deleted) account with `TALON_MANAGE` on this site,
        and `MACHINE_EXEC_COMMAND` as well when any selected talon carries a
        `command` output or a `cortex` output with `allowActions`. A refusal is
        `400 successor_invalid`.

        All-or-nothing: nothing is written unless every selected talon exists
        and the successor clears both gates — a partial move would leave some
        automations orphaned with no signal which. Talons already authored by
        the successor come back in `skippedTalonIds` without a write.

        Requires `TALON_MANAGE`; API keys need `site=<siteId>:write`.
        Accepts `Idempotency-Key`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [toUid]
              properties:
                toUid:
                  type: string
                  description: The successor who inherits authorship.
                  pattern: '^[A-Za-z0-9_-]{1,128}$'
                fromUid:
                  type: string
                  description: Move every talon this uid authored. Mutually exclusive with `talonIds`.
                  pattern: '^[A-Za-z0-9_-]{1,128}$'
                talonIds:
                  type: array
                  description: Move exactly these talons. Mutually exclusive with `fromUid`.
                  items: { type: string }
                  maxItems: 20
      responses:
        '200':
          description: What moved.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [siteId, toUid, reassignedTalonIds, skippedTalonIds, reassignedCount]
                properties:
                  siteId: { type: string }
                  toUid: { type: string }
                  reassignedTalonIds:
                    type: array
                    items: { type: string }
                  skippedTalonIds:
                    type: array
                    description: Already authored by the successor — untouched.
                    items: { type: string }
                  reassignedCount: { type: integer }
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '429': { $ref: '#/components/responses/Problem429' }
        '500': { $ref: '#/components/responses/Problem500' }

  /api/sites/{siteId}/talons/{talonId}:
    parameters:
      - $ref: '#/components/parameters/SiteIdPath'
      - $ref: '#/components/parameters/TalonIdPath'
    get:
      operationId: getTalon
      tags: [Talons]
      summary: fetch a talon
      description: |
        Requires `TALON_MANAGE`; API keys need `site=<siteId>:read`.
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      responses:
        '200':
          description: The talon.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Talon' }
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '429': { $ref: '#/components/responses/Problem429' }
        '500': { $ref: '#/components/responses/Problem500' }
    patch:
      operationId: updateTalon
      tags: [Talons]
      summary: toggle or replace a talon
      description: |
        Two shapes, chosen by the body:

        - `{ "enabled": <bool> }` and nothing else flips the talon on or off.
          Enabling re-arms `nextRunAt` from now, so a talon that sat disabled
          for a month does not fire the instant it is switched back on.
        - anything else replaces the caller-owned fields wholesale and is
          revalidated exactly like a create — including the `command`-output
          privilege gate, the webhook-url SSRF check, and the author-LLM-key
          precondition. Omitted optional fields return to their defaults.

        Run bookkeeping (`lastRunAt`, `lastRunStatus`, `consecutiveFailures`)
        is never touched by either shape. `disabledReason` is cleared by the
        enable/disable shape — a person moving the switch settles the question
        of why it moved.

        Requires `TALON_MANAGE`; API keys need `site=<siteId>:write`.
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/TalonEnabledPatch'
                - $ref: '#/components/schemas/TalonInput'
      responses:
        '200':
          description: The updated talon.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Talon' }
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '429': { $ref: '#/components/responses/Problem429' }
        '500': { $ref: '#/components/responses/Problem500' }
    delete:
      operationId: deleteTalon
      tags: [Talons]
      summary: delete a talon
      description: |
        Deletes the talon and its webhook signing secret in one commit. Run
        history in `talon_runs` is kept on purpose — it is an audit surface
        and outlives the talon it describes, so
        `GET /api/sites/{siteId}/talons/{talonId}/runs` keeps answering after
        a delete. A repeat delete answers `404 talon_not_found`.

        Requires `TALON_MANAGE`; API keys need `site=<siteId>:write`.
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      responses:
        '204':
          description: Talon deleted.
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '429': { $ref: '#/components/responses/Problem429' }
        '500': { $ref: '#/components/responses/Problem500' }

  /api/sites/{siteId}/talons/{talonId}/runs:
    parameters:
      - $ref: '#/components/parameters/SiteIdPath'
      - $ref: '#/components/parameters/TalonIdPath'
      - $ref: '#/components/parameters/PageSizeQuery'
      - $ref: '#/components/parameters/PageTokenQuery'
    get:
      operationId: listTalonRuns
      tags: [Talons]
      summary: list a talon's run history
      description: |
        Cursor-paginated execution records for one talon, most recent first.
        The talon does not have to still exist: run records outlive the talon
        they describe, so a deleted talon returns its history rather than 404.

        Requires `TALON_MANAGE`; API keys need `site=<siteId>:read`.
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      responses:
        '200':
          description: A page of run records.
          content:
            application/json:
              schema:
                type: object
                required: [runs, next_page_token]
                properties:
                  runs:
                    type: array
                    items: { $ref: '#/components/schemas/TalonRun' }
                  next_page_token:
                    type: string
                    description: Empty string when there are no more pages.
                  nextPageToken:
                    type: string
                    description: Compatibility alias for `next_page_token`.
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '429': { $ref: '#/components/responses/Problem429' }
        '500': { $ref: '#/components/responses/Problem500' }

  /api/sites/{siteId}/talons/{talonId}/test:
    parameters:
      - $ref: '#/components/parameters/SiteIdPath'
      - $ref: '#/components/parameters/TalonIdPath'
    post:
      operationId: runTalon
      tags: [Talons]
      summary: run a talon on demand
      description: |
        Runs the talon immediately, exactly as a trigger fire would — condition
        gate first, then the outputs — and answers with one summary per machine
        the talon's scope resolved to. The full records are readable from
        `GET /api/sites/{siteId}/talons/{talonId}/runs`.

        Two things differ from a triggered run: the cooldown is bypassed, and
        every recorded run carries `manual: true`. Overlap is still prevented —
        when another execution already holds the talon's slot, the response
        carries a `skipped` summary instead of starting a second live run.

        Not idempotent: calling twice runs the talon twice. Unlike creation it
        is not pro-gated, so a downgraded site can still exercise the talons it
        already has, exactly as the scheduler does.

        Requires `TALON_MANAGE`; API keys need `site=<siteId>:write`.
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      responses:
        '200':
          description: The runs this fire recorded.
          content:
            application/json:
              schema:
                type: object
                required: [runs]
                properties:
                  runs:
                    type: array
                    items: { $ref: '#/components/schemas/TalonRunSummary' }
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '429': { $ref: '#/components/responses/Problem429' }
        '500': { $ref: '#/components/responses/Problem500' }

  /api/sites/{siteId}/machines/{machineId}/screenshots:
    parameters:
      - name: siteId
        in: path
        required: true
        schema: { type: string }
      - name: machineId
