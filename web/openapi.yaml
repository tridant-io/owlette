  # ──────────────────────────────────────────────────────────────────────
  # 9. audit log (tamper-evident hash chain)
  # ──────────────────────────────────────────────────────────────────────
  /api/sites/{siteId}/audit-log:
    parameters:
      - $ref: '#/components/parameters/SiteIdPath'
      - $ref: '#/components/parameters/RoostVersionHeader'
    get:
      operationId: listAuditRecords
      tags: [Audit Log]
      summary: list audit records for a site
      description: |
        Paginated hash-chained audit log. Requires `site:X:read`
        scope. Record kinds match the audit sink taxonomy:
        `signed_url_issued`, `distribution_started`,
        `version_pointer_changed`, `api_key_used`, `gc_run`,
        `api_key_mutated`, `chunk_mutated`, `deployment_mutated`,
        `distribution_mutated`, `process_mutated`, `roost_mutated`,
        `machine_command_dispatched`, `user_mutated`, `site_mutated`,
        `site_member_mutated`, `installer_mutated`, `webhook_mutated`,
        and `chat_mutated`.
        Use `page_size` and `page_token`; legacy `limit` and `cursor`
        are accepted for existing callers. `actor` matches the full actor
        string, for example `apiKey:<keyId>` or `user:<uid>`.
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      parameters:
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: Maximum records per page.
        - name: page_token
          in: query
          required: false
          schema: { type: string }
          description: Previous `next_page_token` value.
        - name: kind
          in: query
          required: false
          schema: { type: string }
          description: Filter by audit kind.
        - name: actor
          in: query
          required: false
          schema: { type: string }
          description: Exact actor string, e.g. `apiKey:<keyId>` or `user:<uid>`.
        - name: since
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: ISO 8601 or unix-ms lower bound on `recordedAt`.
      responses:
        '200':
          description: Paginated audit records.
          content:
            application/json:
              schema:
                type: object
                required: [siteId, records, next_page_token, nextPageToken]
                properties:
                  siteId: { type: string }
                  records:
                    type: array
                    items: { $ref: '#/components/schemas/AuditRecord' }
                  next_page_token:
                    type: string
                  nextPageToken:
                    type: string
                    deprecated: true
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '429': { $ref: '#/components/responses/Problem429' }
        '500': { $ref: '#/components/responses/Problem500' }

  /api/sites/{siteId}/audit-log/{recordHash}:
    parameters:
      - $ref: '#/components/parameters/SiteIdPath'
      - $ref: '#/components/parameters/RecordHashPath'
      - $ref: '#/components/parameters/RoostVersionHeader'
    get:
      operationId: getAuditRecord
      tags: [Audit Log]
      summary: fetch single audit record + verify chain
      description: |
        Returns a single audit record and the hash-chain verification
        result for the record hash plus its immediate predecessor link.
        Non-genesis records report `ok: false` if the predecessor is
        missing or malformed.
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      responses:
        '200':
          description: Audit record + chain proof.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditRecordDetail' }
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '412': { $ref: '#/components/responses/Problem412' }
        '429': { $ref: '#/components/responses/Problem429' }
        '500': { $ref: '#/components/responses/Problem500' }

  # ──────────────────────────────────────────────────────────────────────
  # 10. webhooks (public surface)
  # ──────────────────────────────────────────────────────────────────────
  /api/webhooks:
    get:
      operationId: listWebhookSubscriptions
      tags: [Webhooks]
      summary: list webhook subscriptions
      description: |
        Lists webhook subscriptions on a site.
        Use `page_size` and `page_token`; legacy `limit` and `cursor`
        are accepted for existing clients.
        See [webhooks.md](/docs/api/webhooks).
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      parameters:
        - $ref: '#/components/parameters/RoostVersionHeader'
        - $ref: '#/components/parameters/SiteIdQuery'
        - $ref: '#/components/parameters/PageSizeQuery'
        - $ref: '#/components/parameters/PageTokenQuery'
      responses:
        '200':
          description: Paginated webhook list.
          content:
            application/json:
              schema:
                type: object
                required: [webhooks, next_page_token]
                properties:
                  webhooks:
                    type: array
                    items: { $ref: '#/components/schemas/WebhookDetail' }
                  next_page_token:
                    type: string
                  nextPageToken:
                    type: string
                    deprecated: true
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '429': { $ref: '#/components/responses/Problem429' }
        '500': { $ref: '#/components/responses/Problem500' }
    post:
      operationId: createWebhookSubscription
      tags: [Webhooks]
      summary: create webhook subscription
      description: |
        Creates a webhook subscription. The `signingSecret` is returned
        **once** on creation.

        Requires `site=<siteId>:write` scope and admin of this site.
        Listing and reading subscriptions is open to any member of the
        site; creating, updating, deleting and rotating are not.
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      parameters:
        - $ref: '#/components/parameters/RoostVersionHeader'
        - $ref: '#/components/parameters/SiteIdQuery'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWebhookRequest' }
      responses:
        '201':
          description: Webhook created; `signingSecret` present here only.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookWithSecret' }
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '409': { $ref: '#/components/responses/Problem409' }
        '429': { $ref: '#/components/responses/Problem429' }
        '500': { $ref: '#/components/responses/Problem500' }

  /api/webhooks/{webhookId}:
    parameters:
      - $ref: '#/components/parameters/WebhookIdPath'
      - $ref: '#/components/parameters/RoostVersionHeader'
      - $ref: '#/components/parameters/SiteIdQuery'
    get:
      operationId: getWebhookSubscription
      tags: [Webhooks]
      summary: fetch webhook detail
      description: |
        Returns a webhook subscription. The signing secret is never
        included — use `rotate-secret` to mint a new one.
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      responses:
        '200':
          description: Webhook detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookDetail' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '429': { $ref: '#/components/responses/Problem429' }
        '500': { $ref: '#/components/responses/Problem500' }
    patch:
      operationId: patchWebhookSubscription
      tags: [Webhooks]
      summary: update webhook url / events / paused state
      description: |
        Partial update — any subset of `url`, `events`, `description`,
        `paused` may be specified. Requires `site=<siteId>:write` scope
        and admin of this site.
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/IfMatchHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatchWebhookRequest' }
      responses:
        '200':
          description: Webhook updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookDetail' }
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '412': { $ref: '#/components/responses/Problem412' }
        '429': { $ref: '#/components/responses/Problem429' }
        '500': { $ref: '#/components/responses/Problem500' }
    delete:
      operationId: deleteWebhookSubscription
      tags: [Webhooks]
      summary: delete webhook subscription
      description: |
        Soft-deletes a subscription and pauses future delivery. Delivery
        history remains available for the 30-day retention window.
        Requires `site=<siteId>:write` scope and admin of this site.
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      responses:
        '200':
          description: Subscription soft-deleted.
          content:
            application/json:
              schema:
                type: object
                required: [id, siteId, softDeleted, tombstoneExpiresAt]
                properties:
                  id: { type: string }
                  siteId: { type: string }
                  softDeleted: { type: boolean }
                  tombstoneExpiresAt:
                    type: string
                    format: date-time
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '429': { $ref: '#/components/responses/Problem429' }
        '500': { $ref: '#/components/responses/Problem500' }

  /api/webhooks/{webhookId}/rotate-secret:
    parameters:
      - $ref: '#/components/parameters/WebhookIdPath'
      - $ref: '#/components/parameters/RoostVersionHeader'
      - $ref: '#/components/parameters/SiteIdQuery'
    post:
      operationId: rotateWebhookSecret
      tags: [Webhooks]
      summary: rotate webhook hmac signing secret
      description: |
        Mints a new hmac signing secret. The previous secret is retained
        for a fixed 24-hour verifier grace window. The new secret is
        returned once. Requires `site=<siteId>:write` scope and admin of
        this site.
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      responses:
        '200':
          description: New secret issued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookWithSecret' }
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '429': { $ref: '#/components/responses/Problem429' }
        '500': { $ref: '#/components/responses/Problem500' }

  /api/webhooks/{webhookId}/deliveries:
    parameters:
      - $ref: '#/components/parameters/WebhookIdPath'
      - $ref: '#/components/parameters/RoostVersionHeader'
    get:
      operationId: listWebhookDeliveries
      tags: [Webhooks]
      summary: list webhook delivery history
      description: |
        Paginated delivery history, newest first. Use `page_size` and
        `page_token`; legacy `limit` and `cursor` are accepted for
        existing clients.
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      parameters:
        - $ref: '#/components/parameters/SiteIdQuery'
        - $ref: '#/components/parameters/PageSizeQuery'
        - $ref: '#/components/parameters/PageTokenQuery'
      responses:
        '200':
          description: Paginated delivery list.
          content:
            application/json:
              schema:
                type: object
                required: [deliveries, next_page_token]
                properties:
                  deliveries:
                    type: array
                    items: { $ref: '#/components/schemas/WebhookDelivery' }
                  next_page_token:
                    type: string
                  nextPageToken:
                    type: string
                    deprecated: true
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '429': { $ref: '#/components/responses/Problem429' }
        '500': { $ref: '#/components/responses/Problem500' }

  /api/webhooks/{webhookId}/deliveries/{deliveryId}:
    parameters:
      - $ref: '#/components/parameters/WebhookIdPath'
      - $ref: '#/components/parameters/DeliveryIdPath'
      - $ref: '#/components/parameters/RoostVersionHeader'
      - $ref: '#/components/parameters/SiteIdQuery'
    get:
      operationId: getWebhookDelivery
      tags: [Webhooks]
      summary: fetch single delivery detail
      description: |
        Full delivery detail — request headers, payload, response
        headers, response body (truncated to 4 KiB).
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      responses:
        '200':
          description: Delivery detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookDelivery' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '429': { $ref: '#/components/responses/Problem429' }
        '500': { $ref: '#/components/responses/Problem500' }

  /api/webhooks/{webhookId}/deliveries/{deliveryId}/retry:
    parameters:
      - $ref: '#/components/parameters/WebhookIdPath'
      - $ref: '#/components/parameters/DeliveryIdPath'
      - $ref: '#/components/parameters/RoostVersionHeader'
      - $ref: '#/components/parameters/SiteIdQuery'
    post:
      operationId: retryWebhookDelivery
      tags: [Webhooks]
      summary: manually redeliver a past event
      description: |
        Redelivers the same payload with a fresh signature timestamp
        and a new `deliveryId`. Queued — returns 202 Accepted.
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      responses:
        '202':
          description: Retry queued.
          content:
            application/json:
              schema:
                type: object
                required: [id, webhookId, siteId, retryOf, state, nextAttemptAt]
                properties:
                  id: { type: string }
                  webhookId: { type: string }
                  siteId: { type: string }
                  retryOf: { type: string }
                  state:
                    type: string
                    enum: [pending]
                  nextAttemptAt:
                    type: string
                    format: date-time
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '409': { $ref: '#/components/responses/Problem409' }
        '412': { $ref: '#/components/responses/Problem412' }
        '429': { $ref: '#/components/responses/Problem429' }
        '500': { $ref: '#/components/responses/Problem500' }

  /api/webhooks/probe:
    post:
      operationId: probeWebhookUrl
      tags: [Webhooks]
      summary: synthetic webhook probe
      description: |
        Fires a signed synthetic payload for a chosen webhook event at
        `url` to verify signature verification + reachability. No
        subscription is created.
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      parameters:
        - $ref: '#/components/parameters/RoostVersionHeader'
        - $ref: '#/components/parameters/SiteIdQuery'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookProbeRequest' }
      responses:
        '200':
          description: Probe completed; inspect `status` for target response status.
          content:
            application/json:
              schema:
                type: object
                required: [status, durationMs, deliveryId, event, requestBody, signature, signingSecret]
                properties:
                  status:
                    type: integer
                    nullable: true
                  durationMs: { type: integer, minimum: 0 }
                  deliveryId: { type: string }
                  event: { type: string }
                  requestBody: { type: string }
                  signature: { type: string }
                  signingSecret: { type: string }
                  responseBody:
                    type: string
                  networkError:
                    type: string
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '412': { $ref: '#/components/responses/Problem412' }
        '429': { $ref: '#/components/responses/Problem429' }
        '500': { $ref: '#/components/responses/Problem500' }

  # ──────────────────────────────────────────────────────────────────────
  # 11. utility — whoami, version, sse event stream
  # ──────────────────────────────────────────────────────────────────────
  /api/whoami:
    x-stub: true
    get:
      operationId: whoami
      tags: [Utility]
      summary: resolve caller identity + scopes + rate-limit + quota
      description: |
        Echoes back the resolved auth context. Useful for sdk/cli
        sanity checks. No body; no query params.
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      parameters:
        - $ref: '#/components/parameters/RoostVersionHeader'
      responses:
        '200':
          description: Caller identity snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WhoAmIResponse' }
        '401': { $ref: '#/components/responses/Problem401' }
        '429': { $ref: '#/components/responses/Problem429' }
        '500': { $ref: '#/components/responses/Problem500' }

  /api/version:
    x-stub: true
    get:
      operationId: getApiVersion
      tags: [Utility]
      summary: supported api versions + current default
      description: |
        Publicly readable — no auth required. Lists the current dated
        api version, supported versions, and any in-flight
        deprecations / retirements. Clients use this to pick a
        `Roost-Version` header value.
      security: []
      responses:
        '200':
          description: Version catalog.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionResponse' }
        '500': { $ref: '#/components/responses/Problem500' }

  /api/events/stream:
    get:
      operationId: streamEvents
      tags: [Utility]
      summary: server-sent-events scoped event transport
      description: |
        Scoped SSE transport for local-dev tooling. The MVP stream emits
        `connected` and `keepalive` liveness events only; production event
        fanout and resume buffers are Wave 3 work. Auth may be supplied as
        bearer/API-key headers or `api_key` query param for EventSource-style
        clients. 30-min connection lifetime; 15-s keepalive.
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      parameters:
        - $ref: '#/components/parameters/SiteIdQuery'
        - name: events
          in: query
          required: false
          schema: { type: string }
          description: Comma-separated event type filter.
        - name: api_key
          in: query
          required: false
          schema: { type: string }
          description: API key query-param auth for EventSource clients that cannot set headers.
      responses:
        '200':
          description: SSE stream.
          content:
            text/event-stream:
              schema:
                type: string
                description: Server-Sent Events stream (see [webhooks.md](/docs/api/webhooks) for event payloads).
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '429': { $ref: '#/components/responses/Problem429' }
        '500': { $ref: '#/components/responses/Problem500' }

  # ──────────────────────────────────────────────────────────────────────
  # api-sprint wave 2 — track 2A (machine-api MVP).
  # appended at end-of-paths to avoid line-conflict with parallel work.
  # ──────────────────────────────────────────────────────────────────────

  /api/sites/{siteId}/machines/{machineId}/commands:
    parameters:
      - $ref: '#/components/parameters/SiteIdPath'
      - $ref: '#/components/parameters/MachineIdSitePath'
    post:
      operationId: dispatchMachineCommand
      tags: [Machines, Screenshots]
      summary: queue a command on a machine
      description: |
        Canonical site-scoped command endpoint. Restricted to an
        operator-safe allowlist covering machine power, screenshots,
        live view, display topology, process commands, hoot MCP tool
        calls, and Owlette updates. Requires `machine=<machineId>:write`
        for api-key callers and an idempotency key for all callers;
        session/id-token callers fall through to site membership.

        Returns 409 `machine_offline` if `machines/{machineId}.online`
        is `false` — the command is NOT queued.
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type:
                  type: string
                  enum: [reboot_machine, shutdown_machine, cancel_reboot, dismiss_reboot_pending, capture_screenshot, start_live_view, stop_live_view, restart_process, start_process, kill_process, set_launch_mode, apply_display_topology, ack_display_topology, enumerate_display_modes, test_display_apply, mcp_tool_call, update_owlette]
                params:
                  type: object
                  description: |
                    Per-type parameters. `reboot_machine` /
                    `shutdown_machine` accept `delay_seconds` (>=0).
                    `capture_screenshot` accepts `monitor` ('all' |
                    'primary' | non-negative integer). Process commands
                    accept `process_name` / `process_id`; `set_launch_mode`
                    accepts `process_name`, `mode`, optional `schedules`, and
                    optional `schedulePresetId`; `apply_display_topology`
                    requires `layout` and `applyId`; `ack_display_topology`
                    requires `applyId`; `enumerate_display_modes` and
                    `test_display_apply` do not require params; `mcp_tool_call`
                    accepts `tool_name`, optional `tool_params`, and optional
                    `chat_id`. Other command types accept their
                    command-specific allowlisted fields.
                  properties:
                    delay_seconds: { type: integer, minimum: 0 }
                    monitor:
                      oneOf:
                        - type: string
                          enum: [all, primary]
                        - type: integer
                          minimum: 0
                    process_name: { type: string }
                    process_id: { type: string }
                    mode: { type: string }
                    schedules:
                      type: array
                      items: { type: object }
                    schedulePresetId: { type: string }
                    layout:
                      type: object
                      additionalProperties: true
                      description: Desired display topology for `apply_display_topology`.
                    applyId: { type: string }
                    tool_name: { type: string }
                    tool_params:
                      type: object
                      additionalProperties: true
                    chat_id: { type: string }
                timeout_seconds:
                  type: integer
                  minimum: 1
                  maximum: 600
                  default: 60
      responses:
        '202':
          description: Command queued.
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean }
                  data:
                    type: object
                    required: [commandId, status]
                    properties:
                      commandId: { type: string }
                      status:
                        type: string
                        enum: [pending]
        '400':
          description: |
            Validation failure. Stable code `unsupported_command_type`
            indicates the requested type is outside the public allowlist.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '409':
          description: |
            `machine_offline` — machine is not currently connected; queueing is refused.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '422': { $ref: '#/components/responses/Problem422' }
        '429': { $ref: '#/components/responses/Problem429' }
        '500': { $ref: '#/components/responses/Problem500' }

  /api/sites/{siteId}/machines/{machineId}/commands/{commandId}:
    parameters:
      - $ref: '#/components/parameters/SiteIdPath'
      - $ref: '#/components/parameters/MachineIdSitePath'
      - name: commandId
        in: path
        required: true
        schema:
          type: string
          pattern: '^cmd_[A-Za-z0-9_-]{1,80}$'
        description: Command id returned by the dispatch endpoint.
    get:
      operationId: getMachineCommandStatus
      tags: [Machines, Screenshots]
      summary: poll command status
      description: |
        Returns the current status of a queued command. For completed
        `capture_screenshot` commands, the response includes a freshly-
        minted 1-hour signed read URL under `result.screenshot_url` —
        the URL is per-request and is never persisted.
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      responses:
        '200':
          description: Command status envelope.
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean }
                  data:
                    type: object
                    required: [commandId, status]
                    properties:
                      commandId: { type: string }
                      status:
                        type: string
                        enum: [pending, in_progress, completed, failed]
                      result:
                        type: object
                        description: |
                          Present when status=completed. For
                          capture_screenshot commands, includes
                          `screenshot_url` (1-hour signed) +
                          `expires_at`.
                        properties:
                          screenshot_url: { type: string, format: uri }
                          expires_at: { type: string, format: date-time }
                      error:
                        type: string
                        description: Present when status=failed.
                      createdAt: { type: string, format: date-time, nullable: true }
                      updatedAt: { type: string, format: date-time, nullable: true }
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '429': { $ref: '#/components/responses/Problem429' }
        '500': { $ref: '#/components/responses/Problem500' }

  /api/sites/{siteId}/machines/{machineId}/screenshots/upload-url:
    parameters:
      - $ref: '#/components/parameters/SiteIdPath'
      - $ref: '#/components/parameters/MachineIdSitePath'
    post:
      operationId: issueScreenshotUploadUrl
      tags: [Machines]
      summary: mint a 5-minute signed write url for screenshot upload
      description: |
        Agent-internal helper invoked during a `capture_screenshot`
        command. Returns a 5-minute v4-signed PUT URL plus the
        canonical storage path (`screenshots/{siteId}/{machineId}/...png`)
        the agent should write to. Decoupling upload from command
        queueing keeps multi-megabyte image payloads off the web tier.

        30-day retention is enforced via a separate Firebase Storage
        lifecycle rule (out of scope for this endpoint).
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                contentType:
                  type: string
                  enum: [image/png, image/jpeg]
                  default: image/png
      responses:
        '200':
          description: Signed upload url issued.
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean }
                  data:
                    type: object
                    required: [uploadUrl, storagePath, contentType, expiresAt]
                    properties:
                      uploadUrl: { type: string, format: uri }
                      storagePath: { type: string }
                      contentType: { type: string }
                      expiresAt: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '429': { $ref: '#/components/responses/Problem429' }
        '500': { $ref: '#/components/responses/Problem500' }

  # Public API Wave 1.1 coverage additions.

  /api/cli/device-code:
    post:
      operationId: createCliDeviceCode
      tags: [API Keys]
      summary: start CLI device-code login
      description: |
        Starts a short-lived CLI pairing flow. The CLI displays the
        pairing phrase and polls `/api/cli/device-code/poll` with the
        opaque device code until a signed-in user authorizes it.
      security: []
      responses:
        '200':
          description: Device-code login started.
          content:
            application/json:
              schema:
                type: object
                required:
                  - pairPhrase
                  - deviceCode
                  - verificationUri
                  - pairingUrl
                  - expiresIn
                  - interval
                properties:
                  pairPhrase: { type: string }
                  deviceCode: { type: string }
                  verificationUri: { type: string, format: uri }
                  pairingUrl: { type: string, format: uri }
                  expiresIn: { type: integer, example: 600 }
                  interval: { type: integer, example: 5 }
        '429': { $ref: '#/components/responses/Problem429' }
        '500': { $ref: '#/components/responses/Problem500' }

  /api/cli/device-code/authorize:
    post:
      operationId: authorizeCliDeviceCode
      tags: [API Keys]
      summary: authorize CLI device-code login
      description: |
        Browser-side approval step for CLI pairing. Requires a signed-in
        user or Firebase ID token, validates site access for requested
        scopes, then mints an `owk_*` API key for the waiting CLI.
      security:
        - firebaseIdToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name, scopes]
              properties:
                code: { type: string }
                name: { type: string, minLength: 1, maxLength: 100 }
                ttlDays: { type: integer, minimum: 1, maximum: 365, default: 90 }
                environment:
                  type: string
                  enum: [live, test]
                  default: live
                  deprecated: true
                  description: |
                    Ignored. Every key is minted `live`. Still accepted (and
                    still validated against this enum) so shipped clients that
                    send it are not broken; the value has no effect.
                    Rotation is the one exception — a rotated key inherits the
                    original key's environment.
                scopes:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [resource, id, permissions]
                    properties:
                      resource: { type: string }
                      id: { type: string }
                      permissions:
                        type: array
                        minItems: 1
                        items: { type: string }
      responses:
        '200': { description: Device code authorized and key minted. }
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403':
          description: Forbidden - superadmin required for `user` or `installer` scopes.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '404': { $ref: '#/components/responses/Problem404' }
        '409': { $ref: '#/components/responses/Problem409' }
        '410': { description: Pairing phrase expired. }
        '429': { $ref: '#/components/responses/Problem429' }
        '500': { $ref: '#/components/responses/Problem500' }

  /api/cli/device-code/poll:
    post:
      operationId: pollCliDeviceCode
      tags: [API Keys]
      summary: poll CLI device-code login
      description: |
        CLI polling endpoint for the device-code flow. The device code is
        the polling credential; once authorized, the raw API key is returned
        exactly once and the pairing record is deleted.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceCode]
              properties:
                deviceCode: { type: string }
      responses:
        '200':
          description: Authorized API key returned once.
          content:
            application/json:
              schema:
                type: object
                properties:
                  apiKey: { type: string }
                  keyId: { type: string, nullable: true }
                  name: { type: string, nullable: true }
                  scopes:
                    type: array
                    nullable: true
                    items: { type: object }
                  environment: { type: string, nullable: true }
                  expiresAt:
                    oneOf:
                      - { type: integer }
                      - { type: 'null' }
                  siteId: { type: string, nullable: true }
        '202': { description: Authorization still pending. }
        '400': { $ref: '#/components/responses/Problem400' }
        '404': { $ref: '#/components/responses/Problem404' }
        '410': { description: Device code expired. }
        '429': { $ref: '#/components/responses/Problem429' }
        '500': { $ref: '#/components/responses/Problem500' }

