  # ──────────────────────────────────────────────────────────────────────
  # Users (users-api / api-sprint wave 3 — track 3B)
  # ──────────────────────────────────────────────────────────────────────

  /api/users:
    get:
      tags: [Users]
      summary: list platform users (superadmin only)
      description: |
        Cursor-paginated per AIP-158. Soft-deleted users are excluded by
        default. Requires `user=*:read` scope (superadmin-only at minting)
        or a session/id-token from a superadmin user. Use `page_size`
        and `page_token`; legacy `limit` and `cursor` are accepted for
        existing clients. Responses include
        canonical `next_page_token`; `nextPageToken` is retained as a
        deprecated compatibility alias.
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      parameters:
        - name: page_size
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: page_token
          in: query
          required: false
          schema: { type: string }
        - name: role
          in: query
          required: false
          schema: { type: string, enum: [member, admin, superadmin] }
        - name: site
          in: query
          required: false
          description: filter to users where this siteId is in their `sites[]`
          schema: { type: string }
        - name: includeDeleted
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Page of users
          content:
            application/json:
              schema:
                type: object
                required: [users, next_page_token]
                properties:
                  users:
                    type: array
                    items:
                      type: object
                      properties:
                        uid: { type: string }
                        email: { type: string, nullable: true }
                        role: { type: string, enum: [member, admin, superadmin] }
                        sites: { type: array, items: { type: string } }
                        deletedAt: { type: integer, nullable: true }
                  next_page_token: { type: string }
                  nextPageToken:
                    type: string
                    deprecated: true
        '400': { description: Invalid filter }
        '401': { description: Unauthorized }
        '403': { description: Forbidden (not superadmin) }

  /api/users/deletions:
    get:
      tags: [Users]
      summary: list user-deletion audit events (superadmin only)
      description: |
        Lists user-deletion events from the platform audit log, newest first.
        Covers both self-service deletions (`USER_SELF_DELETE`) and
        superadmin-initiated deletions (`USER_DELETE`); both land in
        `global/audit_log/entries`. Requires `user=*:read` scope
        (superadmin-only at minting) or a session/id-token from a superadmin
        user.
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      parameters:
        - name: limit
          in: query
          required: false
          description: max events to return (clamped 1..200)
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Deletion events (newest first)
          content:
            application/json:
              schema:
                type: object
                required: [deletions]
                properties:
                  deletions:
                    type: array
                    items:
                      type: object
                      required: [id]
                      properties:
                        id: { type: string }
                        uid: { type: string, nullable: true }
                        actorUid: { type: string, nullable: true }
                        capability: { type: string }
                        outcome: { type: string }
                        timestamp: { type: string, format: date-time, nullable: true }
                        denyReason: { type: string, nullable: true }
                        counts: { type: object, nullable: true, additionalProperties: true }
        '401': { description: Unauthorized }
        '403': { description: Forbidden (not superadmin) }

  /api/users/bootstrap:
    post:
      tags: [Users]
      summary: bootstrap the caller user document
      description: |
        Creates `users/{uid}` for the authenticated caller on first sign-in
        or sign-up. Both the uid AND the email are taken from the verified
        session / Firebase Auth record (`getUser(uid).email`), never from the
        request body — a body-supplied `email` is ignored. This route
        intentionally does not use the platform superadmin handler because a
        new caller has no user document yet.
      security:
        - firebaseIdToken: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: |
                The email is not accepted here; it is resolved server-side
                from the verified auth record. Only optional profile fields
                are read from the body.
              properties:
                displayName:
                  type: string
                  maxLength: 200
                timezone:
                  type: string
                  maxLength: 100
      responses:
        '200':
          description: User document created, or already existed.
          content:
            application/json:
              schema:
                type: object
                required: [uid, alreadyExists]
                properties:
                  uid: { type: string }
                  alreadyExists: { type: boolean }
                  email: { type: string, nullable: true }
                  displayName: { type: string, nullable: true }
                  timezone: { type: string, nullable: true }
                  createdAt: { type: integer, nullable: true }
        '400': { description: Invalid bootstrap payload }
        '401': { description: Unauthorized }

  /api/users/{uid}:
    parameters:
      - name: uid
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Users]
      summary: get user detail (superadmin only)
      description: |
        Returns the user's role, site assignments, and metadata. Requires
        `user=*:read` scope or session/id-token from a superadmin user.
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      responses:
        '200': { description: User detail }
        '401': { description: Unauthorized }
        '403': { description: Forbidden (not superadmin) }
        '404': { description: User not found }
    delete:
      tags: [Users]
      summary: soft-delete a user with cascade (superadmin only)
      description: |
        Soft-delete cascade. Sets `deletedAt`, revokes the user's api keys,
        cancels their pending commands (best-effort, async), and transfers
        owned sites to the supplied `successorUid`. Refuses if the user
        owns sites and `successorUid` is not provided (409 `orphan_sites`).

        Each transfer runs as one transaction and the delete FAILS CLOSED: if any
        site cannot be handed over, the request answers 409 `transfer_failed` and
        the account is left completely untouched — no key revoked, no soft-delete
        stamped. Sites that moved before the failure are reported in
        `transferredSites`; they are not rolled back and do not need to be, since
        a re-issued delete re-queries owned sites and skips them. A retry needs a
        NEW `Idempotency-Key`.

        Refuses with 409 `last_superadmin` if this would leave the deployment
        below its floor of one active superadmin.

        Talons the user authored are reported as `authoredTalonCount` on every
        successful delete — an unattended talon run resolves its AUTHOR's site
        access, so deleting the author stops it. They are only moved when
        `reassignTalons=true` is passed as well; the flag is opt-in so a client
        that has always sent `successorUid` for site ownership does not
        silently start rewriting authorship. Per-site refusals (a successor who
        is not a member there) come back in `talonReassignFailures` rather than
        aborting — the account is already deleted by that point.
        `GET /api/users/{uid}/talons` is the preview.

        True-idempotent: re-issuing DELETE on an already-deleted user
        returns 200 with `alreadyDeleted: true`.

        Requires `user=*:admin` scope or session/id-token from a superadmin.
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      parameters:
        - name: successorUid
          in: query
          required: false
          description: |
            Required when the user owns one or more sites. The successor
            must exist, not be soft-deleted, and have role `admin` or
            `superadmin`.
          schema: { type: string }
        - name: reassignTalons
          in: query
          required: false
          description: |
            `true` to also hand `successorUid` the talons this user authored.
            Requires `successorUid`; without it the request is rejected 400.
          schema: { type: string, enum: ['true'] }
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Soft-deleted (or already deleted)
          content:
            application/json:
              schema:
                type: object
                properties:
                  uid: { type: string }
                  alreadyDeleted: { type: boolean }
                  deletedAt: { type: integer }
                  transferredSites:
                    type: array
                    items: { type: string }
                  revokedKeyIds:
                    type: array
                    items: { type: string }
                  authoredTalonCount:
                    type: integer
                    description: Talons this user authored fleet-wide, reported whether or not they moved.
                  reassignedTalonIds:
                    type: array
                    items: { type: string }
                  talonReassignFailures:
                    type: array
                    description: Sites whose talons could not be moved, and why.
                    items:
                      type: object
                      properties:
                        siteId: { type: string }
                        detail: { type: string }
        '400': { description: Invalid successor, or reassignTalons without successorUid }
        '401': { description: Unauthorized }
        '403': { description: Forbidden (not superadmin) }
        '404': { description: User not found }
        '409': { description: Orphan sites (provide successorUid), transfer_failed, or last_superadmin }

  /api/users/{uid}/talons:
    parameters:
      - name: uid
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Users]
      summary: talons this user authored, fleet-wide (superadmin only)
      description: |
        The account-deletion preview. `DELETE /api/users/{uid}` refuses to
        orphan the SITES a user owns but says nothing about the automations
        they wrote, and a talon with a `cortex` output resolves its author's
        site access on every run — so soft-deleting the author stops it.

        One collection-group query rather than a walk of the user's site
        membership: a superadmin's `sites[]` can be empty while they author
        talons across the fleet.

        Requires `user=*:read` scope or session/id-token from a superadmin.
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      responses:
        '200':
          description: What this user authored, with a per-site tally.
          content:
            application/json:
              schema:
                type: object
                properties:
                  uid: { type: string }
                  count: { type: integer }
                  sites:
                    type: array
                    items:
                      type: object
                      properties:
                        siteId: { type: string }
                        count: { type: integer }
                  talons:
                    type: array
                    items:
                      type: object
                      properties:
                        siteId: { type: string }
                        talonId: { type: string }
                        name: { type: string }
                        enabled: { type: boolean }
        '400': { description: Malformed uid }
        '401': { description: Unauthorized }
        '403': { description: Forbidden (not superadmin) }

  /api/users/{uid}/promote:
    parameters:
      - name: uid
        in: path
        required: true
        schema: { type: string }
      - name: Idempotency-Key
        in: header
        required: false
        schema: { type: string }
    post:
      tags: [Users]
      summary: promote a user to admin or superadmin
      description: |
        Atomic role update via Firestore transaction. Requires `user=*:admin`
        scope or session/id-token from a superadmin user.

        `user=*:admin`, not the `user=*:write` its demote sibling takes: this
        route can grant `superadmin`, which confers every capability on every
        site. A key narrowed to `write` must not be able to mint a principal
        stronger than itself.
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [admin, superadmin]
      responses:
        '200': { description: Promoted (or noop if already at requested role) }
        '400': { description: Invalid role / soft-deleted target }
        '401': { description: Unauthorized }
        '403': { description: Forbidden (not superadmin) }
        '404': { description: User not found }

  /api/users/{uid}/demote:
    parameters:
      - name: uid
        in: path
        required: true
        schema: { type: string }
      - name: Idempotency-Key
        in: header
        required: false
        schema: { type: string }
    post:
      tags: [Users]
      summary: demote a user to member
      description: |
        Atomic role update via Firestore transaction. Refuses to demote the
        last active superadmin (409 `last_superadmin`). Requires
        `user=*:write` scope or session/id-token from a superadmin user.
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      responses:
        '200': { description: Demoted (or noop if already member) }
        '400': { description: Soft-deleted target }
        '401': { description: Unauthorized }
        '403': { description: Forbidden (not superadmin) }
        '404': { description: User not found }
        '409': { description: Last superadmin (cannot demote) }

  /api/users/{uid}/assign-sites:
    parameters:
      - name: uid
        in: path
        required: true
        schema: { type: string }
      - name: Idempotency-Key
        in: header
        required: false
        schema: { type: string }
    post:
      tags: [Users]
      summary: assign sites to a user
      description: |
        Adds siteIds to `users/{uid}.sites[]` via `arrayUnion` (idempotent
        at the field level). Validates each siteId exists; rejects the
        whole batch if any are unknown. Requires `user=*:write` scope or
        session/id-token from a superadmin user.
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [siteIds]
              properties:
                siteIds:
                  type: array
                  items: { type: string }
                  minItems: 1
                  maxItems: 100
      responses:
        '200': { description: Sites assigned }
        '400': { description: Validation failure / unknown_site }
        '401': { description: Unauthorized }
        '403': { description: Forbidden (not superadmin) }
        '404': { description: User not found }

  /api/users/{uid}/remove-sites:
    parameters:
      - name: uid
        in: path
        required: true
        schema: { type: string }
      - name: Idempotency-Key
        in: header
        required: false
        schema: { type: string }
    post:
      tags: [Users]
      summary: remove sites from a user
      description: |
        Removes siteIds from `users/{uid}.sites[]` via `arrayRemove`. Best-
        effort cancels pending commands the user issued on those sites
        (failure does not block the response). Requires `user=*:write`
        scope or session/id-token from a superadmin user.
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [siteIds]
              properties:
                siteIds:
                  type: array
                  items: { type: string }
                  minItems: 1
                  maxItems: 100
      responses:
        '200': { description: Sites removed }
        '400': { description: Validation failure }
        '401': { description: Unauthorized }
        '403': { description: Forbidden (not superadmin) }
        '404': { description: User not found }
        '409': { description: User owns one or more of the named sites; transfer ownership first }

  # ──────────────────────────────────────────────────────────────────────
  # Site members (users-api / api-sprint wave 3 — track 3B)
  # ──────────────────────────────────────────────────────────────────────

  /api/sites/{siteId}/members:
    parameters:
      - name: siteId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Site Members]
      summary: list site members with derived per-site role
      description: |
        Membership lives only on `users/{uid}.sites[]` (per the api-sprint
        wave 0.2 decision). This endpoint resolves it by querying users
        where `sites array-contains <siteId>` and additionally surfaces
        the site `owner` if they aren't already in that set. Per-site
        role is derived: `owner` (always wins), then `superadmin`,
        `admin` (global admin assigned to the site), else `member`.

        A member's other site memberships are deliberately not returned —
        they would disclose the site ids of every other organization that
        member belongs to.

        Requires `site=<siteId>:admin` scope or session/id-token from an
        admin of this site.
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      responses:
        '200':
          description: Members
          content:
            application/json:
              schema:
                type: object
                properties:
                  members:
                    type: array
                    items:
                      type: object
                      properties:
                        uid: { type: string }
                        email: { type: string, nullable: true }
                        role:
                          type: string
                          enum: [owner, superadmin, admin, member]
                        globalRole:
                          type: string
                          enum: [member, admin, superadmin]
                        displayName: { type: string, nullable: true }
        '401': { description: Unauthorized }
        '403': { description: Forbidden (not site admin) }
        '404': { description: Site not found or no access }
    post:
      tags: [Site Members]
      summary: add a member to a site
      description: |
        Writes `sites/{siteId}/members/{uid}` — the document that grants
        site access — with the requested per-site role, and adds siteId to
        the target's legacy `users/{uid}.sites[]` while that field still
        exists.

        The role is PER SITE. `role: 'admin'` makes them an admin of this
        site and nothing else; their account role is untouched and they
        gain nothing on any other site. It is always honoured, so
        `roleHonored` is always `true` — retained only for response-shape
        stability.

        Identify the target by **exactly one** of `uid` or `email`.
        `email` is trimmed and lowercased, then resolved to a uid through
        Firebase Auth; supplying both, or neither, is a `400`, and an
        address with no auth user is the same `404` as an unknown uid.

        Requires `site=<siteId>:admin` scope or session/id-token from an
        admin of this site.
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                uid: { type: string }
                email: { type: string, format: email, maxLength: 254 }
                role: { type: string, enum: [admin, member] }
              oneOf:
                - required: [uid]
                - required: [email]
      responses:
        '200': { description: Member added }
        '400': { description: Validation failure }
        '401': { description: Unauthorized }
        '403': { description: Forbidden (not site admin) }
        '404': { description: User or site not found }

  /api/sites/{siteId}/transfer-ownership:
    parameters:
      - name: siteId
        in: path
        required: true
        schema: { type: string }
      - name: Idempotency-Key
        in: header
        required: false
        schema: { type: string }
    post:
      tags: [Site Members]
      summary: transfer site ownership to another user
      description: |
        Moves ownership of a site to `successorUid` in a single Firestore
        transaction, writing the new `sites/{siteId}/members/{uid}` role and the
        legacy `sites/{siteId}.owner` field together.

        **Only the current owner or a superadmin may transfer.** A site admin is
        admitted by the route's capability gate and then refused by the
        transaction with `403 not_owner`: administering a site and owning it are
        different things, the same line `SITE_DELETE` draws. The ownership check
        is made from the site document read INSIDE the transaction, so a transfer
        racing another transfer is serialised rather than interleaved — the
        loser re-reads, finds the owner changed, and is refused.

        The successor need not already be a member; they are made one by the same
        transaction. The outgoing owner is demoted to `admin` and KEEPS their
        membership — handing a site over is not eviction. Transferring to the
        current owner is `409 successor_already_owner` rather than a silent no-op.

        Requires `site=<siteId>:admin` scope or session/id-token from the site's
        owner (or a superadmin).
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [successorUid]
              properties:
                successorUid:
                  type: string
                  description: uid receiving ownership
      responses:
        '200': { description: Ownership transferred }
        '400': { description: Validation failure, or successor is soft-deleted }
        '401': { description: Unauthorized }
        '403': { description: Forbidden (caller is not the owner or a superadmin) }
        '404': { description: Site or successor not found }
        '409': { description: Successor already owns the site, or the site records no owner }

  /api/sites/{siteId}/members/{uid}:
    parameters:
      - name: siteId
        in: path
        required: true
        schema: { type: string }
      - name: uid
        in: path
        required: true
        schema: { type: string }
      - name: Idempotency-Key
        in: header
        required: false
        schema: { type: string }
    patch:
      tags: [Site Members]
      summary: change a member's per-site role
      description: |
        Sets the member's role on THIS site only, leaving their global role
        untouched. Before this endpoint existed there was no per-site role to
        change — it was derived from the global role at read time, so making
        someone an admin on one site meant promoting them globally, on every
        site they belong to. That is the leak per-site roles close.

        `owner` is not assignable here. Ownership moves only through
        `POST /api/sites/{siteId}/transfer-ownership`, and the owner is refused
        as a target as well, so an admin can neither promote themselves into
        ownership (`400`) nor demote the owner out of it
        (`409 cannot_change_owner_role`). Both are enforced inside the
        transaction that performs the write.

        Requires `site=<siteId>:admin` scope or session/id-token from an admin
        of this site.
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [admin, member] }
      responses:
        '200': { description: Role changed }
        '400': { description: Validation failure (including role=owner) }
        '401': { description: Unauthorized }
        '403': { description: Forbidden (not site admin) }
        '404': { description: User is not a member of this site }
        '409': { description: Target is the site owner }
    delete:
      tags: [Site Members]
      summary: remove a member from a site
      description: |
        Removes siteId from the target user's `users/{uid}.sites[]` via
        `arrayRemove`. Refuses to remove the site owner (409
        `cannot_remove_owner`) — use `DELETE /api/users/{uid}?successorUid=<uid>`
        to transfer ownership instead.

        Talons the departing member authored survive the removal — nothing
        under `sites/{siteId}` is touched — but a talon with a `cortex` output
        re-resolves its AUTHOR's site access on every run, so it starts failing
        the moment they lose access. `talonCount` is therefore always in the
        response, and `?talonSuccessorUid=<uid>` moves those talons to a
        successor *before* the membership write, so the automation never has a
        moment where its author has no access. A refused successor answers
        `400 successor_invalid` and the membership is left intact.
        `GET /api/sites/{siteId}/talons/authored?uid=<uid>` is the preview.

        True-idempotent: removing a non-member returns 200 with
        `wasMember: false`.

        Requires `site=<siteId>:admin` scope or session/id-token from an
        admin of this site. Reassignment additionally requires `TALON_MANAGE`.
      security:
        - apiKey: []
        - bearerApiKey: []
        - firebaseIdToken: []
      parameters:
        - name: talonSuccessorUid
          in: query
          required: false
          description: |
            Move the talons this member authored on this site to that user
            before removing them. Held to the same bar as any talon author.
          schema: { type: string }
      responses:
        '200':
          description: Member removed (or was not a member)
          content:
            application/json:
              schema:
                type: object
                properties:
                  siteId: { type: string }
                  uid: { type: string }
                  wasMember: { type: boolean }
                  talonCount:
                    type: integer
                    description: Talons this member authored here, reported whether or not they moved.
                  reassignedTalonIds:
                    type: array
                    items: { type: string }
        '400': { description: Malformed or refused talonSuccessorUid }
        '401': { description: Unauthorized }
        '403': { description: Forbidden (not site admin, or lacks TALON_MANAGE) }
        '404': { description: User or site not found }
        '409': { description: Cannot remove site owner }

# ════════════════════════════════════════════════════════════════════════
# Components
# ════════════════════════════════════════════════════════════════════════
components:
  securitySchemes:
    apiKey:
      type: apiKey
      name: x-api-key
      in: header
      description: |
        Legacy api key header — supported for backwards compatibility.
        New integrations should use `bearerApiKey` instead
        (`Authorization: Bearer owk_live_...`).
    bearerApiKey:
      type: http
      scheme: bearer
      bearerFormat: owk_live_* / owk_test_*
      description: |
        Preferred auth mechanism for the Owlette public API. Send the
        scoped api key as `Authorization: Bearer owk_live_<secret>`
        (production) or `Authorization: Bearer owk_test_<secret>`
        (sandbox). See [authentication.md](/docs/api/authentication).
    firebaseIdToken:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID Token
      description: |
        Firebase ID token issued to the authenticated user or agent device.
        Used by dashboard and agent requests. First-party
        clients only — external integrations use `apiKey` /
        `bearerApiKey` instead.

  parameters:
    SiteIdQuery:
      name: siteId
      in: query
      required: true
      schema:
        type: string
      description: The site ID

    MachineIdQuery:
      name: machineId
      in: query
      required: true
      schema:
        type: string
      description: The machine ID

    ProcessIdPath:
      name: processId
      in: path
      required: true
      schema:
        type: string
      description: The process configuration ID

    DeploymentIdPath:
      name: deploymentId
      in: path
      required: true
      schema:
        type: string
      description: The deployment ID

    PresetIdPath:
      name: presetId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{1,128}$'
      description: The preset ID

    TemplateIdPath:
      name: templateId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{1,128}$'
      description: The deployment template ID

    TalonIdPath:
      name: talonId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{1,128}$'
      description: The talon ID

    RoostIdPath:
      name: roostId
      in: path
      required: true
      schema:
        type: string
      description: The roost ID (deploy unit).

    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 255
      description: |
        Client-generated idempotency key. If the server has seen the same
        key on this method, path, query, and request body within the replay
        window, it returns the original response instead of re-executing.
        Replayed responses include `Idempotent-Replayed: true`.

    RequiredIdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        maxLength: 255
      description: |
        Required client-generated idempotency key. If the server has seen
        the same key on this method, path, query, and request body within
        the replay window, it returns the original response instead of
        re-executing. Replayed responses include `Idempotent-Replayed: true`.

    RoostVersionHeader:
      name: Roost-Version
      in: header
      required: false
      schema:
        type: string
        pattern: '^\d{4}-\d{2}-\d{2}$'
        example: '2026-04-22'
      description: |
        Selects a dated api version. Optional in wave 1; required once
        a second version ships. See [`GET /api/version`](#tag/utility/operation/getApiVersion).

    IfMatchHeader:
      name: If-Match
      in: header
      required: false
      schema:
        type: string
      description: |
        Optimistic concurrency token. Pass the prior resource version
        (e.g. a `currentVersionId` or opaque etag) to have the server
        reject the mutation with 412 if the resource has changed.

    PageSizeQuery:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      description: Maximum items per page.

    PageTokenQuery:
      name: page_token
      in: query
      required: false
      schema:
        type: string
      description: |
        Opaque cursor from the prior response's `next_page_token`. An
        empty string means no more pages.

    KeyIdPath:
      name: keyId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
      description: The API key id. Current scoped keys use UUID values; legacy records may use older ids.

    WebhookIdPath:
      name: webhookId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{8,64}$'
      description: Webhook subscription id.

    DeliveryIdPath:
      name: deliveryId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9_.-]{1,256}$'
      description: Webhook delivery id.

    RolloutIdPath:
      name: rolloutId
      in: path
      required: true
      schema:
        type: string
        pattern: '^rollout_[A-Z0-9]+$'
      description: Rollout (deployment) id (ulid-encoded).

    SiteIdPath:
      name: siteId
      in: path
      required: true
      schema:
        type: string
      description: Site id (path param variant; distinct from the `siteId` query parameter).

    MachineIdSitePath:
      name: machineId
      in: path
      required: true
      schema:
        type: string
      description: Machine id (path param on `/api/sites/{siteId}/machines/{machineId}`).

    VersionRefPath:
      name: versionRef
      in: path
      required: true
      schema:
        type: string
      description: |
        Addresses a version on the roost. Accepts any of:
          - a stable content-addressed id: 64-char sha-256 hex
          - a legacy stable id alias: `vrs_<hex>`
          - a version number: `3`, `#3`, `v3`, or `V3`
          - a roost-relative alias: `current`, `previous`, `first`
        Malformed refs return 400 `version_ref_malformed`;
        unmatched refs return 404 `version_not_found`.

    DigestPath:
      name: digest
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9a-f]{64}$'
      description: Chunk digest as lowercase sha-256 hex, without `sha256:`.

    RecordHashPath:
      name: recordHash
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9a-f]{64}$'
      description: Audit record hash as raw lowercase sha-256 hex.

  headers:
    RateLimitLimit:
      description: Window limit for the active rate-limit bucket.
      schema:
        type: integer
    RateLimitRemaining:
      description: Calls remaining in the current window.
      schema:
        type: integer
    RateLimitReset:
      description: Seconds until the current window fully resets.
      schema:
        type: integer
    RetryAfter:
      description: Seconds the client should wait before retrying (429 only).
      schema:
        type: integer
    RoostRateLimitedReason:
      description: |
        Which rate-limit bucket tripped (`global-rate`, `endpoint-rate`,
        `key-rate`, `site-concurrency`). Present only on 429.
      schema:
        type: string
        enum: [global-rate, endpoint-rate, key-rate, site-concurrency]
    IdempotentReplayed:
      description: Present with value `true` when a response was replayed from the idempotency cache.
      schema:
        type: string
        enum: ['true']

  responses:
    Problem400:
      description: Validation failed.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Problem401:
      description: Authentication required.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Problem402:
      description: |
        Payment required — the site's roost storage quota would be
        exceeded (`code: quota_exceeded`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Problem403:
      description: |
        Forbidden — cross-site access, a missing capability, or an api key
        without the required scope (`code: scope_insufficient`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Problem404:
      description: Resource not found.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Problem409:
      description: Conflict (e.g. no previous version to roll back to).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Problem412:
      description: Precondition failed (optimistic concurrency miss on finalize).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Problem413:
      description: |
        Payload too large or quota-bound size limit exceeded — e.g. a
        deployment with more target machines than the per-site quota
        allows. The body carries `code: over_quota` and a `quota` block
        describing the active limit.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Problem422:
      description: |
        Request semantics violated a constraint — e.g. an `Idempotency-Key`
        was reused with a different request body (`code: idempotency_key_mismatch`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Problem429:
      description: Rate limited.
      headers:
        RateLimit-Limit:           { $ref: '#/components/headers/RateLimitLimit' }
        RateLimit-Remaining:       { $ref: '#/components/headers/RateLimitRemaining' }
        RateLimit-Reset:           { $ref: '#/components/headers/RateLimitReset' }
        Retry-After:               { $ref: '#/components/headers/RetryAfter' }
        Roost-Rate-Limited-Reason: { $ref: '#/components/headers/RoostRateLimitedReason' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Problem500:
      description: Internal server error.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Problem501:
      description: |
        Endpoint is scaffolded but the backing infrastructure is not yet
        provisioned (current state for roost stubs pending wave 0.5/0.6).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }

  schemas:
    SuccessResponse:
      description: Generic success envelope returned by simple mutating endpoints that have no resource body to send back.
      type: object
      properties:
        success:
          type: boolean
          example: true

    ErrorResponse:
      description: Legacy error envelope. Public endpoints return RFC 7807 `application/problem+json` (see `ProblemDetails`); this shape only remains on a few compatibility routes.
      type: object
      properties:
        error:
          type: string
      example:
        error: Description of what went wrong

    HootConversationSummary:
      description: Metadata for a single hoot conversation, without its message history.
      allOf:
        - $ref: '#/components/schemas/CortexConversationSummary'

    HootConversation:
      description: A hoot conversation including its full message history.
      allOf:
        - $ref: '#/components/schemas/CortexConversation'

    CortexConversationSummary:
      description: Metadata for a single Hoot conversation, without its message history.
      type: object
      properties:
        conversationId: { type: string }
        title: { type: string, nullable: true }
        siteId: { type: string }
        machineId: { type: string, nullable: true }
        ownerUid: { type: string }
        createdAt: { type: string, format: date-time, nullable: true }
        updatedAt: { type: string, format: date-time, nullable: true }
        deletedAt: { type: string, format: date-time, nullable: true }
        messageCount: { type: integer }

    CortexConversation:
      description: A Hoot conversation including its full message history.
      allOf:
        - $ref: '#/components/schemas/CortexConversationSummary'
        - type: object
          properties:
            messages:
              type: array
              items:
                type: object
                properties:
                  role: { type: string, enum: [user, assistant, system] }
                  content: { type: string }
                  timestamp: { type: string, format: date-time, nullable: true }

    Site:
      description: A site — a logical grouping of machines in your fleet.
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        machineCount:
          type: integer

    Machine:
      description: A machine (agent install) registered to a site, with its live online and heartbeat state.
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        online:
          type: boolean
        lastHeartbeat:
          type: string
          format: date-time
        agentVersion:
          type: string
        os:
          type: string

    Process:
      description: A monitored process configured on a machine — launch mode, schedule, and live runtime status.
      type: object
      required: [processId, name, exe_path, launch_mode, status]
      properties:
        processId:
          type: string
        id:
          type: string
          nullable: true
          deprecated: true
        name:
          type: string
        exe_path:
          type: string
        file_path:
          type: string
        cwd:
          type: string
        priority:
          type: string
        visibility:
          type: string
        time_delay:
          type: string
        time_to_init:
          type: string
        relaunch_attempts:
          type: string
        autolaunch:
          type: boolean
        launch_mode:
          type: string
          enum: [off, always, scheduled]
        schedules:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/ProcessScheduleBlock' }
        schedule:
          type: object
          nullable: true
          additionalProperties: true
        schedulePresetId:
          type: string
          nullable: true
        status:
          type: string
        pid:
          type: integer
          nullable: true
        responsive:
          type: boolean
        last_updated:
          nullable: true
          oneOf:
            - type: string
            - type: number

    ProcessScheduleBlock:
      description: One scheduled on/off block for a process — which days and time ranges it should be running.
      type: object
      required: [days, ranges]
      properties:
        name:
          type: string
        colorIndex:
          type: number
        days:
          type: array
          items: { type: string }
        ranges:
          type: array
          items:
            type: object
            required: [start, stop]
            properties:
              start: { type: string }
              stop: { type: string }

    Schedule:
      description: A recurring weekly schedule expressed as days plus a start and end time.
      type: object
      properties:
        days:
          type: array
          items:
            type: string
            enum: [mon, tue, wed, thu, fri, sat, sun]
        startTime:
          type: string
          description: 24-hour time (HH:MM)
          example: "08:00"
        endTime:
          type: string
          description: 24-hour time (HH:MM)
          example: "18:00"

    ScheduleTimeRange:
      description: A single start/end time range within a schedule.
      type: object
      required: [start, end]
      properties:
        start:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          example: "09:00"
        end:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          example: "17:00"

    ScheduleBlock:
      type: object
      required: [days, ranges]
      properties:
        name: { type: string }
        colorIndex: { type: number }
        days:
          type: array
          items:
            type: string
            enum: [mon, tue, wed, thu, fri, sat, sun]
        ranges:
          type: array
          items: { $ref: '#/components/schemas/ScheduleTimeRange' }

    SchedulePresetInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        blocks:
          type: array
          items: { $ref: '#/components/schemas/ScheduleBlock' }
          default: []
        isBuiltIn:
          type: boolean
          default: false
        order:
          type: number
          default: 0

    SchedulePresetPatch:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        blocks:
          type: array
          items: { $ref: '#/components/schemas/ScheduleBlock' }
        isBuiltIn: { type: boolean }
        order: { type: number }

    SchedulePreset:
      allOf:
        - $ref: '#/components/schemas/SchedulePresetInput'
        - type: object
          required: [id, blocks, isBuiltIn, order, createdBy, createdAt]
          properties:
            id: { type: string }
            createdBy: { type: string }
            createdAt:
              type: string
              format: date-time
              nullable: true
            updatedAt:
              type: string
              format: date-time
              nullable: true

    RebootScheduleEntry:
      type: object
      required: [id, days, time]
      properties:
        id: { type: string }
        days:
          type: array
          items:
            type: string
            enum: [mon, tue, wed, thu, fri, sat, sun]
        time:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          example: "03:00"

    RebootPresetInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        entries:
          type: array
          items: { $ref: '#/components/schemas/RebootScheduleEntry' }
          default: []
        isBuiltIn:
          type: boolean
          default: false
        order:
          type: number
          default: 0

    RebootPresetPatch:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        entries:
          type: array
          items: { $ref: '#/components/schemas/RebootScheduleEntry' }
        isBuiltIn: { type: boolean }
        order: { type: number }

    RebootPreset:
      allOf:
        - $ref: '#/components/schemas/RebootPresetInput'
        - type: object
          required: [id, entries, isBuiltIn, order, createdBy, createdAt]
          properties:
            id: { type: string }
            createdBy: { type: string }
            createdAt:
              type: string
              format: date-time
              nullable: true
            updatedAt:
              type: string
              format: date-time
              nullable: true

    # talons (automation)
    TalonScheduleEntry:
      type: object
      required: [id, days, time]
      properties:
        id:
          type: string
          maxLength: 128
          description: Client-generated row id, stable across edits.
        days:
          type: array
          minItems: 1
          items:
            type: string
            enum: [mon, tue, wed, thu, fri, sat, sun]
          description: De-duplicated and re-sorted into canonical week order on save.
        time:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          example: '09:30'
          description: |
            24-hour clock time, resolved in the **site's** timezone — one talon
            can span machines in several zones and its schedule must have one
            meaning.

    TalonScheduleEntriesTrigger:
      type: object
      required: [type, entries]
      properties:
        type: { type: string, enum: [schedule] }
        entries:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: '#/components/schemas/TalonScheduleEntry' }

    TalonIntervalTrigger:
      type: object
      required: [type, intervalMinutes]
      properties:
        type: { type: string, enum: [schedule] }
        intervalMinutes:
          type: integer
          minimum: 5
          maximum: 1440
          description: |
            Floor is 5, or 15 when the condition is a `visual_check` (each run
            costs a screenshot round-trip plus a model call). Anything longer
            than a day belongs in `entries` as a fixed clock time.

    TalonThresholdTrigger:
      type: object
      required: [type, metric, operator, value]
      properties:
        type: { type: string, enum: [threshold] }
        metric:
          type: string
          enum:
            - cpu_percent
            - memory_percent
            - disk_percent
            - gpu_percent
            - cpu_temp
            - gpu_temp
            - network_latency
            - network_packet_loss
        operator:
          type: string
          enum: ['>', '<', '>=', '<=']
        value: { type: number }

    TalonEventTrigger:
      type: object
      required: [type, eventTypes]
      properties:
        type: { type: string, enum: [event] }
        eventTypes:
          type: array
          minItems: 1
          items:
            type: string
            enum:
              - process_crash
              - process_start_failed
              - machine_offline
              - display_monitor_removed
              - display_apply_failed
              - display_auto_revert_fired
              - display_sync_lost
              - display_drift
              - display_monitor_swapped
              - display_mosaic_disabled
              - display_apply_refused_mosaic
              - display_monitor_added
              - display_apply_succeeded
          description: De-duplicated on save.

    TalonTrigger:
      description: |
        What makes the talon fire. A `schedule` trigger takes either `entries`
        (fixed clock times) or `intervalMinutes` — never both.
      oneOf:
        - $ref: '#/components/schemas/TalonScheduleEntriesTrigger'
        - $ref: '#/components/schemas/TalonIntervalTrigger'
        - $ref: '#/components/schemas/TalonThresholdTrigger'
        - $ref: '#/components/schemas/TalonEventTrigger'

    TalonCondition:
      description: |
        Optional gate between the trigger and the outputs. Defaults to `none`
        when omitted. A `visual_check` captures a fresh screenshot and asks the
        vision model whether `expectation` holds, so it requires a site-level
        LLM key.
      oneOf:
        - type: object
          required: [type]
          properties:
            type: { type: string, enum: [none] }
        - type: object
          required: [type, expectation]
          properties:
            type: { type: string, enum: [visual_check] }
            expectation:
              type: string
              maxLength: 500
              description: Natural-language statement the screenshot must satisfy.
            monitor:
              type: integer
              minimum: 0
              maximum: 64
              description: '0 (default) = all monitors combined, 1 = primary, 2 = second, and so on.'

    TalonOutput:
      description: |
        What the talon does when it fires. `command` outputs may only be
        authored by a site admin; `cortex` outputs require the talon's author
        to have an LLM key saved in their own account settings; `webhook` urls
        must be https and must not resolve to a private, loopback, or
        link-local address.
      oneOf:
        - type: object
          required: [type]
          properties:
            type: { type: string, enum: [email] }
        - type: object
          required: [type, url]
          properties:
            type: { type: string, enum: [webhook] }
            url:
              type: string
              format: uri
              description: |
                Signed with a per-talon `whsec_*` secret held server-side. The
                secret is never returned by any endpoint.
        - type: object
          required: [type, directive]
          properties:
            type: { type: string, enum: [cortex] }
            directive: { type: string, maxLength: 1000 }
            allowActions:
              type: boolean
              default: false
              description: |
                Let the unattended turn use tier-2 tools (process control,
                service management, screenshots) instead of the read-only
                tier-1 set. Site admins only — the same privilege a `command`
                output takes. Tier-3 tools stay unreachable on this path.
        - type: object
          required: [type, commandType]
          description: |
            Exactly one of `processId` or `processName` is required — a command
            with no target fails on every run.
          properties:
            type: { type: string, enum: [command] }
            commandType:
              type: string
              enum: [restart_process, start_process, stop_process]
            processId: { type: string, maxLength: 256 }
            processName: { type: string, maxLength: 256 }

    TalonScope:
      type: object
      required: [machineIds]
      properties:
        machineIds:
          type: array
          nullable: true
          minItems: 1
          items: { type: string }
          description: '`null` — or an omitted `scope` — means every machine in the site.'

    TalonInput:
      type: object
      required: [name, trigger, outputs]
      description: |
        The caller-owned half of a talon. Server-owned fields
        (`schemaVersion`, `createdBy`, `createdVia`, `createdAt`, `nextRunAt`,
        run bookkeeping) are rejected as unknown fields. `PATCH` bodies are
        full replacements — omitted optional fields return to their defaults.
      properties:
        name: { type: string, maxLength: 80 }
        description: { type: string, maxLength: 500 }
        enabled: { type: boolean, default: true }
        trigger: { $ref: '#/components/schemas/TalonTrigger' }
        condition: { $ref: '#/components/schemas/TalonCondition' }
        outputs:
          type: array
          minItems: 1
          maxItems: 5
          items: { $ref: '#/components/schemas/TalonOutput' }
        scope: { $ref: '#/components/schemas/TalonScope' }
        cooldownMinutes:
          type: integer
          minimum: 0
          maximum: 1440
          default: 60
          description: Minimum gap between runs.

    TalonPresetTemplate:
      type: object
      required: [name, trigger, outputs]
      description: |
        The talon-shaped payload a preset carries — `TalonInput` MINUS `scope`
        and `enabled`, both of which are rejected. Machine ids mean nothing in
        another site, and a template does not decide whether the talon it
        creates is armed. Validated by the talon validator, so every talon
        bound applies here too.
      properties:
        name: { type: string, maxLength: 80 }
        description: { type: string, maxLength: 500 }
        trigger: { $ref: '#/components/schemas/TalonTrigger' }
        condition: { $ref: '#/components/schemas/TalonCondition' }
        outputs:
          type: array
          minItems: 1
          maxItems: 5
          items: { $ref: '#/components/schemas/TalonOutput' }
        cooldownMinutes:
          type: integer
          minimum: 0
          maximum: 1440
          default: 60

    TalonPresetInput:
      type: object
      required: [name, template]
      properties:
        name: { type: string, maxLength: 80 }
        description: { type: string, maxLength: 500 }
        template: { $ref: '#/components/schemas/TalonPresetTemplate' }
        isBuiltIn:
          type: boolean
          default: false
        order:
          type: number
          default: 0

    TalonPresetPatch:
      type: object
      properties:
        name: { type: string, maxLength: 80 }
        description: { type: string, maxLength: 500 }
        template: { $ref: '#/components/schemas/TalonPresetTemplate' }
        isBuiltIn: { type: boolean }
        order: { type: number }

    TalonPreset:
      allOf:
        - $ref: '#/components/schemas/TalonPresetInput'
        - type: object
          required: [id, template, isBuiltIn, order, createdBy, createdAt]
          properties:
            id: { type: string }
            createdBy: { type: string }
            createdAt:
              type: string
              format: date-time
              nullable: true
            updatedAt:
              type: string
              format: date-time
              nullable: true

    TalonEnabledPatch:
      type: object
      required: [enabled]
      additionalProperties: false
      description: |
        Toggle-only `PATCH` body. Exactly one key: any additional key makes the
        request a full `TalonInput` update instead.
      properties:
        enabled: { type: boolean }

    Talon:
      allOf:
        - $ref: '#/components/schemas/TalonInput'
        - type: object
          required:
            - id
            - schemaVersion
            - enabled
            - condition
            - scope
            - cooldownMinutes
            - createdBy
            - createdVia
            - consecutiveFailures
          properties:
            id: { type: string }
            schemaVersion: { type: integer, enum: [1] }
            createdBy:
              type: string
              description: uid of the authoring user.
            createdVia:
              type: string
              enum: [ui, cortex]
            chatId:
              type: string
              description: Present when `createdVia` is `cortex` — the chat the talon came from.
            createdAt:
              type: string
              format: date-time
              nullable: true
            updatedAt:
              type: string
              format: date-time
              nullable: true
            nextRunAt:
              type: string
              format: date-time
              nullable: true
              description: Schedule triggers only — when the scheduler next evaluates the talon.
            lastRunAt:
              type: string
              format: date-time
              nullable: true
            lastRunStatus:
              type: string
              nullable: true
              enum: [running, succeeded, failed, skipped, missed]
            lastRunId:
              type: string
              nullable: true
            consecutiveFailures:
              type: integer
              description: Reset to 0 on any successful run; drives auto-disable backoff.
            disabledReason:
              type: string
              nullable: true
              enum:
                - creator_not_a_user
                - creator_deleted
                - creator_access_revoked
                - creator_missing_llm_key
                - repeated_failures
              description: >-
                Why the SYSTEM switched this talon off. `null` while it is
                enabled, and cleared whenever a person toggles it either way.
                The four `creator_*` reasons are unrecoverable and disable the
                talon on the first occurrence; `repeated_failures` is the
                consecutive-failure backoff.

    TalonRun:
      type: object
      required: [id, talonId, talonName, status, outputs, manual]
      properties:
        id: { type: string }
        talonId: { type: string }
        talonName:
          type: string
          description: Denormalized so the run list renders without a talon lookup.
        triggerType:
          type: string
          nullable: true
          enum: [schedule, threshold, event]
        triggerSummary:
          type: string
          nullable: true
          description: 'Human-readable trigger summary, e.g. `cpu_percent > 90`.'
        machineId: { type: string, nullable: true }
        machineName: { type: string, nullable: true }
        status:
          type: string
          enum: [running, succeeded, failed, skipped, missed]
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        durationMs: { type: integer, nullable: true }
        condition:
          type: object
          nullable: true
          required: [type, verdict]
          description: Outcome of the condition gate, when the talon had one.
          properties:
            type: { type: string, enum: [none, visual_check] }
            verdict: { type: string, enum: [pass, fail] }
            confidence:
              type: number
              description: Vision-model confidence, 0–1, when the condition produced one.
            reason: { type: string }
            screenshotPath: { type: string }
            screenshotUrl:
              type: string
              format: uri
              description: Short-lived signed read url for `screenshotPath`.
        outputs:
          type: array
          description: Per-output delivery result.
          items:
            type: object
            required: [type, status]
            properties:
              type: { type: string, enum: [email, webhook, cortex, command] }
              status: { type: string, enum: [sent, failed, skipped] }
              detail: { type: string }
              httpStatus:
                type: integer
                description: Webhook outputs only.
              error: { type: string }
              disabledReason:
                type: string
                enum:
                  - creator_not_a_user
                  - creator_deleted
                  - creator_access_revoked
                  - creator_missing_llm_key
                description: >-
                  Set when THIS output's failure was unrecoverable and cost the
                  talon its enabled state.
        correlationId:
          type: string
          nullable: true
          description: Ties the run to its audit-log entries and downstream commands.
        chatId: { type: string, nullable: true }
        error: { type: string, nullable: true }
        disabledReason:
          type: string
          nullable: true
          enum:
            - creator_not_a_user
            - creator_deleted
            - creator_access_revoked
            - creator_missing_llm_key
            - repeated_failures
          description: >-
            Set when this run is the one that switched the talon off, so the run
            history explains itself. Mirrors `Talon.disabledReason`.
        manual:
          type: boolean
          description: True when an operator ran the talon on demand rather than the trigger firing.

    TalonRunSummary:
      type: object
      required: [runId, status, outputs]
      description: |
        What one execution did, returned by the manual-run endpoint. A
        condensed view of the run record — fetch the run history for the
        denormalized trigger, machine, and timing fields.
      properties:
        runId: { type: string }
        status:
          type: string
          enum: [running, succeeded, failed, skipped, missed]
        machineId:
          type: string
          description: Present when the run targeted a single machine.
        outputs:
          type: array
          description: Per-output delivery result.
          items:
            type: object
            required: [type, status]
            properties:
              type: { type: string, enum: [email, webhook, cortex, command] }
              status: { type: string, enum: [sent, failed, skipped] }
              detail: { type: string }
              httpStatus:
                type: integer
                description: Webhook outputs only.
              error: { type: string }
        condition:
          type: object
          required: [type, verdict]
          description: Outcome of the condition gate, when the talon had one.
          properties:
            type: { type: string, enum: [none, visual_check] }
            verdict: { type: string, enum: [pass, fail] }
            confidence:
              type: number
              description: Vision-model confidence, 0–1, when the condition produced one.
            reason: { type: string }
            screenshotPath: { type: string }
            screenshotUrl:
              type: string
              format: uri
              description: Short-lived signed read url for `screenshotPath`.
        error:
          type: string
          description: Skip reason or failure detail, mirroring the run record's `error`.

    DeploymentTemplateInput:
      type: object
      required: [name, installer_name, installer_url, silent_flags]
      properties:
        name: { type: string }
        installer_name: { type: string }
        installer_url:
          type: string
          format: uri
          description: Must use `https://`.
        silent_flags: { type: string }
        verify_path:
          type: string
          nullable: true
        close_processes:
          type: array
          items: { type: string }
        parallel_install: { type: boolean }

    DeploymentTemplatePatch:
      type: object
      properties:
        name: { type: string }
        installer_name: { type: string }
        installer_url:
          type: string
          format: uri
        silent_flags: { type: string }
        verify_path:
          type: string
          nullable: true
        close_processes:
          type: array
          items: { type: string }
        parallel_install: { type: boolean }

    DeploymentTemplate:
      allOf:
        - $ref: '#/components/schemas/DeploymentTemplateInput'
        - type: object
          required: [id, name, installer_name, installer_url, silent_flags, createdAt]
          properties:
            id: { type: string }
            close_processes:
              type: array
              items: { type: string }
              nullable: true
            createdAt:
              type: string
              format: date-time
              nullable: true
            updatedAt:
              type: string
              format: date-time
              nullable: true

    DeploymentSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        installer_name:
          type: string
        status:
          type: string
          enum: [pending, in_progress, completed, failed, partial, partial_failed, cancelled, uninstalled]
        createdAt:
          type: integer
          description: Unix timestamp in milliseconds

    Deployment:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        installer_name:
          type: string
        installer_url:
          type: string
          format: uri
        silent_flags:
          type: string
        verify_path:
          type: string
        status:
          type: string
          enum: [pending, in_progress, completed, failed, partial, partial_failed, cancelled, uninstalled]
        createdAt:
          type: integer
          description: Unix timestamp in milliseconds
        targets:
          type: array
          items:
            type: object
            properties:
              machineId:
                type: string
              status:
                type: string
              progress:
                type: integer
                description: Download progress percentage (0-100)
              completedAt:
                type: integer
                description: Unix timestamp in milliseconds

    Webhook:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
            enum: [process_crash, machine_offline, connection_failure]
        createdAt:
          type: string
          format: date-time

    ApiKeyMetadata:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        keyPrefix:
          type: string
          description: First few characters of the key for identification
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time

    SystemPresetInput:
      type: object
      required:
        - name
        - software_name
        - category
        - installer_name
        - installer_url
        - silent_flags
        - is_owlette_agent
        - order
      properties:
        name: { type: string }
        software_name: { type: string }
        category: { type: string }
        description: { type: string, nullable: true }
        icon: { type: string, nullable: true }
        installer_name: { type: string }
        installer_url: { type: string }
        silent_flags: { type: string }
        verify_path: { type: string, nullable: true }
        close_processes:
          type: array
          items: { type: string }
        parallel_install: { type: boolean }
        is_owlette_agent: { type: boolean }
        timeout_seconds: { type: integer, nullable: true }
        order: { type: integer }

    SystemPreset:
      allOf:
        - $ref: '#/components/schemas/SystemPresetInput'
        - type: object
          properties:
            id: { type: string }
            createdBy: { type: string }
            createdAt: { type: string, format: date-time, nullable: true }
            updatedAt: { type: string, format: date-time, nullable: true }

    AlertRule:
      type: object
      required:
        - id
        - name
        - metric
        - operator
        - value
        - severity
        - channels
        - enabled
        - cooldownMinutes
      properties:
        id: { type: string }
        name: { type: string }
        metric: { type: string }
        operator: { type: string, enum: ['>', '<', '>=', '<='] }
        value: { type: number }
        severity: { type: string, enum: [info, warning, critical] }
        channels:
          type: array
          items: { type: string, enum: [email, webhook] }
        enabled: { type: boolean }
        cooldownMinutes: { type: number, minimum: 0 }

    InstallerVersion:
      type: object
      required: [version, download_url, checksum_sha256, file_size, uploaded_at, uploaded_by, release_date, deletedAt]
      properties:
        version:
          type: string
        download_url:
          type: string
          format: uri
          nullable: true
        checksum_sha256:
          type: string
          nullable: true
        release_notes:
          type: string
          nullable: true
        file_size:
          type: integer
          nullable: true
        uploaded_at:
          type: integer
          nullable: true
        uploaded_by:
          type: string
          nullable: true
        release_date:
          type: string
          format: date-time
          nullable: true
        deletedAt:
          type: integer
          nullable: true
        promoted_at:
          type: integer
          nullable: true
        promoted_by:
          type: string
          nullable: true

    McpTool:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        tier:
          type: integer
          enum: [1, 2, 3]
          description: "1 = read-only, 2 = actions, 3 = advanced"
        parameters:
          type: object
          description: JSON Schema for tool parameters

    # ── roost (project distribution v2) ─────────────────────────────
    DisplayMonitor:
      type: object
      description: |
        Monitor topology record reported by the agent and stored as a
        machine-level assigned layout. The agent remains the source of
        truth for vendor-specific fields; public callers should preserve
        unknown properties returned by display state tooling.
      additionalProperties: true
      properties:
        id: { type: string }
        deviceName: { type: string }
        primary: { type: boolean }
        position:
          type: object
          properties:
            x: { type: number }
            y: { type: number }
        width: { type: integer, minimum: 0 }
        height: { type: integer, minimum: 0 }
        scale: { type: number }
        orientation: { type: string }

    DisplayLayoutOperationResult:
      type: object
      required: [machineId, op]
      properties:
        machineId: { type: string }
        op:
          type: string
          enum: [capture, set_auto_restore, reset_breaker, set_remote_apply]

    SwoopSiteSettings:
      type: object
      description: |
        A site's swoop policy. swoop is off until a site turns it on; once it
        is on, members may watch unless `membersMayWatch` says otherwise.
      properties:
        enabled:
          type: boolean
          description: Whether swoop is on for this site.
        excludedMachineIds:
          type: array
          items: { type: string }
          description: Machines swoop may never reach, whatever the rest of the policy says.
        membersMayWatch:
          type: boolean
          description: Whether a plain site member may watch. Control always requires more.
        indicator:
          type: string
          enum: [banner, tray, none]
          description: What the machine shows while a session is live.
    ProblemDetails:
      type: object
      description: |
        RFC 7807 problem+json envelope returned by public API endpoints on
        error. This carries a stable machine-readable `type` URI, `code`,
        docs link, correlation `requestId`, and optional field-level
        `errors`.
      required: [type, title, status, code, docsUrl, requestId]
      properties:
        type:
          type: string
          format: uri
          description: Stable URI identifying the problem category.
          example: https://owlette.app/problems/validation-failed
        title:
          type: string
          description: Short, stable human-readable summary.
          example: validation failed
        status:
          type: integer
          description: HTTP status code, mirrors the response status.
          example: 400
        detail:
          type: string
          description: Occurrence-specific explanation; safe to show to users.
        instance:
          type: string
          description: URI reference for this occurrence (often the route path).
        requestId:
          type: string
          description: Correlation ID for trace lookup; quote in support tickets.
        code:
          type: string
          description: Stable machine-readable code for client branching.
          example: validation_failed
        docsUrl:
          type: string
          format: uri
          description: Documentation anchor for the error code.
          example: https://owlette.app/docs/api/errors#validation_failed
        param:
          type: string
          description: Optional offending header, query parameter, path parameter, or body field.
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: |
            Field-level errors keyed by dotted JSON path (400/422 responses).
            Example: `{ "body.hashes": ["must be a non-empty array"] }`

    VersionSummary:
      type: object
      description: Entry in a roost's immutable version history.
      required: [versionId, versionNumber, createdAt, totalSize, totalFiles]
      properties:
        versionId:
          type: string
          description: Stable content-addressed id (`vrs_*`).
        versionNumber:
          type: integer
          description: Monotonic 1-indexed version number, per-roost.
        description:
          type: string
          nullable: true
          maxLength: 500
          description: |
            Optional plaintext "what changed?" note supplied at publish
            time or edited later via PATCH. Null when missing.
        versionUrl:
          type: string
          format: uri
          description: R2 URL of the version body (short-TTL signed).
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
          description: UID of the user or agent that published this version.
        totalSize:
          type: integer
          format: int64
          description: Sum of all file sizes in bytes.
        totalFiles:
          type: integer
        parentVersionId:
          type: string
          nullable: true

    OciVersion:
      type: object
      description: |
        OCI Image v1.1 derivation — owlette surfaces this as "version". See
        [version-format.md](/docs/internal/version-format) for the
        full schema. This OpenAPI description captures the shape required
        by the finalize endpoint; the authoritative JSON schema lives in
        the internal docs.
      required: [schemaVersion, mediaType, config, files]
      properties:
        schemaVersion:
          type: integer
          enum: [2]
        mediaType:
          type: string
          enum: [application/vnd.owlette.version.v1+json]
        config:
          type: object
          required: [name, createdAt, createdBy, siteId]
          properties:
            name:
              type: string
            createdAt:
              type: string
              format: date-time
            createdBy:
              type: string
            siteId:
              type: string
        files:
          type: array
          items:
            type: object
            required: [path, size, chunks]
            properties:
              path:
                type: string
                description: |
                  POSIX-style relative path. Agents reject absolute paths,
                  `..`, `.`, empty segments, NUL bytes, drive letters, and
                  ADS colons.
              size:
                type: integer
                format: int64
                minimum: 0
              chunks:
                type: array
                items:
                  type: object
                  required: [hash, size]
                  properties:
                    hash:
                      type: string
                      pattern: '^[0-9a-f]{64}$'
                    size:
                      type: integer
                      minimum: 1

    # Public API schemas.

    # Common primitives.
    Permission:
      type: string
      enum: [read, write, deploy, rollback, admin]
      description: |
        Atomic permission within a scope entry. Permissions are exact;
        `write`, `deploy`, `rollback`, and `admin` do not imply `read`
        or any other permission.
    Scope:
      type: object
      description: |
        One entry on an api key's `scopes[]`. The set of scopes on a
        key is the union of access granted.
      required: [resource, id, permissions]
      properties:
        resource:
          type: string
          enum: [roost, site, machine, chat, deploy, process, user, installer]
          description: Resource type this entry grants against.
        id:
          type: string
          description: |
            Specific resource id or `*` to match any resource of the
            given type within the caller's own access. Platform resources
            `user` and `installer` must use `*`.
        permissions:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Permission' }

    Cursor:
      type: string
      description: |
        Opaque pagination cursor. Not a stable format — clients must
        round-trip the exact bytes without parsing.

    # api keys
    ApiKey:
      type: object
      required: [id, name, environment, keyPrefix, scopes, createdAt]
      properties:
        id:            { type: string }
        name:          { type: string, maxLength: 128 }
        environment:
          type: string
          enum: [live, test]
          nullable: true
          description: |
            `live` for every key minted now. `test` appears only on legacy keys
            issued before the option was withdrawn; they authenticate
            identically. Null on pre-scoping keys, which stored no environment.
        keyPrefix:
          type: string
          description: Display-safe prefix of the raw key; current keys store the first 15 characters.
        scopes:
          type: array
          items: { $ref: '#/components/schemas/Scope' }
        lastUsedAt:
          type: integer
          format: int64
          nullable: true
          description: Epoch milliseconds. Null until the key is first used.
        lastUsedIp:
          type: string
          nullable: true
        expiresAt:
          type: integer
          format: int64
          nullable: true
          description: Epoch milliseconds. Keys always expire (default 90d, max 365d).
        createdAt:
          type: integer
          format: int64
          nullable: true
          description: |
            Epoch milliseconds. Stored inconsistently — a Firestore Timestamp on
            keys created after the switch to `serverTimestamp()`, a number before
            it — and normalised by the route, so clients always receive a number.
        revokedAt:
          type: integer
          format: int64
          nullable: true
          description: Epoch milliseconds. Set on revocation.
        rotatedAt:
          type: integer
          format: int64
          nullable: true
          description: Epoch milliseconds. Set when this key was rotated.
        rotatedFromKeyId:
          type: string
          nullable: true
        retiresAt:
          type: integer
          format: int64
          nullable: true
          description: |
            Epoch milliseconds. When a rotated key stops working
            (`rotatedAt` + 24h grace).
        expiredMarkedAt:
          type: integer
          format: int64
          nullable: true
        expired:
          type: boolean
          description: |
            Derived server-side against the moment the list was built: true once
            `expiresAt` has passed. Matches the `<=` boundary the API enforces,
            so a key shown as expired is exactly a key the API will reject with
            `token_expired`.
        retired:
          type: boolean
          description: Derived. A rotated key whose grace window has closed.
        revoked:
          type: boolean
          description: |
            Derived from the presence of `revokedAt`, deliberately not from
            `revokedAt <= now`: the API rejects a key the instant the field is set,
            so a future-dated stamp is already dead. Terminal — it outranks
            `expired` and `retired`, matching the order the API checks them in.
    ApiKeyWithSecret:
      description: |
        Returned **only** on create or rotate — the one and only time
        the raw `key` value is exposed. Subsequent reads return
        `keyPrefix` only.
      allOf:
        - $ref: '#/components/schemas/ApiKey'
        - type: object
          required: [key]
          properties:
            key:
              type: string
              description: Raw api key (`owk_live_*` or `owk_test_*`). Store immediately.
            previousKeyExpiresAt:
              type: string
              format: date-time
              nullable: true
              description: Rotation grace window end (rotate only; null on create).
            rotatedAt:
              type: string
              format: date-time
              nullable: true
              description: Timestamp of the rotation (rotate only; null on create).
    ApiKeyCreateResponse:
      type: object
      required: [success, key, keyId, name, environment, scopes, expiresAt, keyPrefix]
      properties:
        success: { type: boolean }
        key:
          type: string
          description: Raw api key (`owk_live_*` or `owk_test_*`). Store immediately.
        keyId: { type: string }
        name: { type: string }
        environment:
          type: string
          enum: [live, test]
        scopes:
          type: array
          items: { $ref: '#/components/schemas/Scope' }
        expiresAt:
          type: integer
          format: int64
          description: Unix timestamp in milliseconds.
        keyPrefix: { type: string }
    ApiKeyRotateResponse:
      allOf:
        - $ref: '#/components/schemas/ApiKeyCreateResponse'
        - type: object
          required: [rotatedFromKeyId, previousKey]
          properties:
            rotatedFromKeyId: { type: string }
            previousKey:
              type: object
              required: [keyId, retiresAt]
              properties:
                keyId: { type: string }
                retiresAt:
                  type: integer
                  format: int64
                  description: Unix timestamp in milliseconds when the old key stops working.
    CreateApiKeyRequest:
      type: object
      required: [name, scopes]
      properties:
        name:          { type: string, maxLength: 128 }
        environment:
          type: string
          enum: [live, test]
          default: live
          deprecated: true
          description: |
            Ignored. Every key is minted `live`. Still accepted so shipped
            clients that send it are not broken.
        scopes:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Scope' }
        ttlDays:
          type: integer
          minimum: 1
          maximum: 365
          default: 90
    PatchApiKeyRequest:
      type: object
      minProperties: 1
      description: |
        At least one of `name` and `scopes` is required; sending neither
        returns 400. `scopes` replaces the key's scope list outright — it
        is not merged with what is already there.

        Scopes may be broadened as well as narrowed, subject to the same
        grant rules as key creation: `user` and `installer` scopes require
        superadmin, and platform resources must use `id: "*"`.
      properties:
        name:   { type: string, maxLength: 128 }
        scopes:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Scope' }
    RotateApiKeyRequest:
      type: object
      properties:
        ttlDays:
          type: integer
          minimum: 1
          maximum: 365
          default: 90

    # roosts
    RoostSummary:
      type: object
      required: [id, siteId, name, targets, totalSize, totalFiles, updatedAt]
      properties:
        id:       { type: string }
        siteId:   { type: string }
        name:     { type: string }
        targets:
          type: array
          items: { type: string }
        currentVersionId:
          type: string
          nullable: true
          pattern: '^[0-9a-f]{64}$'
        previousVersionId:
          type: string
          nullable: true
          pattern: '^[0-9a-f]{64}$'
        totalSize:
          type: integer
          format: int64
          minimum: 0
        totalFiles:
          type: integer
          minimum: 0
        updatedAt:
          type: string
          format: date-time
    Roost:
      description: Full roost detail. Extends `RoostSummary` with `createdAt`.
      allOf:
        - $ref: '#/components/schemas/RoostSummary'
        - type: object
          required: [createdAt]
          properties:
            createdAt:
              type: string
              format: date-time
    CreateRoostRequest:
      type: object
      required: [siteId, name]
      properties:
        siteId:  { type: string }
        name:
          type: string
          maxLength: 128
          description: Display name. Must be unique within the site.
        targets:
          type: array
          items: { type: string }
          description: Machine ids to target; may be empty at create time.
    PatchRoostRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 128
        targets:
          type: array
          items: { type: string }

    # versions
    VersionFile:
      type: object
      required: [path, digest, size]
      properties:
        path:   { type: string }
        digest:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        size:
          type: integer
          format: int64
          minimum: 0
    Version:
      description: |
        Full oci-style version body. Roost emits schemaVersion 2,
        mediaType `application/vnd.owlette.version.v1+json`. See
        [versions.md](/docs/api/versions).
      type: object
      required: [schemaVersion, mediaType, config, layers]
      properties:
        schemaVersion:
          type: integer
          enum: [2]
        mediaType:
          type: string
          enum: [application/vnd.owlette.version.v1+json]
        config:
          type: object
          required: [mediaType, digest, size]
          properties:
            mediaType: { type: string }
            digest:
              type: string
              pattern: '^sha256:[0-9a-f]{64}$'
            size:
              type: integer
              format: int64
              minimum: 0
        layers:
          type: array
          items:
            type: object
            required: [mediaType, path, digest, size]
            properties:
              mediaType: { type: string }
              path:      { type: string }
              digest:
                type: string
                pattern: '^sha256:[0-9a-f]{64}$'
              size:
                type: integer
                format: int64
                minimum: 0
    VersionDetail:
      description: Version metadata wrapper returned on GET.
      type: object
      required: [id, versionNumber, publishedAt, totalSize, totalFiles, isCurrent, version]
      properties:
        id:
          type: string
          description: Stable content-addressed id (64-char sha-256 hex).
        versionNumber:
          type: integer
          description: Monotonic 1-indexed version number, per-roost.
        description:
          type: string
          nullable: true
          maxLength: 500
          description: |
            Optional plaintext "what changed?" note. Editable via PATCH.
        publishedAt:
          type: string
          format: date-time
        publishedBy:
          type: string
          description: User or api key id that published this version.
        totalSize:
          type: integer
          format: int64
        totalFiles:
          type: integer
        isCurrent:
          type: boolean
        version: { $ref: '#/components/schemas/Version' }
    DiffResult:
      type: object
      required: [from, to, added, removed, modified]
      properties:
        from:
          type: string
          pattern: '^[0-9a-f]{64}$'
        to:
          type: string
          pattern: '^[0-9a-f]{64}$'
        added:
          type: array
          items: { $ref: '#/components/schemas/VersionFile' }
        removed:
          type: array
          items: { $ref: '#/components/schemas/VersionFile' }
        modified:
          type: array
          items:
            type: object
            required: [path, digestBefore, digestAfter, sizeBefore, sizeAfter]
            properties:
              path: { type: string }
              digestBefore:
                type: string
                pattern: '^sha256:[0-9a-f]{64}$'
              digestAfter:
                type: string
                pattern: '^sha256:[0-9a-f]{64}$'
              sizeBefore:
                type: integer
                format: int64
              sizeAfter:
                type: integer
                format: int64

    # chunks
    ChunkReferrer:
      type: object
      required: [entryId, source]
      properties:
        entryId: { type: string }
        source:
          type: string
          enum: [version, mount]
        roostId:
          type: string
          nullable: true
        fromRoostId:
          type: string
          nullable: true
        toRoostId:
          type: string
          nullable: true
        versionId:
          type: string
          nullable: true
          pattern: '^[0-9a-f]{64}$'
        versionNumber:
          type: integer
          nullable: true
        fileCount:
          type: integer
          nullable: true
          minimum: 1
          description: How many files in that version reference this chunk.
        referencedAt:
          type: string
          format: date-time
          nullable: true
    MountChunkRequest:
      type: object
      required: [siteId, toRoostId]
      properties:
        siteId:    { type: string }
        toRoostId: { type: string }

    # deployments
    MachineDeploymentState:
      type: object
      required: [machineId, state]
      properties:
        machineId: { type: string }
        role:
          type: string
          enum: [canary, fleet]
        state:
          type: string
          enum: [queued, in_progress, succeeded, failed, cancelled, simulated]
        syncStartedAt:
          type: string
          format: date-time
          nullable: true
        syncCompletedAt:
          type: string
          format: date-time
          nullable: true
        bytesTransferred:
          type: integer
          format: int64
          minimum: 0
        error:
          type: string
          nullable: true
    DeployRequest:
      type: object
      required: [siteId, versionId]
      properties:
        siteId: { type: string }
        versionId:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        machines:
          type: array
          items: { type: string }
          description: Subset of the roost's targets. Omit to target all.
        scheduleAt:
          type: string
          format: date-time
          nullable: true
          description: Future timestamp to queue the rollout for.
        dryRun:
          type: boolean
          default: false
        strategy:
          type: string
          enum: [all-at-once, canary-then-fleet, canary-only]
          default: all-at-once
    DeploymentPlan:
      description: |
        Initial rollout response (202 Accepted). For ongoing status
        polling, call `GET /api/roosts/{roostId}/deployments/{rolloutId}`.
      type: object
      required: [rolloutId, roostId, versionId, strategy, dryRun, createdAt, machines]
      properties:
        rolloutId: { type: string }
        roostId:   { type: string }
        versionId:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        strategy:
          type: string
          enum: [all-at-once, canary-then-fleet, canary-only]
        dryRun:    { type: boolean }
        scheduledAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        machines:
          type: array
          items: { $ref: '#/components/schemas/MachineDeploymentState' }
    DeploymentStatus:
      description: |
        Current state snapshot for a rollout — used by both the list
        endpoint and the detail endpoint (detail populates
        `machines[]`; list omits them to keep payloads small).
      type: object
      required: [rolloutId, roostId, versionId, strategy, state, startedAt]
      properties:
        rolloutId: { type: string }
        roostId:   { type: string }
        versionId:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        strategy:
          type: string
          enum: [all-at-once, canary-then-fleet, canary-only]
        state:
          type: string
          enum: [queued, in_progress, succeeded, failed, cancelled]
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        machineCount:
          type: integer
          minimum: 0
        successCount:
          type: integer
          minimum: 0
        failureCount:
          type: integer
          minimum: 0
        machines:
          type: array
          items: { $ref: '#/components/schemas/MachineDeploymentState' }
          description: Populated on detail responses only.
    DryRunResult:
      description: |
        Returned when `DeployRequest.dryRun: true`. Same shape as
        `DeploymentPlan` but every machine is in `state: simulated`
        and no agent is contacted. Included as a distinct schema for
        sdk code-gen clarity.
      allOf:
        - $ref: '#/components/schemas/DeploymentPlan'
    InstallerDeploymentTarget:
      type: object
      required: [machineId, status]
      properties:
        machineId: { type: string }
        status:
          type: string
          enum:
            - pending
            - closing_processes
            - downloading
            - installing
            - completed
            - failed
            - cancelled
            - uninstalled
        error:
          type: string
          nullable: true
        cancelledAt:
          type: string
          format: date-time
          nullable: true
        retriedAt:
          type: string
          format: date-time
          nullable: true
      additionalProperties: true
    InstallerDeploymentSummary:
      type: object
      required:
        - id
        - name
        - installer_name
        - installer_url
        - silent_flags
        - verify_path
        - sha256_checksum
        - parallel_install
        - targets
        - status
        - createdAt
        - completedAt
        - updatedAt
      properties:
        id: { type: string }
        name: { type: string }
        installer_name: { type: string }
        installer_url:
          type: string
          format: uri
        silent_flags: { type: string }
        verify_path:
          type: string
          nullable: true
        sha256_checksum:
          type: string
          nullable: true
        parallel_install: { type: boolean }
        targets:
          type: array
          items: { $ref: '#/components/schemas/InstallerDeploymentTarget' }
        status:
          type: string
          enum:
            - pending
            - in_progress
            - completed
            - failed
            - partial
            - partial_failed
            - cancelled
            - uninstalling
            - uninstalled
        createdAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true
    InstallerDeploymentDetail:
      allOf:
        - $ref: '#/components/schemas/InstallerDeploymentSummary'
        - type: object
          required: [siteId]
          properties:
            siteId: { type: string }

    # sites
    SiteSummary:
      type: object
      required: [id, name]
      properties:
        id:       { type: string }
        name:     { type: string }
        plan:
          type: string
          enum: [free, starter, pro, enterprise]
          nullable: true
        timezone:
          type: string
          nullable: true
          description: IANA tz name.
        owner:
          type: string
          nullable: true
          description: User id that owns the site.
        createdAt:
          type: string
          format: date-time
          nullable: true
        schedulesFollowSiteTime:
          type: boolean
          description: |
            True when process schedules are evaluated in the site's `timezone`
            rather than each machine's own clock. Effective value: a site that
            has never been asked reports `false`, the same as one that declined.
    SiteDetail:
      description: Site detail currently shares the live `SiteSummary` shape.
      allOf:
        - $ref: '#/components/schemas/SiteSummary'

    # machines
    MachineSummary:
      type: object
      required: [id, name, online]
      properties:
        id:     { type: string }
        name:   { type: string }
        online: { type: boolean }
        lastHeartbeat:
          type: string
          format: date-time
          nullable: true
        agentVersion:
          type: string
          nullable: true
        os:
          type: string
          nullable: true
        currentRoosts:
          type: array
          items:
            type: object
            required: [roostId, name, currentVersionId, versionCounter]
            properties:
              roostId: { type: string }
              name: { type: string }
              currentVersionId:
                type: string
                nullable: true
              versionCounter:
                type: integer
                minimum: 0
    MachineDetail:
      description: Full machine detail; extends `MachineSummary` with telemetry.
      allOf:
        - $ref: '#/components/schemas/MachineSummary'
        - type: object
          properties:
            siteId: { type: string }
            hostname:
              type: string
              nullable: true
            metrics:
              type: object
              nullable: true
              additionalProperties: true
            processes:
              type: array
              items:
                type: object
                additionalProperties: true
            capabilities:
              description: |
                Feature flags the agent reports on its heartbeat, computed
                from what is installed on the machine. `1` means available.
                Absent or null on an agent too old to report them.
              type: object
              nullable: true
              additionalProperties: true
    MachineDeployment:
      description: Current state for one roost that targets a machine.
      type: object
      required: [roostId, name, currentVersionId, previousVersionId, versionCounter, extractPath, reportedVersionId, reportedStatus, reportedAt]
      properties:
        roostId: { type: string }
        name: { type: string }
        currentVersionId:
          type: string
          nullable: true
        previousVersionId:
          type: string
          nullable: true
        versionCounter:
          type: integer
          minimum: 0
        extractPath:
          type: string
          nullable: true
        reportedVersionId:
          type: string
          nullable: true
        reportedStatus:
          type: string
          nullable: true
        reportedAt:
          type: string
          format: date-time
          nullable: true
    RemoveMachineResult:
      type: object
      required: [siteId, machineId, deleted]
      properties:
        siteId: { type: string }
        machineId: { type: string }
        deleted:
          type: object
          required: [machine, config, pendingCommands, completedCommands]
          properties:
            machine: { type: string }
            config: { type: string }
            pendingCommands: { type: string }
            completedCommands: { type: string }

    # quotas
    Quota:
      type: object
      required: [siteId, usedBytes, pendingBytes, committedBytes, limitBytes, fractionUsed, lastAlarmLevel, alarms]
      properties:
        siteId: { type: string }
        limitBytes:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: |
            Included storage per site, in bytes. A per-site grant recorded on
            the quota doc takes precedence over the standard allowance.
        usedBytes:
          type: integer
          format: int64
          minimum: 0
        pendingBytes:
          type: integer
          format: int64
          minimum: 0
          description: Bytes reserved by in-flight uploads but not yet persisted.
        committedBytes:
          type: integer
          format: int64
          minimum: 0
          description: "`usedBytes + pendingBytes`."
        fractionUsed:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
          description: |
            `committedBytes / limitBytes`, capped at 1. `null` when the site
            has no storage allowance — there is no ratio to take.
        lastAlarmLevel:
          type: number
        lastAlarmAt:
          type: string
          format: date-time
          nullable: true
        lastReconciledAt:
          type: string
          format: date-time
          nullable: true
        alarms:
          type: array
          items:
            type: object
            required: [id, threshold, firedAt]
            properties:
              id: { type: string }
              threshold:
                type: number
                nullable: true
                minimum: 0
                maximum: 1
                description: Fraction of `limitBytes` at which this alarm fired.
              firedAt:
                type: string
                format: date-time
                nullable: true
    QuotaHistoryEntry:
      type: object
      required: [date, storageBytesAvg, classAOps, classBOps, egressBytes]
      properties:
        date:
          type: string
          format: date
          description: UTC calendar date (YYYY-MM-DD).
        storageBytesAvg:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        classAOps:
          type: integer
          minimum: 0
        classBOps:
          type: integer
          minimum: 0
        egressBytes:
          type: integer
          format: int64
          minimum: 0

    # operational logs
    SiteLogEntry:
      type: object
      required: [id, siteId, timestamp, action, level, machineId, machineName, processName, details, userId, screenshotUrl]
      properties:
        id: { type: string }
        siteId: { type: string }
        timestamp:
          type: string
          format: date-time
          nullable: true
        action:
          type: string
          description: Event action, e.g. `process_crash` or `agent_started`.
        level:
          type: string
          enum: [debug, info, warning, error, critical]
        machineId:
          type: string
          nullable: true
        machineName:
          type: string
          nullable: true
        processName:
          type: string
          nullable: true
        details:
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
          nullable: true
        userId:
          type: string
          nullable: true
        screenshotUrl:
          type: string
          format: uri
          nullable: true

    # audit log
    AuditRecord:
      type: object
      required: [hash, kind, actor, siteId, target, occurredAt, recordedAt, attributes]
      properties:
        hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        kind:
          type: string
          enum:
            - signed_url_issued
            - distribution_started
            - version_pointer_changed
            - api_key_used
            - gc_run
            - api_key_mutated
            - chunk_mutated
            - deployment_mutated
            - distribution_mutated
            - process_mutated
            - roost_mutated
            - machine_command_dispatched
            - user_mutated
            - site_mutated
            - site_member_mutated
            - installer_mutated
            - webhook_mutated
            - chat_mutated
            - billing_mutated
            - talon_mutated
        actor:
          type: string
          description: Actor identifier such as `user:<uid>` or `apiKey:<keyId>`.
        siteId: { type: string }
        target:
          type: string
          nullable: true
          description: Optional mutated resource id for mutation audit records.
        occurredAt:
          type: integer
          format: int64
          nullable: true
        recordedAt:
          type: integer
          format: int64
          nullable: true
        attributes:
          type: object
          description: |
            Kind-specific structured detail. Additional properties
            depend on `kind`; treat unknown keys as forward-compatible.
          additionalProperties: true
    AuditRecordDetail:
      type: object
      required: [siteId, hash, previousHash, recordedAt, event, verification]
      properties:
        siteId: { type: string }
        hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        previousHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        recordedAt:
          type: integer
          format: int64
        event:
          type: object
          required: [kind, siteId, actor, occurredAt, attributes]
          properties:
            kind:
              type: string
              enum:
                - signed_url_issued
                - distribution_started
                - version_pointer_changed
                - api_key_used
                - gc_run
                - api_key_mutated
                - chunk_mutated
                - deployment_mutated
                - distribution_mutated
                - process_mutated
                - roost_mutated
                - machine_command_dispatched
                - user_mutated
                - site_mutated
                - site_member_mutated
                - installer_mutated
                - webhook_mutated
                - chat_mutated
                - billing_mutated
                - talon_mutated
            siteId: { type: string }
            actor: { type: string }
            target:
              type: string
              description: Optional mutated resource id for mutation audit records.
            occurredAt:
              type: integer
              format: int64
            attributes:
              type: object
              additionalProperties: true
        verification:
          type: object
          required: [ok, hashValid, linkageValid, isGenesis, predecessorPresent, reason]
          properties:
            ok: { type: boolean }
            hashValid: { type: boolean }
            linkageValid:
              type: boolean
              nullable: true
            isGenesis: { type: boolean }
            predecessorPresent: { type: boolean }
            reason:
              type: string
              nullable: true

    # webhooks
    WebhookDeliveryStatus:
      type: string
      enum: [pending, succeeded, failed]
    WebhookSubscription:
      description: |
        Base webhook subscription fields. Most reads return the
        `Webhook` wrapper which extends this with activity pointers;
        `WebhookWithSecret` extends with the one-time raw secret.
      type: object
      required: [id, url, events, paused, createdAt]
      properties:
        id:          { type: string }
        siteId:      { type: string }
        url:
          type: string
          format: uri
          description: Must be https — no private / loopback ips.
        events:
          type: array
          minItems: 1
          items: { type: string }
        description:
          type: string
          nullable: true
        paused:
          type: boolean
          default: false
        createdAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true
    WebhookDetail:
      description: |
        Webhook subscription wrapper with activity pointers. Returned
        on `GET /api/webhooks` and `GET /api/webhooks/{webhookId}`.
      allOf:
        - $ref: '#/components/schemas/WebhookSubscription'
        - type: object
          properties:
            lastDeliveryAt:
              type: string
              format: date-time
              nullable: true
            lastDeliveryOk:
              type: string
              nullable: true
              deprecated: true
            lastDeliveryStatus:
              type: string
              nullable: true
            consecutiveFailures:
              type: integer
              minimum: 0
              deprecated: true
            failureCount:
              type: integer
              minimum: 0
    WebhookWithSecret:
      description: |
        Returned **only** on webhook create and `rotate-secret`. The
        `signingSecret` is the full hmac secret — store it immediately.
      allOf:
        - $ref: '#/components/schemas/WebhookSubscription'
        - type: object
          required: [signingSecret]
          properties:
            signingSecret:
              type: string
              description: HMAC signing secret (`whsec_*`). Shown once.
            previousSecretExpiresAt:
              type: string
              format: date-time
              nullable: true
              deprecated: true
            previousSecretValidUntil:
              type: string
              format: date-time
              nullable: true
            gracePeriodHours:
              type: integer
            rotatedAt:
              type: string
              format: date-time
              nullable: true
    CreateWebhookRequest:
      type: object
      required: [url, events]
      properties:
        url:
          type: string
          format: uri
          description: Must be https — no private ips; reachable during create-time smoke test.
        events:
          type: array
          minItems: 1
          items: { type: string }
        description:
          type: string
          maxLength: 500
    PatchWebhookRequest:
      type: object
      properties:
        url:
          type: string
          format: uri
        events:
          type: array
          items: { type: string }
        description:
          type: string
          maxLength: 500
          nullable: true
        paused:
          type: boolean
    WebhookDelivery:
      type: object
      required: [id, event, state, attempt, createdAt, nextAttemptAt]
      properties:
        id: { type: string }
        webhookId:  { type: string }
        siteId: { type: string }
        event:      { type: string }
        state:      { $ref: '#/components/schemas/WebhookDeliveryStatus' }
        lastStatus:
          type: integer
          nullable: true
          description: HTTP status the target returned. Null if the attempt never connected.
        attempt:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        nextRetryAt:
          type: string
          format: date-time
          nullable: true
          deprecated: true
        nextAttemptAt:
          type: string
          format: date-time
          nullable: true
        lastError:
          type: string
          nullable: true
        request:
          type: object
          description: Populated on detail responses only.
          properties:
            url:     { type: string, format: uri }
            headers:
              type: object
              additionalProperties: { type: string }
            body:
              type: string
              description: Raw canonical event payload.
        response:
          type: object
          description: Populated on detail responses only; body truncated to 4 KiB.
          properties:
            status:  { type: integer }
            headers:
              type: object
              additionalProperties: { type: string }
            body:      { type: string }
            durationMs: { type: integer, minimum: 0 }
    WebhookProbeRequest:
      type: object
      required: [url, event]
      properties:
        url:
          type: string
          format: uri
        event:
          type: string
          description: Known webhook event name.
        payload:
          type: object
          additionalProperties: true
        signingSecret:
          type: string
          description: Optional secret to hmac-sign the synthetic probe payload with. If omitted, the server returns a generated test secret.

    # utility
    WhoAmIResponse:
      type: object
      required: [userId, email, role, key, rateLimit, quota, primarySiteId]
      properties:
        userId:
          type: string
          description: Authenticated Owlette user id.
        email:
          type: string
          format: email
          nullable: true
        role:
          type: string
          nullable: true
        key:
          type: object
          nullable: true
          description: Populated when the request authenticated with an API key.
          required: [keyId, name, keyPrefix, scopes, environment, expiresAt, lastUsedAt, isLegacy]
          properties:
            keyId:
              type: string
              nullable: true
            name:
              type: string
              nullable: true
            keyPrefix:
              type: string
              nullable: true
            scopes:
              type: array
              nullable: true
              items: { $ref: '#/components/schemas/Scope' }
            environment:
              type: string
              enum: [live, test]
              nullable: true
            expiresAt:
              type: integer
              nullable: true
              description: Unix timestamp in milliseconds.
            lastUsedAt:
              type: integer
              nullable: true
              description: Unix timestamp in milliseconds.
            isLegacy:
              type: boolean
        rateLimit:
          type: object
          required: [tier, limitPerMinute, note]
          properties:
            tier: { type: string }
            limitPerMinute: { type: integer }
            note: { type: string }
        quota:
          type: object
          nullable: true
          properties:
            siteId:
              type: string
            usedBytes:
              type: integer
              format: int64
            pendingBytes:
              type: integer
              format: int64
            limitBytes:
              type: integer
              format: int64
              nullable: true
        primarySiteId:
          type: string
          nullable: true
    VersionResponse:
      type: object
      required: [current, supported, deprecated, retired]
      properties:
        current:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        supported:
          type: array
          items:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
        deprecated:
          type: array
          items:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
        retired:
          type: array
          items:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
