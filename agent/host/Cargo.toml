[package]
name = "owlette-host"
# Kept in step with /VERSION by scripts/sync-versions.js. It was stuck at 3.0.0
# for six releases because the sync script only knew about the desktop crate —
# harmless while the binary carried no version resource, and wrong the moment
# build.rs started stamping CARGO_PKG_VERSION into VERSIONINFO.
version = "3.3.8"
description = "Windows service host for the owlette agent"
authors = ["Tridant Inc."]
license = "FSL-1.1-Apache-2.0"
repository = "https://github.com/tridant-io/owlette"
edition = "2021"
rust-version = "1.77.2"
publish = false

# Standalone on purpose. `build_installer_full.bat` builds this with a plain
# `cargo build --release` from this directory, and the desktop app next door is
# standalone for the same reason — neither should be absorbed into a workspace
# if a root Cargo.toml ever appears.
[workspace]

[[bin]]
name = "owlette-host"
path = "src/main.rs"

[dependencies]
# The only runtime dependency, and the same crate + version the desktop app
# already drives the SCM with (desktop/src-tauri/Cargo.toml). Mullvad maintain
# it; it wraps advapi32's service dispatcher, the control handler, and
# CreateService/ChangeServiceConfig2 — the three things that cannot be done from
# std. Everything else the host does (spawning the child, pumping its pipes,
# rotating logs, timing backoff) is std.
windows-service = "0.8.1"

[build-dependencies]
# Embeds the VERSIONINFO resource and icon (see build.rs). Same crate Tauri
# already pulls into the desktop build, so it is not new to this repo.
winresource = "0.1"

[profile.release]
# A supervisor spends its life asleep, so size was the only thing this profile
# optimised for — `opt-level = "z"`, full LTO, one codegen unit, symbols
# stripped. On 2026-09-08 Defender's ML classifier (signature set 1.459.111.0)
# started quarantining that image as Trojan:Win32/Bearfoos.B!ml: a small,
# dense, stripped, statically-linked, metadata-free PE is the profile of a
# packed dropper, and the classifier scores static features, not behaviour.
#
# So the profile now looks like an ordinary release build instead of the
# densest image the toolchain can produce. The cost is ~100-200 KB on a 43 MB
# installer. `+crt-static` in .cargo/config.toml is deliberately KEPT: dropping
# it reintroduces the VCRUNTIME140 fleet failure that 3.2.3 shipped to fix.
#
# This is a change to the classifier's inputs, not a guarantee. A rebuilt
# candidate must be scanned (MpCmdRun -Scan -ScanType 3 -File <copy>
# -DisableRemediation) before it is packaged, and the durable fix is signing.
opt-level = 2
lto = "thin"
strip = false
