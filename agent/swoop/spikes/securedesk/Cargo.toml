[package]
name = "securedesk"
version = "0.0.0"
edition = "2021"
publish = false
description = "swoop spike 0.3 - the child the SYSTEM spawn harness launches"

# Empty on purpose. The spike must never be absorbed into a parent workspace:
# agent/swoop (Task 1.2) is the product crate and this directory sits inside it,
# so without this table a future `[workspace]` there would pull the spike into
# the product build and its dependency graph.
[workspace]

[[bin]]
name = "securedesk"
path = "src/main.rs"

[dependencies]
# Only dependency, and the same version the 0.8 capture probe measured on this
# box. Desktop Duplication is COM and the desktop/token/input calls are all
# straight Win32; hand-rolled vtable FFI would be more unsafe code than the
# measurement. No serde: the protocol here is four object shapes in and six out,
# and `json.rs` is smaller than the dependency would be.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_RemoteDesktop",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 2
lto = "thin"
strip = false
