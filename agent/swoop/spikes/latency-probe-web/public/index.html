<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>swoop latency probe</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #101012;
        --fg: #e8e8ea;
        --dim: #8a8a92;
        --line: #2a2a30;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font: 13px/1.5 ui-monospace, "Cascadia Mono", Consolas, monospace;
      }
      #shell {
        display: grid;
        grid-template-rows: auto 1fr;
        height: 100%;
      }
      header {
        padding: 10px 14px;
        border-bottom: 1px solid var(--line);
        display: flex;
        gap: 14px;
        align-items: baseline;
        flex-wrap: wrap;
      }
      header b {
        font-weight: 600;
      }
      header span {
        color: var(--dim);
      }
      #body {
        position: relative;
        overflow: auto;
      }
      #out {
        margin: 0;
        padding: 14px;
        white-space: pre-wrap;
      }
      /* The flip surface. Fills the viewport and sits above the log so the
         camera sees a full screen of one colour and nothing else. */
      #stage {
        position: fixed;
        inset: 0;
        display: none;
        background: #000;
      }
      #stage.on {
        display: block;
      }
      #stage canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #hint {
        position: fixed;
        left: 10px;
        bottom: 8px;
        color: #808080;
        mix-blend-mode: difference;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="shell">
      <header>
        <b>swoop latency probe</b>
        <span id="mode">mode: -</span>
        <span id="state">idle</span>
      </header>
      <div id="body"><pre id="out">loading</pre></div>
    </div>
    <div id="stage"><canvas id="canvas"></canvas><div id="hint"></div></div>
    <script src="/probe.js" type="module"></script>
  </body>
</html>
