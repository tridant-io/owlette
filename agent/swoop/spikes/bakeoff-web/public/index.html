<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>swoop spike 0.2 — video-path bake-off</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        background: #0d0f12;
        color: #d8dee6;
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      header {
        display: flex;
        gap: 16px;
        align-items: baseline;
        padding: 10px 14px;
        border-bottom: 1px solid #242a33;
      }
      h1 { font-size: 13px; font-weight: 600; margin: 0; }
      #state { color: #7fd1a0; }
      button {
        font: inherit;
        color: inherit;
        background: #1b2027;
        border: 1px solid #333c47;
        border-radius: 4px;
        padding: 3px 10px;
        cursor: pointer;
      }
      main { display: grid; grid-template-columns: minmax(320px, 1fr) minmax(360px, 1fr); gap: 14px; padding: 14px; }
      /* srcObject only — proxy.ts sets no media-src, so a blob URL would be
         blocked in the product and this page keeps the product's habit. */
      video { width: 100%; background: #000; border: 1px solid #242a33; }
      /* The measurement canvas. In the DOM and presented, because spike 0.1 §6
         measured a detached canvas reading back at up to 62 ms. */
      #probe { width: 160px; height: 90px; border: 1px solid #242a33; image-rendering: pixelated; }
      pre { white-space: pre; overflow: auto; margin: 0; max-height: 78vh; }
      .hint { color: #7c8798; }
    </style>
  </head>
  <body>
    <header>
      <h1>swoop spike 0.2 — video-path bake-off</h1>
      <span id="state">idle</span>
      <button id="go">run</button>
      <span class="hint">
        ?arm=b&amp;n=150&amp;warmup=30&amp;host=http://127.0.0.1:17441&amp;label=…&amp;autorun=1
      </span>
    </header>
    <main>
      <div>
        <video id="stage" autoplay playsinline muted></video>
        <p class="hint">readback probe:</p>
        <canvas id="probe" width="160" height="90"></canvas>
        <p class="hint">
          keep this window visible for the whole run — a series taken while the window was
          hidden is void (spike 0.1 §2.3).
        </p>
      </div>
      <pre id="out"></pre>
    </main>
    <!-- Installed before the harness so a module that fails to even load says
         so on the page server's stdout. Spike 0.9 lost a run to a page that
         loaded, silently did nothing, and showed no symptom anywhere. -->
    <script>
      window.beacon = (m) => {
        document.getElementById('out').textContent += `${m}\n`;
        fetch(`/progress?m=${encodeURIComponent(m)}`).catch(() => {});
      };
      addEventListener('error', (e) =>
        beacon(`PAGE ERROR: ${e.message} @ ${e.filename}:${e.lineno}:${e.colno}`),
      );
      addEventListener('unhandledrejection', (e) =>
        beacon(`PAGE REJECTION: ${e.reason?.stack ?? e.reason}`),
      );
      beacon(`page loaded at ${location.href}`);
      addEventListener('pagehide', () => beacon('PAGE HIDE (navigating away)'));
    </script>
    <script type="module">
      // Imported dynamically rather than with `src` so a failure during module
      // evaluation becomes a rejection this page can report, instead of a
      // console line nobody is looking at.
      import('./bakeoff.js').catch((e) => beacon(`MODULE FAILED: ${e?.stack ?? e}`));
    </script>
  </body>
</html>
