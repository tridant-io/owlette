[package]
name = "owlette-swoop"
# Kept in step with /VERSION by scripts/sync-versions.js, which rewrites only
# the FIRST `version = "X.Y.Z"` line in this file — so it must stay above every
# dependency table. The agent refuses to spawn a streamer whose version differs
# from its own (plan.md D2), and build.rs stamps this into the exe's
# VERSIONINFO, so a stale number here strands the feature on the machine.
version = "3.3.5"
description = "owlette swoop remote-desktop streamer"
authors = ["Tridant Inc."]
license = "FSL-1.1-Apache-2.0"
repository = "https://github.com/tridant-io/owlette"
edition = "2021"
# Measured in spike 0.2 §11.1, in both directions: 1.91.0 compiles the whole
# resolved graph, 1.90.0 is refused outright. The floor is set by `moq-nvenc`,
# not by str0m (1.85.0). Exit condition: a moq-nvenc release that lowers its own
# floor — nothing else in the graph declares above 1.88.
rust-version = "1.91.0"
publish = false
# spikes/ holds nested packages (each its own workspace root, so they never join
# this build). Excluding them keeps `cargo package`/`publish` from tripping over
# those manifests — spike 0.8 §12.
exclude = ["spikes"]

# Standalone on purpose, exactly like agent/host and desktop/src-tauri. An empty
# [workspace] table stops a future root Cargo.toml from absorbing this crate,
# and stops the spikes below it from being pulled in as members. Run every cargo
# command with this directory as the working directory, never --manifest-path,
# which silently drops .cargo/config.toml and with it +crt-static.
[workspace]

# A library half as well as the binary: the integration tests under tests/ can
# only reach these modules through a lib target.
[lib]
name = "owlette_swoop"
path = "src/lib.rs"

[[bin]]
name = "owlette-swoop"
path = "src/main.rs"

[features]
# NVENC is the first-class encoder (plan.md D7) and loads nvEncodeAPI64.dll by
# absolute path at runtime, so a non-NVIDIA box simply fails probe() rather than
# failing to start. Task 10.1 finalises the rest of this list and never adds
# `testhooks`.
default = ["encode-nvenc"]

encode-nvenc = ["dep:moq-nvenc"]
# The Intel/AMD/software backends are chosen by hardware measurement in spikes
# 6.7 and 7.2, so no crate is pinned for them yet: pinning a dependency nothing
# has established is used is worse than leaving it out (.claude/CLAUDE.md). The
# feature names exist now so Waves 6–10 never edit this manifest; the task that
# picks a backend adds its optional dependency to the matching line.
encode-ffmpeg = []
encode-vpl = []
encode-amf = []
# Media Foundation needs no new crate, only more of the windows bindings.
encode-mf = ["windows/Win32_Media_MediaFoundation"]
encode-openh264 = []
# Host-side TURN (plan.md D13, Task 7.4) is written on std UDP — str0m has no
# TURN client and we are not adding a second stack for one.
turn = []
audio-opus = []
# Non-default, and it must stay that way: it gates the bundle's test-only
# `overrides` object (Task 8.7). A streamer built without it rejects a bundle
# carrying `overrides` with exit 10.
testhooks = []

[dependencies]
# Exact (`=`) pins throughout. This crate ships as a binary onto customer
# machines, so the manifest and Cargo.lock agree on one version and any move is
# a deliberate edit. Where a pin holds a package BACK the comment names the
# constraint and what lifts it; the rest carry the standing exit condition — the
# dependency-currency review each release cycle (.claude/CLAUDE.md), which moves
# them unless a named constraint says otherwise.

# WebRTC, sans-IO (plan.md D4). G1 chose arm B — an RTP media track rendered
# into a <video> — which is str0m's mature path: the libwebrtc GoogCC port,
# NACK/RTX, the RFC 7798 H.265 packetizer and per-packet header extensions
# (which is how playout-delay is set). No [patch] table: arm A's sctp-proto
# patches are not on the chosen path and stay in the spike.
# 0.23.1 exactly because that is the release the bake-off measured end to end
# against Chrome 153. Exit condition: 0.24, re-measured on the LAN row.
#
# default-features = false drops aws-lc-rs (needs NASM on Windows) and the
# `examples` feature (rouille + rustls). No OpenSSL, no C toolchain, nothing new
# in the installer.
#
# `wincrypto-dimpl`, NOT `wincrypto`: the plain feature does DTLS through
# SChannel, and against Chrome 153 every handshake fails with "crypto error:
# decryption failed" (spike 0.2 §13.4). `wincrypto-dimpl` keeps Windows CNG for
# SRTP and hashing and does DTLS in str0m's own `dimpl`. Exit condition: str0m
# PR #1038 removes SChannel outright, and the feature name goes with it.
#
# Carried forward, not solved here: str0m's pacer is unusable as configured —
# BWE on measured 1015.6 ms p50 of pacer queue with zero loss, PLI or NACK, so
# it presents as latency and never as loss. That lands on Tasks 3.8 and 4.7.
str0m = { version = "=0.23.1", default-features = false, features = ["wincrypto-dimpl"] }

# The bundle, the stdin/stdout event lines, the signaling messages and `probe`
# output are all JSON. `derive` because every one of those is a struct.
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

# Typed errors per module (thiserror) with one anyhow chain at the process
# boundary, so a failure maps onto an exit code instead of a panic.
thiserror = "=2.0.20"
anyhow = "=1.0.104"

# JWT segments are base64url without padding; hex is for the golden-vector
# fixtures and for ids in log lines.
base64 = "=0.23.1"
hex = "=0.4.3"

# plan.md D8: k = HKDF(K_session, viewerId), and the host MACs its DTLS
# fingerprint + sid with it. One RustCrypto generation across all three or the
# digest traits do not line up.
hmac = "=0.13.0"
sha2 = "=0.11.0"
hkdf = "=0.13.0"

# The streamer verifies viewer JWTs itself (EdDSA), independently of the Worker,
# using the public key delivered in the bundle.
ed25519-dalek = "=3.0.0"

# Bundle secrets and derived keys are wiped on drop; `derive` for the
# ZeroizeOnDrop the bundle types need.
zeroize = { version = "=1.9.0", features = ["derive"] }

# Single-use `jti` values and DTLS/ICE nonces.
rand = "=0.10.2"

# capture → encode → per-viewer sender hand-offs. Bounded channels with
# try_send are how a slow viewer drops frames instead of stalling capture.
crossbeam-channel = "=0.5.17"

# Logging facade only: the one sink is the size-capped rotating writer in
# src/log.rs. No env_logger — the streamer has no console to log to. `std`
# because `set_boxed_logger` is gated behind it.
log = { version = "=0.4.34", features = ["std"] }

# Vendor DLLs (NVENC, and whatever spike 6.7 picks) are loaded by absolute path
# at runtime, never linked. Exit condition: none — this is how the binary stays
# startable on a machine with no GPU vendor runtime at all.
libloading = "=0.9.0"

# Windows-only, declared here so `cargo check` still resolves on a macOS or
# Linux host (Wave 9 adds the siblings, and until then the modules that use
# these bindings are behind #[cfg(windows)]).
[target.'cfg(windows)'.dependencies]
# Every Win32 subsystem this crate's modules use, declared up front because a
# Wave 3+ task must not edit this manifest: Direct3D11/DXGI for capture and the
# GPU convert/scale path, Gdi + HiDpi for display geometry, KeyboardAndMouse for
# injection, StationsAndDesktops for the secure desktop, DataExchange + Memory
# for the clipboard, Media_Audio for the WASAPI loopback capture, Devices_Display
# for the display topology, LibraryLoader for the DLL search path, Performance
# for QPC timestamps. 0.62 is the version all three spikes measured against.
windows = { version = "=0.62.2", features = [
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

# NVENC bindings, behind `encode-nvenc`. The only crate on crates.io that
# vendors pre-generated nvEncodeAPI bindings AND dlopens the entry points, so
# there is no Video Codec SDK zip and no libclang in the build, and the binary
# still links on a builder with no NVIDIA driver (spikes 0.9 and 0.2).
# Pinned at 0.0.5 — a 0.0.x crate has no compatible-update guarantee at all, so
# the pin is the only thing keeping the vendored NVENCAPI header stable. It also
# sets this crate's MSRV. Exit condition: read its changelog at the
# dependency-currency review; a bump re-runs spike 0.9's validation.
moq-nvenc = { version = "=0.0.5", optional = true }

[build-dependencies]
# Embeds the VERSIONINFO resource and icon (see build.rs). Same crate agent/host
# and the Tauri desktop build already use, so it is not new to this repo.
# Exit condition: the standing dependency-currency review.
winresource = "=0.1.31"

[profile.release]
# Copied from agent/host/Cargo.toml with its comment, because the reason is the
# reason and not a preference. It is written about owlette-host.exe; it binds
# every Rust binary this repo ships.
#
# A supervisor spends its life asleep, so size was the only thing this profile
# optimised for — `opt-level = "z"`, full LTO, one codegen unit, symbols
# stripped. On 2026-09-08 Defender's ML classifier (signature set 1.459.111.0)
# started quarantining that image as Trojan:Win32/Bearfoos.B!ml: a small,
# dense, stripped, statically-linked, metadata-free PE is the profile of a
# packed dropper, and the classifier scores static features, not behaviour.
#
# So the profile now looks like an ordinary release build instead of the
# densest image the toolchain can produce. The cost is ~100-200 KB on a 43 MB
# installer. `+crt-static` in .cargo/config.toml is deliberately KEPT: dropping
# it reintroduces the VCRUNTIME140 fleet failure that 3.2.3 shipped to fix.
#
# This is a change to the classifier's inputs, not a guarantee. A rebuilt
# candidate must be scanned (MpCmdRun -Scan -ScanType 3 -File <copy>
# -DisableRemediation) before it is packaged, and the durable fix is signing.
opt-level = 2
lto = "thin"
strip = false
