[package]
name = "owlette-desktop"
version = "3.3.5"
description = "owlette desktop app"
authors = ["Tridant Inc."]
license = "FSL-1.1-Apache-2.0"
repository = "https://github.com/tridant-io/owlette"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# main.rs calls into this crate; renaming the package does not rename the lib,
# so keep the two in sync if either changes.
name = "owlette_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
# `preserve_order` is load-bearing: without it serde_json sorts object keys and
# every desktop write would reshuffle the operator's config.json — including the
# firebase block the service owns.
serde_json = { version = "1.0", features = ["preserve_order"] }
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# `tray-icon` builds the notification-area icon that replaces pystray;
# `image-png` is what lets `Image::from_bytes` decode the embedded tray icons.
tauri = { version = "2.11.3", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
# Native file/folder pickers for the process detail form — the same Win32 common
# dialogs the legacy GUI opened through tkinter.
tauri-plugin-dialog = "2"
# Degraded-state toasts, the equivalent of pystray's `icon.notify`. Driven from
# Rust only (the tray monitor), so there is no matching npm package.
tauri-plugin-notification = "2"
# Registered for the next task's filesystem browsing; no frontend usage yet.
tauri-plugin-fs = "2"
# Seam-file watching, which notify does on all three platforms.
notify = "8"

# The SCM, the named mutex and WM_CLOSE have no analogue off Windows, so the
# crates behind them build only there.
[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Storage_EnhancedStorage", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_SystemInformation", "Win32_System_Variant", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_Security"] }

# `gethostname(2)`, for the name the fleet records this machine under; the
# Windows arm asks GetComputerNameExW for the same string. Off Windows the app
# also serves the daemon's GUI job seam, which needs flock, the file modes the
# data-root table sets and a pipe to a spawned child.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The X11 screen grab behind the seam's `capture` job, taken in process through
# the toolkit tauri already links on linux (`gdk` and the `gdk-pixbuf` it
# re-exports are both in this crate's tree through tauri-runtime-wry). A stock
# Ubuntu kiosk ships no screenshot binary to shell out to, and this is the same
# library the window system is already talking to.
[target.'cfg(target_os = "linux")'.dependencies]
gdk = "0.18"
