[package]
name = "owlette-desktop"
version = "4.1.27"
description = "owlette desktop app"
authors = ["Tridant Inc."]
license = "FSL-1.1-Apache-2.0"
repository = "https://github.com/tridant-io/owlette"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# main.rs calls into this crate; renaming the package does not rename the lib,
# so keep the two in sync if either changes.
name = "owlette_desktop_lib"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
# `preserve_order` is load-bearing: without it serde_json sorts object keys and
# every desktop write would reshuffle the operator's config.json — including the
# firebase block the service owns.
# `float_roundtrip` is too: without it about one create_time in twenty is read a
# double off, so a desktop write of app_states.json breaks the service's identity
# records, and terminate_pid refuses the process the service recorded.
serde_json = { version = "1.0", features = ["preserve_order", "float_roundtrip"] }
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# `tray-icon` builds the notification-area icon that replaces pystray;
# `image-png` is what lets `Image::from_bytes` decode the embedded tray icons.
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
# Native file/folder pickers for the process detail form — the same Win32 common
# dialogs the legacy GUI opened through tkinter.
tauri-plugin-dialog = "2"
# Degraded-state toasts, the equivalent of pystray's `icon.notify`. Driven from
# Rust only (the tray monitor), so there is no matching npm package.
tauri-plugin-notification = "2"
# The drag-drop classifier's exists/readDir/stat (desktop/src/lib/fsProbe.ts),
# held to metadata by the `fs:` lines in capabilities/default.json.
tauri-plugin-fs = "2"
notify = "8"

# flock(2) and kill(2) for the json lock and process control off windows
# (tri-platform tasks 4.2/4.3). already in the lock file through tauri; a
# direct dependency because this crate calls it itself.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# the notification plugin's own linux backend, already in the lock file
# through it; a direct dependency because the plugin sends a notification
# with no app name and no desktop-entry hint, so gnome titles it after the
# process ("owlette-desktop") and cannot find the app's icon.
# zbus, already in the lock file through notify-rust, for the session's idle
# inhibitor (awake.rs); its blocking api adds no packages.
[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4"
zbus = "5"

# appkit, for the one thing tauri does not expose: the toolbar that gives a
# window the macos 26 corner radius (mac_window.rs). both crates are already in
# the lock file through tauri; the features name the classes this crate uses.
# NSString also names the IOKit power assertions (awake.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSToolbar", "NSWindow", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSString"] }

# the scm, the named mutex and WM_CLOSE are windows; the other two desktops do
# not build these at all (tri-platform task 4.1).
[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Storage_EnhancedStorage", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Threading", "Win32_System_Power", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_Security"] }
