<!doctype html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <!-- next-themes sets the class only once react has mounted, after the window has
         painted; resolving it here the same way keeps a light window from showing a
         dark first frame. `dark` stays when this cannot run. -->
    <script>
      if (!matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.classList.replace('dark', 'light')
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>owlette</title>
  </head>
  <body class="font-sans antialiased text-foreground">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
