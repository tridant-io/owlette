# swoop signaling worker. one durable object per machine, on the websocket
# hibernation api, so an idle doorbell costs nothing.
#
# NO SECRETS IN THIS FILE, EVER — this repository is public. SWOOP_JWT_PUBLIC_KEY,
# SWOOP_JWT_KID, SWOOP_JWT_PUBLIC_KEY_PREV, SWOOP_JWT_KID_PREV and
# SWOOP_SIGNAL_RING_SECRET arrive through `wrangler secret put` (task 3.4 owns the
# deploy workflow); locally they come from .dev.vars, which is gitignored.

name = "swoop-signal"
main = "src/index.ts"
# ed25519 needs no compatibility flag at this date: workerd accepts the algorithm
# identifier "Ed25519" outright (spike 0.4 §3.1, measured on workerd 1.20260917.1).
compatibility_date = "2026-09-01"
workers_dev = false

# sqlite-backed durable objects: the only kind the free plan will create and the
# default cloudflare recommends for new classes. the room stores a few bytes of
# replay state and nothing else.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["SignalRoom"]

[observability]
enabled = true

[[durable_objects.bindings]]
name = "SIGNAL_ROOM"
class_name = "SignalRoom"

# durable_objects is a non-inheritable key, so every environment repeats it.

# custom domains, one label deep on purpose. the zone's universal certificate is
# `*.owlette.app` + `owlette.app`, and a wildcard matches exactly one label — so
# `signal.dev.owlette.app` would not be covered and every wss dial would fail the
# handshake. a deeper name needs advanced certificate manager; these two do not.
#
# a custom domain on a subdomain is independent of the apex load balancer, so this
# does not touch the railway/vercel failover on owlette.app.
#
# these need `zone -> workers routes -> edit` on the deploy token, on top of the
# account-level workers permissions.

[env.dev]
name = "swoop-signal-dev"
routes = [{ pattern = "signal-dev.owlette.app", custom_domain = true }]

[[env.dev.durable_objects.bindings]]
name = "SIGNAL_ROOM"
class_name = "SignalRoom"

[env.prod]
name = "swoop-signal-prod"
routes = [{ pattern = "signal.owlette.app", custom_domain = true }]

[[env.prod.durable_objects.bindings]]
name = "SIGNAL_ROOM"
class_name = "SignalRoom"
